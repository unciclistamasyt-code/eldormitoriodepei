<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>&nbsp;</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content=" " />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
<style>
  .dateLabel {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  .list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
  }

  .check {
    width: 21px;
    height: 21px;
    border-radius: 50%;
    border: 1px solid var(--text-dim);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .check svg {
    width: 12px; height: 12px;
    opacity: 0;
    transition: opacity 0.15s ease;
    stroke: var(--bg);
  }
  .row.done .check {
    background: var(--text);
    border-color: var(--text);
  }
  .row.done .check svg { opacity: 1; }

  .text {
    flex: 1;
    font-size: 16px;
    line-height: 1.4;
    word-break: break-word;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .row.done .text {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  .del {
    opacity: 0.3;
    font-size: 16px;
    padding: 4px 6px;
    flex-shrink: 0;
  }

  .empty {
    color: var(--text-dim);
    text-align: center;
    font-size: 14px;
    margin-top: 40px;
  }

  .addRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    margin-top: 10px;
  }
  .addRow input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 16px;
    padding: 10px 2px;
    outline: none;
  }
  .addRow input::placeholder { color: var(--text-dim); }
  .addBtn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5 L8 12 L15 19"/></svg>
      </a>
      <div class="spacer"></div>
    </div>

    <div class="dateLabel fade-in" id="dateLabel"></div>

    <div class="list fade-in" id="list"></div>

    <div class="addRow fade-in">
      <input id="addInput" type="text" placeholder="agregar..." maxlength="140" />
      <button class="addBtn" id="addBtn">+</button>
    </div>
  </div>

<script>
function todayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `checklist_${y}-${m}-${day}`;
}

const KEY = todayKey();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function save(items) {
  localStorage.setItem(KEY, JSON.stringify(items));
}

let items = load();

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '—';
    list.appendChild(e);
    return;
  }
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row' + (item.done ? ' done' : '');

    const check = document.createElement('div');
    check.className = 'check';
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M4 12 L9 17 L20 6"/></svg>';
    check.addEventListener('click', () => {
      item.done = !item.done;
      save(items);
      render();
    });

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = item.text;

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', () => {
      items = items.filter(i => i.id !== item.id);
      save(items);
      render();
    });

    row.appendChild(check);
    row.appendChild(text);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function addItem() {
  const input = document.getElementById('addInput');
  const val = input.value.trim();
  if (!val) return;
  items.push({ id: Date.now() + Math.random(), text: val, done: false });
  save(items);
  input.value = '';
  render();
}

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('addInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addItem();
});

const dateLabel = document.getElementById('dateLabel');
dateLabel.textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
