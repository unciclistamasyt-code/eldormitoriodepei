        title: 'Swingweight: qué mide realmente y cómo se calcula',
        minutes: 6,
        imgs: [{"url": "https://images.unsplash.com/photo-1595884537801-be390dd9935a?w=1200&q=80&auto=format&fit=crop", "alt": "Medición de swingweight de un palo de golf", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1592967449177-d88a95223c86?w=1200&q=80&auto=format&fit=crop", "alt": "Medición de swingweight de un palo de golf", "credit": "Unsplash"}],
        content: `
          <p>Hay un nivel de conocimiento de taller que va más allá de lo que necesita un vendedor de piso para recomendar el palo correcto, pero que te separa del resto cuando un cliente pregunta por qué dos palos del "mismo peso" se sienten completamente distintos en la mano. Ese es el terreno de este nivel: <span class="term">clubmaking</span> y <span class="term">fitting</span> técnico — el oficio de construir y ajustar palos a medida, no solo de venderlos de catálogo.</p>
          <p>El <span class="term">swingweight</span> no mide el peso total del palo — mide <b>cómo se distribuye</b> ese peso a lo largo del palo, es decir, qué tan "pesado" se siente en el swing. Dos palos pueden pesar exactamente los mismos gramos en una balanza de cocina y sentirse completamente distintos si uno tiene más masa concentrada hacia la cabeza y el otro hacia el grip.</p>
          <p>Se mide con una balanza de swingweight usando el <span class="term">método del fulcro de 14 pulgadas</span>: el palo se apoya sobre un punto de apoyo ubicado exactamente a 14 pulgadas del extremo del grip, y la balanza lee qué tan desbalanceado queda hacia la cabeza. El resultado se expresa en una escala de letra y número que va de <b>A0 a F9</b>, donde cada letra completa (de A a B, de B a C, etc.) equivale aproximadamente a 4 puntos de esa escala.</p>
          <p>En la práctica, los sets de hierros y drivers de hombres adultos suelen construirse alrededor de <b>D0 a D2</b>; los sets pensados para mujeres o jugadores senior suelen ubicarse más cerca de <b>C5 a C8</b>. Son rangos típicos de la industria, no un número obligatorio — el swingweight correcto final depende del jugador, su velocidad de swing y su preferencia de sensación.</p>
          <p>Una referencia muy usada en el banco de taller, útil para estimar ajustes rápidos sin tener que probar varias veces: agregar o quitar <b>unos 2 gramos de peso en la cabeza</b> cambia aproximadamente 1 punto de swingweight. Vale aclarar que esta equivalencia es una regla práctica de oficio, no una constante física exacta — varía levemente según el largo del palo y dónde exactamente se agrega el peso.</p>
        `,
        summary: 'El swingweight mide cómo se distribuye el peso de un palo, no su peso total. Se calcula con el método del fulcro de 14 pulgadas y se expresa en una escala de A0 a F9, donde cada letra equivale a unos 4 puntos. Los sets de hombres suelen rondar D0-D2 y los de mujeres/senior C5-C8. Una referencia de oficio: unos 2 gramos de peso en la cabeza cambian aproximadamente 1 punto de swingweight.',
        quiz: [
          { q: '¿Qué mide realmente el swingweight de un palo?', options: ['El peso total del palo en gramos', 'Cómo se distribuye el peso a lo largo del palo — la sensación de peso durante el swing, no el peso total', 'La longitud exacta del palo', 'El ángulo de lie del palo'], correct: 1, explain: 'Dos palos pueden pesar lo mismo en una balanza de cocina y sentirse muy distintos si la masa está distribuida de forma diferente — eso es lo que el swingweight captura.' },
          { q: '¿Qué escala se usa para expresar el swingweight?', options: ['De 1 a 10', 'Una escala de letra y número, de A0 a F9, donde cada letra completa equivale a unos 4 puntos', 'En kilogramos', 'En pulgadas de largo'], correct: 1, explain: 'La escala A0-F9 es el estándar de la industria para expresar swingweight, con cada letra completa representando aproximadamente 4 puntos.' },
          { q: '¿Cómo se mide el swingweight en el banco de taller?', options: ['Con una balanza de swingweight, usando el método del fulcro de 14 pulgadas desde el extremo del grip', 'Pesando el palo completo en una balanza digital común', 'Midiendo el largo del shaft con una cinta métrica', 'Contando las oscilaciones por minuto del shaft'], correct: 0, explain: 'El método del fulcro de 14 pulgadas apoya el palo en un punto exacto y lee el desbalance hacia la cabeza — esa es la base física de la medición de swingweight.' },
          { q: '¿Qué regla práctica de oficio se usa para estimar cuánto cambia el swingweight al agregar peso en la cabeza?', options: ['1 gramo siempre equivale a 5 puntos exactos', 'Aproximadamente 2 gramos de peso en la cabeza cambian 1 punto de swingweight — una referencia de oficio, no una constante física exacta', 'El peso en la cabeza nunca afecta el swingweight', 'Solo el peso del grip afecta el swingweight'], correct: 1, explain: 'Es una regla práctica muy citada en el oficio para estimar ajustes rápidos, aunque varía levemente según el largo del palo y dónde se agrega el peso.' },

      {
        id: 'n6m2',
        title: 'Lie y loft: el ajuste que más cambia tu impacto',
        minutes: 7,
        imgs: [{"url": "https://images.unsplash.com/photo-1731694411560-050e5b91e943?w=1200&q=80&auto=format&fit=crop", "alt": "Ajuste de lie y loft de un palo de golf", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1627307886605-309bba4cb9a5?w=1200&q=80&auto=format&fit=crop", "alt": "Ajuste de lie y loft de un palo de golf", "credit": "Unsplash"}],
        content: `
          <p>El <span class="term">lie angle</span> es el ángulo entre la línea central del shaft y el suelo, medido con la cabeza del palo asentada completamente plana (<span class="term">sole flat</span>). El <span class="term">loft</span> es el ángulo de la cara del palo respecto a la vertical. Son dos de las especificaciones más importantes de un fitting completo, y a diferencia del swingweight, un lie angle incorrecto afecta directamente hacia dónde viaja la bola, no solo cómo se siente el palo.</p>
          <p>En el taller, ambos se miden con precisión en una <span class="term">máquina de lie-loft</span>, pero la forma de verificarlos en la práctica, con el jugador real golpeando bolas, es la <span class="term">cinta de impacto</span>: se pega una cinta especial en la suela del palo y, después de varios golpes, la marca que deja revela si el contacto fue centrado, hacia el <span class="term">toe</span> (punta) o hacia el <span class="term">heel</span> (tacón) — señal de que el lie angle está mal ajustado para ese jugador.</p>
          <p>Una referencia de oficio citada por varias fuentes de fitting, útil para explicarle a un cliente por qué vale la pena corregir el lie angle: un error de lie de un grado suele traducirse en aproximadamente <b>1 a 2 yardas de desvío lateral por cada 100 yardas de distancia de tiro</b> — el desvío crece con la distancia del golpe. Hay que presentarlo como una guía aproximada, no como una constante exacta, porque distintas fuentes de fitting dan cifras levemente distintas.</p>
          <p>El ajuste físico se hace en una <span class="term">máquina de banqueo</span> (bending machine, tipo Mitchell o Hireko), que dobla el hosel del palo con una palanca calibrada. Las cabezas de hierro <b>forjadas en acero</b> suelen tolerar un ajuste de alrededor de <b>±2°</b> desde la especificación de fábrica sin riesgo; las cabezas <b>fundidas</b> (cast) toleran considerablemente menos antes de arriesgarse a fisurar.</p>
          <p>Un punto que todo clubmaker tiene que chequear antes de prometer un ajuste: muchas cabezas modernas de madera o driver con cuerpo hueco multi-material, o con <span class="term">insertos</span> en la cara, vienen marcadas explícitamente por el fabricante como <b>no ajustables</b> — intentar banquearlas puede fisurar el cuerpo o dañar el inserto de la cara de forma irreversible. Revisar la especificación del fabricante antes de poner cualquier cabeza en la máquina de banqueo no es opcional.</p>
        `,
        summary: 'Lie angle es el ángulo entre el shaft y el suelo con la cabeza asentada plana; loft es el ángulo de la cara. Se miden en una máquina de lie-loft y se verifican con cinta de impacto en la suela. Un grado de error de lie puede desviar la bola 1-2 yardas por cada 100 yardas, como referencia aproximada. Las cabezas forjadas en acero toleran banqueo de hasta ±2°, pero muchas cabezas huecas multi-material o con insertos vienen marcadas por el fabricante como no ajustables.',
        quiz: [
          { q: '¿Qué es el lie angle de un palo de golf?', options: ['El ángulo de la cara del palo respecto a la vertical', 'El ángulo entre la línea central del shaft y el suelo, con la cabeza asentada plana', 'La longitud total del palo', 'El peso de la cabeza del palo'], correct: 1, explain: 'El lie angle se mide entre la línea central del shaft y el suelo cuando la cabeza está asentada completamente plana (sole flat); el loft, en cambio, es el ángulo de la cara.' },
          { q: '¿Cómo se verifica en la práctica, con golpes reales, si el lie angle de un jugador está bien ajustado?', options: ['Con una cinta de impacto en la suela, viendo si la marca queda centrada, hacia el toe o hacia el heel', 'Pesando el palo antes y después de cada golpe', 'Midiendo la velocidad de swing con un radar', 'Contando cuántos golpes da el jugador por ronda'], correct: 0, explain: 'La cinta de impacto en la suela revela, después de varios golpes, si el contacto fue centrado o se desplazó hacia el toe o el heel — señal directa de un lie angle mal ajustado.' },
          { q: '¿Qué tipo de cabeza de hierro suele tolerar mejor el ajuste de lie/loft en una máquina de banqueo?', options: ['Cabezas fundidas (cast), que toleran más que las forjadas', 'Cabezas forjadas en acero, que suelen tolerar alrededor de ±2° desde la especificación de fábrica', 'Ninguna cabeza de hierro se puede ajustar nunca', 'Solo las cabezas de madera se pueden banquear'], correct: 1, explain: 'Las cabezas forjadas en acero son más maleables y suelen tolerar cerca de ±2° de ajuste; las cabezas fundidas toleran considerablemente menos antes de arriesgarse a fisurar.' },
          { q: '¿Qué cabezas de palo vienen frecuentemente marcadas por el fabricante como NO ajustables de lie/loft?', options: ['Todos los hierros sin excepción', 'Muchas cabezas de madera/driver con cuerpo hueco multi-material o con insertos en la cara, por riesgo de fisuras o daño al inserto', 'Únicamente los putters', 'Ninguna cabeza moderna tiene esta restricción'], correct: 1, explain: 'Revisar la especificación del fabricante antes de banquear cualquier cabeza no es opcional — varias cabezas huecas multi-material o con insertos de cara están explícitamente marcadas como no ajustables.' },
        ],
      },
      {
        id: 'n6m3',
        title: 'Shafts a fondo: frequency matching, tip trimming y el debate del spine',
        minutes: 7,
        imgs: [{"url": "https://images.unsplash.com/photo-1592967449177-d88a95223c86?w=1200&q=80&auto=format&fit=crop", "alt": "Frequency matching de shafts de golf", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1777554060049-0d26da211afe?w=1200&q=80&auto=format&fit=crop", "alt": "Frequency matching de shafts de golf", "credit": "Unsplash"}],
        content: `
          <p>Más allá de lo que ya viste sobre flex y launch monitors en el Nivel 3, el oficio de clubmaking tiene sus propias herramientas y mediciones específicas para ajustar un shaft con precisión de taller, antes incluso de que el jugador pegue una bola.</p>
          <p>El <span class="term">frequency matching</span> mide la rigidez real de un shaft en <span class="term">CPM</span> (ciclos por minuto), usando un <span class="term">analizador de frecuencia</span>: el shaft se sujeta fijo por el extremo del grip, se deflecta la punta con un peso calibrado, se suelta, y el aparato cuenta cuántas oscilaciones completa por minuto. Es una medición física directa de la rigidez, independiente de lo que diga la etiqueta de flex del fabricante.</p>
          <p>Los flex L, A/Sr, R, S y X están ordenados de menos a más CPM, pero hay que ser honesto sobre un matiz importante: no existe una tabla universal única de CPM por flex — los números varían según la marca, el largo probado y el sistema de medición de cada taller. Como referencia de oficio aproximada, cada escalón de flex suele estar separado por algo así como 10 a 15 CPM del siguiente, pero siempre conviene verificar contra la tabla específica del fabricante del shaft en cuestión.</p>
          <p>El <span class="term">tip trimming</span> (recortar el shaft desde la punta, antes de instalar la cabeza) es la forma más directa de afinar el flex: recortar desde la punta <b>rigidiza</b> el shaft (sube el CPM) y típicamente <b>baja o aplana el lanzamiento</b>, dando más control a cambio de algo de altura. Recortar desde el extremo del grip (<span class="term">butt trimming</span>), en cambio, afecta mucho más el <b>peso total y el swingweight</b> del palo armado, con un efecto mucho menor sobre la rigidez percibida — son dos ajustes distintos para dos propósitos distintos.</p>
          <p>Un tema que todo clubmaker serio tiene que presentar con honestidad, no como hecho resuelto: el <span class="term">spine alignment</span> (alinear el shaft según su punto de rigidez más consistente, verificado con un método llamado <span class="term">FLO</span>, flat line oscillation) es genuinamente <b>debatido</b> en la industria. Algunos clubmakers independientes afirman que alinear el spine mejora la dispersión de los golpes; pruebas controladas con robots de swing, hechas por testers independientes, no han encontrado un beneficio estadísticamente significativo, y los fabricantes de palos no alinean el spine en sus líneas de producción masiva. Presentarlo como ciencia resuelta en cualquier dirección sería deshonesto — lo correcto es explicarlo como una práctica que algunos defienden y que la evidencia independiente no ha terminado de confirmar.</p>
        `,
        summary: 'El frequency matching mide la rigidez real de un shaft en CPM con un analizador de frecuencia. Los flex de L a X están ordenados de menos a más CPM, pero no hay una tabla universal: varía por marca y sistema. Recortar la punta rigidiza el shaft y baja el lanzamiento; recortar el extremo del grip afecta más el peso y swingweight. El spine alignment/FLO es un tema genuinamente debatido: hay defensores, pero pruebas independientes con robots no encontraron beneficio estadísticamente significativo, y los fabricantes no lo usan en producción masiva.',
        quiz: [
          { q: '¿Qué mide el "frequency matching" de un shaft, expresado en CPM?', options: ['El precio del shaft en el mercado', 'La rigidez real del shaft (ciclos por minuto de oscilación), medida con un analizador de frecuencia', 'El color exacto del shaft', 'La cantidad de shafts vendidos por temporada'], correct: 1, explain: 'El analizador de frecuencia sujeta el shaft, deflecta la punta con un peso fijo, y cuenta las oscilaciones por minuto — una medición física directa de rigidez, independiente de la etiqueta de flex.' },
          { q: '¿Qué efecto tiene recortar un shaft desde la punta (tip trimming)?', options: ['Lo vuelve más flexible y sube el lanzamiento', 'Lo vuelve más rígido (sube el CPM) y típicamente baja o aplana el lanzamiento', 'No tiene ningún efecto medible', 'Solo cambia el color del shaft'], correct: 1, explain: 'Recortar desde la punta rigidiza el shaft y generalmente reduce el lanzamiento, dando más control a cambio de algo de altura.' },
          { q: '¿Qué efecto tiene recortar un shaft desde el extremo del grip (butt trimming), comparado con recortar desde la punta?', options: ['Afecta exactamente lo mismo que recortar desde la punta', 'Afecta principalmente el peso total y el swingweight del palo armado, con mucho menor efecto sobre la rigidez percibida', 'Vuelve el shaft inservible siempre', 'Solo se usa en putters'], correct: 1, explain: 'Son dos ajustes con propósitos distintos: tip trimming afecta principalmente la rigidez/lanzamiento, butt trimming afecta principalmente el peso y el swingweight.' },
          { q: '¿Qué dice este módulo sobre el spine alignment (FLO) de shafts?', options: ['Es una técnica comprobada científicamente sin ninguna duda', 'Es un tema genuinamente debatido: algunos clubmakers lo defienden, pero pruebas independientes con robots de swing no hallaron beneficio estadísticamente significativo, y los fabricantes no lo usan en producción masiva', 'No existe tal técnica en el oficio', 'Todos los fabricantes alinean el spine de sus shafts de producción'], correct: 1, explain: 'El módulo lo presenta honestamente como no resuelto: hay defensores dentro del oficio, pero la evidencia independiente controlada no confirma un beneficio claro, y no es una práctica de producción masiva.' },
        ],
      },
      {
        id: 'n6m4',
        title: 'Grips: core sizes, cinta de armado e instalación profesional',
        minutes: 6,
        imgs: [{"url": "https://images.unsplash.com/photo-1776245293168-dac97aebf9b8?w=1200&q=80&auto=format&fit=crop", "alt": "Instalación profesional de grips de golf", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1763111332218-bf71f80d258d?w=1200&q=80&auto=format&fit=crop", "alt": "Instalación profesional de grips de golf", "credit": "Unsplash"}],
        content: `
          <p>El grip es la pieza que más directamente toca al jugador en cada golpe, y su instalación tiene sus propias especificaciones técnicas que un clubmaker necesita conocer para ajustar el grosor final en la mano sin depender de "probar y ver".</p>
          <p>Los catálogos de grips publican su medida como <span class="term">core size</span> (el diámetro interno hueco del grip antes de instalarlo), y hay dos tamaños de referencia muy citados en la industria: <b>0.580"</b> y <b>0.600"</b>. El diámetro estándar del extremo (butt) de la gran mayoría de shafts es <b>0.600"</b> — así que un grip de core 0.600" calza directo y ajustado sobre el shaft sin necesitar nada extra, mientras que un grip de core 0.580" necesita vueltas adicionales de cinta para compensar esa diferencia de 0.020" y lograr un calce correcto.</p>
          <p>Ahí está la clave de por qué se usa deliberadamente un grip de core más chico con cinta extra en vez de simplemente instalar el de 0.600" directo: las vueltas adicionales de <span class="term">cinta doble faz</span> permiten afinar el grosor final del grip en la mano del jugador en pasos muy finos, sin tener que cambiar de shaft ni de modelo de grip — cada vuelta extra suma una capa pequeña de buildup. Los grips <span class="term">jumbo</span> (para manos grandes o jugadores que buscan reducir la tensión de agarre) directamente usan cores más grandes, de 0.620" o más, además de poder sumarles cinta extra igual que cualquier otro grip.</p>
          <p>El proceso de instalación en el banco de taller sigue un orden fijo: se corta la cinta doble faz a la medida exacta del grip y se la envuelve sobre el shaft (en espiral o derecha, según preferencia), se retira el papel protector de la cinta, se aplica <span class="term">solvente de grip</span> (un líquido similar al alcohol mineral) generosamente dentro del grip y sobre la cinta ya pegada, y se desliza el grip hasta su posición final.</p>

/* Índice plano de todos los módulos con contenido real, para el repaso. */
function allUnlockedModules() {
  const out = [];
  CURRICULUM.forEach(level => {
    if (level.locked) return;
    level.modules.forEach(m => out.push(m));
  });
  return out;
}
function findModule(moduleId) {
  for (const level of CURRICULUM) {
    if (level.locked) continue;
    const m = level.modules.find(x => x.id === moduleId);
    if (m) return { level, module: m };
  }
  return null;
}
function levelStats(level) {
  if (level.locked) return { done: 0, total: level.modules.length };
  const done = level.modules.filter(m => progress.completed[m.id]).length;
  return { done, total: level.modules.length };
}

/* ================= Pronóstico de cuándo terminarías el curso =================
   Estimación honesta a partir de tu propio ritmo: cuántos minutos de
   contenido ya completaste y en cuántos días, proyectado sobre los
   minutos que faltan de TODO el curso (34 módulos, incluidos los que
   todavía están "próximamente"). No es una promesa, es una proyección. */
function allModulesFlat() {
  const out = [];
  CURRICULUM.forEach(level => level.modules.forEach(m => out.push(m)));
  return out;
}
function courseForecast() {
  const all = allModulesFlat();
  const totalMinutes = all.reduce((s, m) => s + m.minutes, 0);

  const idToMinutes = {};
  allUnlockedModules().forEach(m => { idToMinutes[m.id] = m.minutes; });

  const completedEntries = Object.entries(progress.completed);
  const completedCount = completedEntries.length;
  const completedMinutes = completedEntries.reduce((s, [id]) => s + (idToMinutes[id] || 0), 0);
  const remainingMinutes = Math.max(0, totalMinutes - completedMinutes);

  const scores = completedEntries.map(([, v]) => v.score && typeof v.score.pct === 'number' ? v.score.pct : null).filter(v => v !== null);
  const avgScorePct = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;

  let etaText = null;
  if (completedCount === 0) {
    etaText = 'Completá tu primer módulo para empezar a ver un pronóstico.';
  } else if (remainingMinutes <= 0) {
    etaText = '¡Ya completaste todo el contenido disponible del curso!';
  } else {
    const timestamps = completedEntries.map(([, v]) => v.at).sort((a, b) => a - b);
    const spanDays = (timestamps[timestamps.length - 1] - timestamps[0]) / 86400000;
    if (completedCount < 2 || spanDays < 1) {
      etaText = `Te faltan ${formatMinutes(remainingMinutes)} de contenido. Seguí completando módulos en distintos días para que la app calcule tu ritmo real y te dé una fecha estimada.`;
    } else {
      const paceMinutesPerDay = completedMinutes / spanDays;
      const daysLeft = Math.max(1, Math.ceil(remainingMinutes / paceMinutesPerDay));
      const target = new Date(Date.now() + daysLeft * 86400000);
      const dateStr = target.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
      etaText = `A tu ritmo actual (~${Math.round(paceMinutesPerDay)} min/día), terminarías el curso completo alrededor del ${dateStr} (~${daysLeft} días).`;
    }
  }

  return { totalMinutes, completedMinutes, remainingMinutes, completedCount, totalCount: all.length, avgScorePct, etaText };
}
function formatMinutes(min) {
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  const rem = min % 60;
  return rem ? `${h} h ${rem} min` : `${h} h`;
}

/* ================= Dashboard (racha, semana, heatmap, mes) =================
   Todo se deriva de los timestamps que ya guarda progress.completed[id].at —
   no hace falta ningún storage nuevo. */
function dayKey(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.toISOString().slice(0, 10);
}
function computeGolfStats() {
  const entries = Object.entries(progress.completed).filter(([, v]) => v && v.at);
  const byDay = {};
  entries.forEach(([, v]) => { const k = dayKey(v.at); byDay[k] = (byDay[k] || 0) + 1; });

  // Racha actual: cuenta hacia atrás desde hoy (si hoy no tiene actividad
  // todavía, no rompe la racha — simplemente empieza a contar desde ayer).
  let streak = 0;
  const cursor = new Date(); cursor.setHours(0, 0, 0, 0);
  if (!byDay[dayKey(cursor.getTime())]) cursor.setDate(cursor.getDate() - 1);
  while (byDay[dayKey(cursor.getTime())]) { streak++; cursor.setDate(cursor.getDate() - 1); }

  // Racha récord: la corrida más larga de días consecutivos con actividad.
  const sortedDays = Object.keys(byDay).sort();
  let record = 0, run = 0, prevD = null;
  sortedDays.forEach(k => {
    const d = new Date(k + 'T00:00:00');
    run = (prevD && Math.round((d - prevD) / 86400000) === 1) ? run + 1 : 1;
    record = Math.max(record, run);
    prevD = d;
  });

  // Semana actual (lunes a domingo) para la tira de días.
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const isoDow = (today.getDay() + 6) % 7; // 0=lunes
  const monday = new Date(today); monday.setDate(today.getDate() - isoDow);
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const count = byDay[dayKey(d.getTime())] || 0;
    week.push({ label: ['L', 'M', 'X', 'J', 'V', 'S', 'D'][i], active: !!count, count, isToday: dayKey(d.getTime()) === dayKey(today.getTime()) });
  }

  // Heatmap: últimas 20 semanas (140 días), 5 columnas por semana visualmente
  // en una grilla de 20 columnas x 7 filas, una celda por día.
  const heatDays = [];
  for (let i = 139; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const n = byDay[dayKey(d.getTime())] || 0;
    let cls = 'heatCell';
    if (n >= 5) cls += ' l5'; else if (n >= 3) cls += ' l4'; else if (n === 2) cls += ' l3'; else if (n === 1) cls += ' l2';
    heatDays.push(cls);
  }

  // Módulos completados por mes (últimos 6 meses con datos, o los últimos 6
  // meses calendario si no hay suficiente historial).
  const byMonth = {};
  entries.forEach(([, v]) => { const m = new Date(v.at).toISOString().slice(0, 7); byMonth[m] = (byMonth[m] || 0) + 1; });
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    const key = d.toISOString().slice(0, 7);
    months.push({ key, label: d.toLocaleDateString('es-ES', { month: 'short' }).replace('.', ''), count: byMonth[key] || 0 });
  }
  const monthMax = Math.max(1, ...months.map(m => m.count));

  return { streak, record, week, heatDays, months, monthMax };
}

/* ================= Navegación (pila de vistas) ================= */
let viewStack = [{ view: 'niveles' }];

function push(view, data) {
  stopSpeaking();
  viewStack.push({ view, data });
  render();
  document.getElementById('app').scrollTop = 0;
}
function back() {
  stopSpeaking();
  viewStack.pop();
  if (!viewStack.length) { window.location.href = 'index.html'; return; }
  render();
  document.getElementById('app').scrollTop = 0;
}
document.getElementById('backBtn').addEventListener('click', (e) => {
  e.preventDefault();
  back();
});

/* ================= Texto a voz (botón "escuchar") =================
   El botón lee el MÓDULO COMPLETO, no solo el resumen. Safari/iOS tiene
   un bug conocido donde speechSynthesis corta utterances largas a mitad
   de camino — se evita partiendo el texto en oraciones cortas (se hablan
   en cadena) y con un "watchdog" que hace pause()/resume() cada pocos
   segundos, que es el workaround estándar para ese bug. */

const VOICE_PREF_KEY = 'golf_voice_pref';
const AUDIO_RATE_KEY = 'golf_audio_rate';
let availableVoices = [];
let speakWatchdog = null;
let speakChain = null; // { chunks, idx, btn } — para poder cancelar
let audioRate = 1;
try { const savedRate = parseFloat(localStorage.getItem(AUDIO_RATE_KEY)); if (savedRate && savedRate > 0) audioRate = savedRate; } catch (e) {}

function setAudioRate(r) {
  audioRate = r;
  try { localStorage.setItem(AUDIO_RATE_KEY, String(r)); } catch (e) {}
  if (speakChain && speakChain.currentAudio) speakChain.currentAudio.playbackRate = r;
  initSpeedUI();
}
function initSpeedUI() {
  document.querySelectorAll('.speed-pill').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === audioRate);
  });
}

function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  availableVoices = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    refreshVoices();
    // Si estamos parados en una lección, redibujá para que aparezca el
    // selector de voz apenas el navegador termine de cargar las voces
    // (en muchos navegadores getVoices() llega vacío en el primer intento).
    const top = viewStack[viewStack.length - 1];
    if (top && top.view === 'leccion') render();
  };
}

/* Heurística para preferir voces que suenan más naturales/humanas:
   las voces "Enhanced"/"Premium"/"Neural" suelen ser mejores que las
   "compact" por defecto, cuando el dispositivo las tiene instaladas. */
function scoreVoice(v) {
  let score = 0;
  const name = (v.name || '').toLowerCase();
  if (v.lang && v.lang.toLowerCase().startsWith('es')) score += 100;
  if (/enhanced|premium|neural|natural|siri/.test(name)) score += 50;
  if (v.localService) score += 5;
  return score;
}
function voiceOptions() {
  if (!availableVoices.length) return [];
  const spanish = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
  const list = spanish.length ? spanish : availableVoices;
  return list.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a));
}
function getPreferredVoice() {
  const opts = voiceOptions();
  if (!opts.length) return null;
  let savedName = null;
  try { savedName = localStorage.getItem(VOICE_PREF_KEY); } catch (e) {}
  if (savedName) {
    const match = opts.find(v => v.name === savedName);
    if (match) return match;
  }
  return opts[0];
}
function setVoicePref(name) {
  try { localStorage.setItem(VOICE_PREF_KEY, name); } catch (e) {}
}

function stopSpeaking() {
  if (speakWatchdog) { clearInterval(speakWatchdog); speakWatchdog = null; }
  if (speakChain) {
    if (speakChain.currentAudio) {
      try { speakChain.currentAudio.pause(); speakChain.currentAudio.src = ''; } catch (e) {}
    }
    if (speakChain.btn) speakChain.btn.classList.remove('playing');
  }
  speakChain = null;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

/* Convierte el HTML de un módulo en texto plano hablable, agregando el
   título y el resumen final como cierre. */
function moduleSpeechText(m) {
  const tmp = document.createElement('div');
  tmp.innerHTML = m.content;
  tmp.querySelectorAll('li').forEach(li => { li.textContent = li.textContent.trim().replace(/[.:]?$/, '. '); });
  const raw = tmp.textContent.replace(/\s+/g, ' ').trim();
  return `${m.title}. ${raw} En resumen: ${m.summary}`;
}

function splitIntoChunks(text) {
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  let cur = '';
  sentences.forEach(s => {
    if ((cur + s).length > 180 && cur) { chunks.push(cur.trim()); cur = s; }
    else cur += s;
  });
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

/* ================= Voz "real" (Google Translate TTS) con fallback =================
   Por defecto, la app pide el audio de cada oración al endpoint público de
   Google Translate (el mismo que usa la librería gTTS) — da una voz en
   español mucho más natural y consistente que las voces del dispositivo,
   y no depende de qué voces tenga instaladas el iPhone. Es un endpoint NO
   oficial (no hay una API con clave detrás), así que puede fallar o dejar
   de funcionar sin aviso — por eso cada oración que falla (sin internet,
   bloqueado, lo que sea) cae automáticamente a la voz del dispositivo
   (speechSynthesis), sin que el usuario tenga que hacer nada. */

const GOOGLE_TTS_ENDPOINT = 'https://translate.google.com/translate_tts';

function googleTtsUrl(text) {
  const params = new URLSearchParams({ ie: 'UTF-8', q: text, tl: 'es', client: 'tw-ob' });
  return `${GOOGLE_TTS_ENDPOINT}?${params.toString()}`;
}

/* Reproduce un chunk con la voz de Google. Resuelve al terminar, rechaza
   si falla (sin internet, endpoint bloqueado, timeout, etc.). */
function playGoogleTtsChunk(text) {
  return new Promise((resolve, reject) => {
    const audio = new Audio(googleTtsUrl(text));
    audio.playbackRate = audioRate;
    let settled = false;
    const finish = (ok, err) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (speakChain && speakChain.currentAudio === audio) speakChain.currentAudio = null;
      ok ? resolve() : reject(err || new Error('google-tts-failed'));
    };
    const timer = setTimeout(() => { audio.pause(); finish(false, new Error('timeout')); }, 6000);
    audio.addEventListener('ended', () => finish(true));
    audio.addEventListener('error', () => finish(false, new Error('audio-error')));
    if (speakChain) speakChain.currentAudio = audio;
    audio.play().catch(err => finish(false, err));
  });
}

/* Reproduce un chunk con la voz del dispositivo (fallback). Nunca rechaza:
   si falla, simplemente sigue con el próximo chunk. */
function playSynthChunk(text, voice) {
  return new Promise((resolve) => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = voice ? voice.lang : 'es-ES';
    if (voice) utter.voice = voice;
    utter.rate = 0.98 * audioRate;
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    window.speechSynthesis.speak(utter);
  });
}

/* ================= Audio pregrabado (voz "real" de ElevenLabs) =================
   Algunos módulos tienen su audio grabado de antemano con una voz humana
   mucho más natural (ElevenLabs) — se reproduce desde Supabase Storage
   (bucket público site-media), y queda cacheado por el service worker tras
   la primera reproducción para funcionar offline después. Si el archivo no
   está o falla, cae al flujo en vivo de siempre (Google Translate TTS con
   fallback a la voz del dispositivo). */
const PREGEN_AUDIO_MODULES = new Set([
  'n1m1', 'n1m2', 'n1m3', 'n1m4', 'n1m5', 'n1m6', 'n1m7', 'n1m8',
  'n2m1', 'n2m2', 'n2m3', 'n2m4', 'n2m5', 'n2m6', 'n2m7', 'n2m8', 'n2m9',
  'n3m1', 'n3m2', 'n3m3', 'n3m4',
  'n4m1', 'n4m2', 'n4m3', 'n4m4', 'n4m5', 'n4m6',
  'n5m1', 'n5m2', 'n5m3', 'n5m4', 'n5m5', 'n5m6', 'n5m7',
  'n6m1', 'n6m2', 'n6m3', 'n6m4', 'n6m5', 'n6m6'
]);

const MEDIA_BASE_URL = 'https://ahritihlqnbjvcighhwb.supabase.co/storage/v1/object/public/site-media';

function pregenAudioUrl(moduleId) {
  return `${MEDIA_BASE_URL}/audio/${moduleId}.mp3`;
}

function playPregenAudio(moduleId, btn, text, fallbackVoice) {
  const audio = new Audio(pregenAudioUrl(moduleId));
  audio.playbackRate = audioRate;
  speakChain = { btn, currentAudio: audio };
  btn.classList.add('playing');
  const fallToLive = () => {
    if (!speakChain || speakChain.currentAudio !== audio) return;
    speakChain.currentAudio = null;
    speakWithLiveVoice(text, btn, fallbackVoice);
  };
  audio.addEventListener('ended', () => stopSpeaking());
  audio.addEventListener('error', fallToLive);
  audio.play().catch(fallToLive);
}

function toggleSpeak(text, btn, moduleId) {
  if (speakChain || (('speechSynthesis' in window) && window.speechSynthesis.speaking)) {
    stopSpeaking();
    return;
  }
  const fallbackVoice = getPreferredVoice();
  if (moduleId && PREGEN_AUDIO_MODULES.has(moduleId)) {
    playPregenAudio(moduleId, btn, text, fallbackVoice);
    return;
  }
  speakWithLiveVoice(text, btn, fallbackVoice);
}

function speakWithLiveVoice(text, btn, fallbackVoice) {
  const chunks = splitIntoChunks(text);
  speakChain = { chunks, idx: 0, btn, currentAudio: null };
  btn.classList.add('playing');
  // Si el primer chunk falla con Google, asumimos que no hay internet /
  // el endpoint está bloqueado, y usamos la voz del dispositivo para el
  // resto — así no esperamos un timeout de 6s por cada oración.
  let googleFailedThisPlayback = false;

  async function speakNext() {
    if (!speakChain) return;
    if (speakChain.idx >= speakChain.chunks.length) { stopSpeaking(); return; }
    const chunk = speakChain.chunks[speakChain.idx];
    if (!googleFailedThisPlayback) {
      try {
        await playGoogleTtsChunk(chunk);
        if (!speakChain) return;
        speakChain.idx++;
        speakNext();
        return;
      } catch (e) {
        googleFailedThisPlayback = true;
      }
    }
    if (!speakChain) return;
    if (!('speechSynthesis' in window)) { stopSpeaking(); return; }
    await playSynthChunk(chunk, fallbackVoice);
    if (!speakChain) return;
    speakChain.idx++;
    speakNext();
  }
  speakNext();

  // Watchdog contra el bug de Safari/iOS que corta utterances largas de
  // speechSynthesis — solo entra en juego cuando estamos en el fallback.
  speakWatchdog = setInterval(() => {
    if (!('speechSynthesis' in window)) return;
    if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) return;
    window.speechSynthesis.pause();
    window.speechSynthesis.resume();
  }, 4000);
}

/* ================= Render ================= */
function render() {
  const top = viewStack[viewStack.length - 1];
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (top.view === 'niveles') renderNiveles(app);
  else if (top.view === 'nivel') renderNivel(app, top.data);
  else if (top.view === 'leccion') renderLeccion(app, top.data);
  else if (top.view === 'quiz') renderQuiz(app, top.data);
  else if (top.view === 'repaso') renderRepaso(app, top.data);
}

/* ================= Hero / tarjeta "seguí donde ibas" / explorar =================
   Piezas nuevas inspiradas en los mockups que mandó el usuario (GolfBetter):
   banner con título grande + botón pill, tarjeta de "continuar" con barra de
   progreso, grilla de íconos para saltar a un nivel, y una fila de 3
   estadísticas con íconos. Todo se arma a partir de los mismos datos que ya
   existían (progress.completed, CURRICULUM, courseForecast/computeGolfStats). */
function nextIncompleteModule() {
  for (const level of CURRICULUM) {
    if (level.locked) continue;
    for (const m of level.modules) {
      if (!progress.completed[m.id]) return { level, module: m };
    }
  }
  return null;
}

function heroPhotoUrl() {
  const first = CURRICULUM[0] && CURRICULUM[0].modules[0];
  return first && first.imgs && first.imgs[0] ? first.imgs[0].url : null;
}

function renderHero(app, next) {
  const hero = document.createElement('div');
  hero.className = 'hero';
  const photo = heroPhotoUrl();
  hero.innerHTML = `
    <div class="hero-body">
      <div class="hero-eyebrow">⛳ Golf School</div>
      <h1 class="hero-title">Jugá mejor.<br><b>Cada ronda.</b></h1>
      <p class="hero-sub">Construí tu técnica, un módulo a la vez.</p>
      <div class="hero-cta">
        <svg viewBox="0 0 24 24"><path d="M6 4 L20 12 L6 20 Z"/></svg>
        <span>${next ? 'Seguir aprendiendo' : 'Repasar el curso'}</span>
      </div>
    </div>
    ${photo ? `<div class="hero-photo"><img src="${photo}" alt="" loading="lazy" /></div>` : ''}
  `;
  hero.querySelector('.hero-cta').addEventListener('click', () => {
    if (next) push('leccion', { moduleId: next.module.id });
    else if (Object.keys(progress.completed).length > 0) startRepaso();
  });
  app.appendChild(hero);
}

function ringSvg(pct) {
  const r = 24, c = 2 * Math.PI * r;
  const offset = c * (1 - pct / 100);
  return `
    <div class="ring-wrap">
      <svg viewBox="0 0 54 54">
        <circle class="ring-track" cx="27" cy="27" r="${r}" />
        <circle class="ring-fill" cx="27" cy="27" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}" />
      </svg>
      <div class="ring-pct">${pct}%</div>
    </div>
  `;
}

  if (!next) return;

  const photo = m.imgs && m.imgs[0] ? m.imgs[0].url : null;

  card.className = 'lesson-card';

function renderExploreGrid(app) {

function renderLearningPath(app, next) {
  const title = document.createElement('div');
  title.className = 'dashPanelTitle';
  title.textContent = 'Tu recorrido';
  app.appendChild(title);

  const track = document.createElement('div');
  track.className = 'pathTrack';
  CURRICULUM.forEach((level, idx) => {
    const stats = levelStats(level);
    let state = 'upcoming';
    if (!level.locked && stats.total > 0 && stats.done === stats.total) state = 'done';
    else if (next && level.id === next.level.id) state = 'current';
    else if (!level.locked && stats.done > 0) state = 'current';

    const step = document.createElement('div');
    step.className = 'pathStep';
    const circleInner = state === 'done'
      ? '<svg viewBox="0 0 24 24"><path d="M5 13 L10 18 L19 7"/></svg>'
      : state === 'upcoming'
        ? '<svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8 11 V8 a4 4 0 0 1 8 0 v3"/></svg>'
        : String(idx + 1);
    step.innerHTML = `
      <div class="pathCircle ${state}">${circleInner}</div>
      <div class="pathLabel">${level.name.replace('Nivel ', 'N.')}</div>
    `;
    if (!level.locked) step.addEventListener('click', () => push('nivel', { levelId: level.id }));
    track.appendChild(step);
    if (idx < CURRICULUM.length - 1) {
      const line = document.createElement('div');
      line.className = 'pathLine' + (state === 'done' ? ' done' : '');
      track.appendChild(line);

  });
  app.appendChild(track);
}

      <div class="reviewSub">${totalDone === 0 ? 'Completá al menos un módulo para desbloquearlo' : 'Quiz con preguntas de los ' + totalDone + ' módulo' + (totalDone === 1 ? '' : 's') + ' que ya completaste'}</div>
    </div>
    <svg class="chev" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>
  `;
  if (totalDone > 0) reviewBtn.addEventListener('click', () => startRepaso());
  app.appendChild(reviewBtn);

  renderProgressRow(app, fc, gs);

  const levelListTitle = document.createElement('div');
  levelListTitle.className = 'dashPanelTitle';
  levelListTitle.style.marginBottom = '10px';
  levelListTitle.textContent = 'Todos los niveles';
  app.appendChild(levelListTitle);

  CURRICULUM.forEach(level => {
    const stats = levelStats(level);
    const card = document.createElement('div');
    card.className = 'levelCard' + (level.locked ? ' locked' : '');
    card.innerHTML = `
      <div class="levelNum">${level.name.replace('Nivel ', '')}</div>
      <div class="levelBody">
        <div class="levelName">${level.name} — ${level.subtitle}</div>
        ${level.locked
          ? `<div class="levelSub">próximamente</div>`
          : `<div class="levelProgress">${stats.done}/${stats.total} módulos completados</div>
             <div class="levelBar"><div class="levelBarFill" style="width:${stats.total ? (stats.done / stats.total * 100) : 0}%"></div></div>`
        }
      </div>
      ${level.locked ? '' : '<svg class="chev" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>'}
    `;
    if (!level.locked) card.addEventListener('click', () => push('nivel', { levelId: level.id }));
    app.appendChild(card);
  });

  renderDashboard(app, fc, gs);
  renderBottomNav(app);
}

function renderNivel(app, data) {
  const level = CURRICULUM.find(l => l.id === data.levelId);

  const hint = document.createElement('div');
  hint.className = 'modMeta';
  hint.style.marginBottom = '10px';
  hint.textContent = 'Tocá el círculo para marcar o desmarcar un módulo como completado.';
  app.appendChild(hint);

  level.modules.forEach(m => {
    const done = !!progress.completed[m.id];
    const row = document.createElement('div');
    row.className = 'moduleRow' + (done ? ' done' : '');
    row.innerHTML = `
      <div class="modCheck"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M4 12 L9 17 L20 6"/></svg></div>
      <div class="modBody">
        <div class="modTitle">${m.title}</div>
        <div class="modMeta">${m.minutes} min · ${done ? 'completado' : 'sin empezar'}</div>
      </div>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>
    `;
    row.querySelector('.modCheck').addEventListener('click', (e) => {
      e.stopPropagation();
      if (progress.completed[m.id]) {
        delete progress.completed[m.id];
      } else {
        progress.completed[m.id] = { at: Date.now(), score: null, manual: true };
      }
      saveProgress(progress);
      render();
    });
    row.addEventListener('click', () => push('leccion', { moduleId: m.id }));
    app.appendChild(row);
  });
}

function renderLeccion(app, data) {
  const found = findModule(data.moduleId);
  if (!found) { app.innerHTML = '<div class="emptyHint">Módulo no encontrado.</div>'; return; }
  const { level, module: m } = found;

  const head = document.createElement('div');
  head.className = 'lessonHead';
  head.innerHTML = `
    <div class="lessonKicker">${level.name} · ${level.subtitle}</div>
    <div class="lessonTitle">${m.title}</div>
    <div class="lessonMeta">${m.minutes} min de lectura</div>
  `;
  app.appendChild(head);

  if (m.imgs && m.imgs.length) {
    const photos = document.createElement('div');
    photos.className = 'modPhotos';
    photos.innerHTML = m.imgs.map(im => `
      <figure>
        <img src="${im.url}" alt="${im.alt || ''}" loading="lazy" />
        <figcaption>${im.credit || ''}</figcaption>
      </figure>
    `).join('');
    app.appendChild(photos);
  }

  const listenRow = document.createElement('div');
  listenRow.className = 'listenRow';

  const listenBtn = document.createElement('div');
  listenBtn.className = 'listenBtn';
  listenBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z"/><path d="M17 9 a4 4 0 0 1 0 6"/></svg><span>Escuchar el módulo</span>`;
  listenBtn.addEventListener('click', () => toggleSpeak(moduleSpeechText(m), listenBtn, m.id));
  listenRow.appendChild(listenBtn);

  const voiceOpts = voiceOptions();
  if (voiceOpts.length > 1) {
    const select = document.createElement('select');
    select.className = 'voiceSelect';
    select.title = 'Voz de respaldo de tu dispositivo';
    const preferred = getPreferredVoice();
    voiceOpts.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name.replace(/^Microsoft |^Google /, '');
      if (preferred && v.name === preferred.name) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => setVoicePref(select.value));
    listenRow.appendChild(select);
  }
  app.appendChild(listenRow);

  const speedRow = document.createElement('div');
  speedRow.className = 'speed-row';
  speedRow.innerHTML = `
    <span class="speed-lbl">Velocidad</span>
    <div class="speed-pills">
      <button class="speed-pill" data-rate="0.75" onclick="setAudioRate(0.75)">0.75x</button>
      <button class="speed-pill" data-rate="1" onclick="setAudioRate(1)">1x</button>
      <button class="speed-pill" data-rate="1.25" onclick="setAudioRate(1.25)">1.25x</button>
      <button class="speed-pill" data-rate="1.5" onclick="setAudioRate(1.5)">1.5x</button>
      <button class="speed-pill" data-rate="2" onclick="setAudioRate(2)">2x</button>
    </div>
  `;
  app.appendChild(speedRow);

  const voiceHint = document.createElement('div');
  voiceHint.className = 'modMeta';
  voiceHint.style.marginTop = '-14px';
  voiceHint.style.marginBottom = '18px';
  voiceHint.textContent = PREGEN_AUDIO_MODULES.has(m.id)
    ? 'Este módulo tiene audio grabado con una voz humana real (no una síntesis).'
    : 'Por defecto "Escuchar el módulo" usa una voz en español más natural. Si falla, cae automáticamente a la voz de tu dispositivo elegida arriba — que no incluye "Siri Voice": eso es una limitación de iOS, Safari solo expone al selector las voces descargadas en Ajustes → Accesibilidad → Contenido hablado → Voces, nunca la voz de Siri en sí.';
  app.appendChild(voiceHint);
  initSpeedUI();

  const body = document.createElement('div');
  body.className = 'lessonBody';
  body.innerHTML = m.content;
  app.appendChild(body);

  const summaryBox = document.createElement('div');
  summaryBox.className = 'summaryBox';
  summaryBox.innerHTML = `<div class="summaryLabel">Resumen</div><div class="summaryText">${m.summary}</div>`;
  app.appendChild(summaryBox);

  const quizBtn = document.createElement('div');
  quizBtn.className = 'primaryBtn';
  quizBtn.textContent = progress.completed[m.id] ? 'Repetir el quiz' : 'Empezar el quiz';
  quizBtn.addEventListener('click', () => push('quiz', { moduleId: m.id }));
  app.appendChild(quizBtn);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuiz(app, data) {
  const found = findModule(data.moduleId);
  if (!found) { app.innerHTML = '<div class="emptyHint">Módulo no encontrado.</div>'; return; }
  runQuizSession(app, found.module.quiz, {
    onFinish: (score) => {
      progress.completed[found.module.id] = { at: Date.now(), score };
      saveProgress(progress);
    },
    finishLabel: 'Volver al módulo',
    onFinishNav: () => { viewStack.pop(); render(); },
  });
}

function startRepaso() {
  const pool = [];
  allUnlockedModules().forEach(m => {
    if (progress.completed[m.id]) pool.push(...m.quiz.map(q => ({ ...q, _mod: m.title })));
  });
  const picked = shuffle(pool).slice(0, 10);
  push('repaso', { questions: picked });
}

function renderRepaso(app, data) {
  if (!data.questions.length) {
    app.innerHTML = '<div class="emptyHint">Todavía no hay suficientes módulos completados para armar un repaso.</div>';
    return;
  }
  runQuizSession(app, data.questions, {
    isRepaso: true,
    finishLabel: 'Volver',
    onFinishNav: () => { viewStack.pop(); render(); },
  });
}

/* Calificación cualitativa a partir del porcentaje de aciertos. */
function gradeLabel(pct) {
  if (pct === 100) return '¡Perfecto!';
  if (pct >= 80) return 'Muy bien';
  if (pct >= 60) return 'Bien, pero conviene repasar';
  return 'Convendría repasar el módulo de nuevo';
}

/* Motor de quiz reusado tanto por el quiz de módulo como por el repaso.
   Cada pregunta da retroalimentación inmediata (correcto/incorrecto +
   explicación) y el avance a la siguiente pregunta es manual, para que
   haya tiempo de leerla en vez de saltar sola. */
function runQuizSession(app, questions, opts) {
  let idx = 0;
  let correctCount = 0;

  function renderQuestion() {
    app.innerHTML = '';
    const q = questions[idx];

    const prog = document.createElement('div');
    prog.className = 'quizProgress';
    prog.textContent = `Pregunta ${idx + 1} de ${questions.length}` + (opts.isRepaso && q._mod ? ' · ' + q._mod : '');
    app.appendChild(prog);

    const qEl = document.createElement('div');
    qEl.className = 'quizQ';
    qEl.textContent = q.q;
    app.appendChild(qEl);

    const optEls = [];
    q.options.forEach((opt, i) => {
      const optEl = document.createElement('div');
      optEl.className = 'quizOpt';
      optEl.textContent = opt;
      optEl.addEventListener('click', () => onAnswer(i));
      app.appendChild(optEl);
      optEls.push(optEl);
    });

    function onAnswer(i) {
      optEls.forEach(el => el.replaceWith(el.cloneNode(true))); // saca listeners, evita doble click
      const freshEls = app.querySelectorAll('.quizOpt');
      const isCorrect = i === q.correct;
      if (isCorrect) correctCount++;
      freshEls[i].classList.add(isCorrect ? 'correct' : 'wrong');
      if (!isCorrect) freshEls[q.correct].classList.add('correct');

      const feedback = document.createElement('div');
      feedback.className = 'feedbackBox ' + (isCorrect ? 'good' : 'bad');
      feedback.innerHTML = `<div class="feedbackHead">${isCorrect ? '¡Correcto!' : 'No es correcto'}</div>` +
        (isCorrect ? '' : `<div>La respuesta correcta es: ${q.options[q.correct]}.</div>`) +
        (q.explain ? `<div style="margin-top:4px">${q.explain}</div>` : '');
      app.appendChild(feedback);

      const nextBtn = document.createElement('div');
      nextBtn.className = 'primaryBtn';
      nextBtn.textContent = idx + 1 < questions.length ? 'Siguiente pregunta' : 'Ver resultado';
      nextBtn.addEventListener('click', () => {
        idx++;
        if (idx < questions.length) renderQuestion();
        else renderResult();
      });
      app.appendChild(nextBtn);
    }
  }

  function renderResult() {
    app.innerHTML = '';
    const pct = Math.round((correctCount / questions.length) * 100);

    const score = document.createElement('div');
    score.className = 'resultScore';
    score.textContent = `${correctCount}/${questions.length}`;
    app.appendChild(score);

    const grade = document.createElement('div');
    grade.className = 'resultGrade';
    grade.textContent = gradeLabel(pct);
    app.appendChild(grade);

    const label = document.createElement('div');
    label.className = 'resultLabel';
    label.textContent = `${pct}% de aciertos`;
    app.appendChild(label);

    if (opts.onFinish) opts.onFinish({ correct: correctCount, total: questions.length, pct });

    const btn = document.createElement('div');
    btn.className = 'primaryBtn';
    btn.textContent = opts.finishLabel || 'Continuar';
    btn.addEventListener('click', () => opts.onFinishNav ? opts.onFinishNav() : back());
    app.appendChild(btn);
  }

  renderQuestion();
}

render();
syncProgressOnLoad();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
