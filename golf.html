<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>&nbsp;</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content=" " />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
<style>
  /* En pantallas anchas (desktop), el .screen del style.css compartido no
     tiene max-width — se estira a todo el ancho del navegador. ski.html y
     snowboard.html sí limitan su .wrap a 760px centrado, lo que les da ese
     look más "contenido"/con borde. Replicamos lo mismo acá solo para
     golf.html, sin tocar style.css (que también usan index/menu/ruleta). */
  .screen { max-width: 760px; margin: 0 auto; }

  .topTitle {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .topSub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
  }

  :root { --course-accent: #8ed64f; --course-accent-dim: rgba(142,214,79,0.14); }

  /* ---- Hero ---- */
  .hero {
    position: relative;
    border-radius: 22px;
    padding: 22px 20px 20px;
    margin-bottom: 20px;
    background: linear-gradient(145deg, rgba(142,214,79,0.16), rgba(10,10,12,0) 62%), var(--bg-soft);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute; right: -36px; top: -36px; width: 170px; height: 170px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(142,214,79,0.2), transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow { position: relative; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--course-accent); font-weight: 700; margin-bottom: 9px; }
  .hero-title { position: relative; font-size: 23px; line-height: 1.25; font-weight: 800; margin: 0 0 7px; }
  .hero-title b { color: var(--course-accent); }
  .hero-sub { position: relative; font-size: 13px; color: var(--text-dim); margin: 0 0 16px; }
  .hero-cta {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    background: var(--course-accent); color: #0a0a0c; font-weight: 700; font-size: 13.5px;
    padding: 11px 20px; border-radius: 999px;
  }
  .hero-cta svg { width: 12px; height: 12px; fill: #0a0a0c; }

  /* ---- Tarjeta "seguí donde ibas" ---- */
  .lesson-card {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 15px; border-radius: 18px; border: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .lesson-card-icon {
    width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0;
    background: var(--course-accent-dim);
    display: flex; align-items: center; justify-content: center;
  }
  .lesson-card-icon svg { width: 22px; height: 22px; stroke: var(--course-accent); fill: none; stroke-width: 1.8; }
  .lesson-card-body { flex: 1; min-width: 0; }
  .lesson-card-eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 4px; }
  .lesson-card-title { font-size: 14.5px; font-weight: 700; margin-bottom: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lesson-progress-row { display: flex; align-items: center; gap: 8px; }
  .lesson-progress { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .lesson-progress-fill { height: 100%; background: var(--course-accent); border-radius: 3px; }
  .lesson-progress-pct { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
  .lesson-card-btn {
    margin-top: 11px; display: inline-flex; align-items: center; gap: 6px;
    background: var(--course-accent); color: #0a0a0c; font-weight: 700; font-size: 12.5px;
    padding: 8px 14px; border-radius: 999px;
  }

  /* ---- Explorar niveles (grilla de íconos) ---- */
  .explore-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 20px; }
  .explore-tile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 4px; border-radius: 16px; border: 1px solid var(--line); text-align: center; }
  .explore-tile.locked { opacity: 0.35; }
  .explore-tile-icon { width: 36px; height: 36px; border-radius: 11px; background: var(--course-accent-dim); display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 800; color: var(--course-accent); }
  .explore-tile-label { font-size: 9.5px; color: var(--text-dim); line-height: 1.25; }

  /* ---- Fila de progreso (estilo "Your Progress") ---- */
  .progress-row { display: flex; border: 1px solid var(--line); border-radius: 16px; padding: 16px 8px; margin-bottom: 20px; }
  .progress-item { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .progress-icon { font-size: 16px; }
  .progress-num { font-size: 16px; font-weight: 800; }
  .progress-lbl { font-size: 9px; color: var(--text-dim); line-height: 1.25; }

  /* ---- Selector de usuario ---- */
  .userSwitch { display: flex; gap: 8px; margin-bottom: 20px; }
  .userPill {
    flex: 1;
    text-align: center;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 13.5px;
    color: var(--text-dim);
  }
  .userPill.active { border-color: var(--text); color: var(--text); font-weight: 600; }

  /* ---- Botón de repaso ---- */
  .reviewBtn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 20px;
  }
  .reviewBtn.disabled { opacity: 0.4; }
  .reviewIcon {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: var(--course-accent-dim);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .reviewIcon svg { width: 17px; height: 17px; stroke: var(--course-accent); fill: none; stroke-width: 1.8; }
  .reviewText { flex: 1; }
  .reviewTitle { font-size: 14px; font-weight: 600; }
  .reviewSub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .chev { width: 14px; height: 14px; stroke: var(--text-dim); fill: none; stroke-width: 1.6; flex-shrink: 0; }

  /* ---- Niveles ---- */
  .levelCard {
    padding: 14px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .levelCard.locked { opacity: 0.4; }
  .levelNum {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: var(--course-accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--course-accent);
    flex-shrink: 0;
  }
  .levelBody { flex: 1; min-width: 0; }
  .levelName { font-size: 15.5px; font-weight: 600; }
  .levelSub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .levelProgress { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .levelBar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .levelBarFill { height: 100%; background: var(--text); border-radius: 2px; }

  /* ---- Módulos ---- */
  .moduleRow {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
  }
  .moduleRow.locked { opacity: 0.35; }
  .modCheck {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--text-dim);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .modCheck svg { width: 12px; height: 12px; opacity: 0; stroke: var(--bg); }
  .moduleRow.done .modCheck { background: var(--text); border-color: var(--text); }
  .moduleRow.done .modCheck svg { opacity: 1; }
  .modBody { flex: 1; min-width: 0; }
  .modTitle { font-size: 15px; line-height: 1.35; }
  .modMeta { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }

  /* ---- Lección ---- */
  .lessonHead { margin-bottom: 4px; }
  .lessonKicker { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .lessonTitle { font-size: 21px; font-weight: 700; line-height: 1.25; margin-top: 6px; }
  .lessonMeta { font-size: 12px; color: var(--text-dim); margin-top: 6px; margin-bottom: 18px; }

  .listenBtn {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 13px;
    margin-bottom: 22px;
    align-self: flex-start;
  }
  .listenBtn svg { width: 14px; height: 14px; stroke: var(--text); fill: none; stroke-width: 1.6; }
  .listenBtn.playing { border-color: var(--text); }

  .lessonBody { font-size: 15.5px; line-height: 1.65; }
  .lessonBody p { margin: 0 0 14px; }
  .lessonBody ul, .lessonBody ol { margin: 0 0 14px; padding-left: 20px; }
  .lessonBody li { margin-bottom: 8px; }
  .lessonBody strong { font-weight: 600; }
  .term {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.92em;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    color: var(--accent);
    white-space: nowrap;
  }

  .summaryBox {
    margin-top: 8px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg-soft);
  }
  .summaryLabel { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .summaryText { font-size: 14px; line-height: 1.55; }

  .primaryBtn {
    margin-top: 24px;
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .primaryBtn:active { opacity: 0.85; }
  .primaryBtn.secondary {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
  }

  /* ---- Quiz ---- */
  .quizProgress { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .quizQ { font-size: 17px; font-weight: 600; line-height: 1.4; margin-bottom: 18px; }
  .quizOpt {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 10px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .quizOpt.selected { border-color: var(--text); }
  .quizOpt.correct { border-color: #5fbf7a; background: rgba(95,191,122,0.1); }
  .quizOpt.wrong { border-color: #d97070; background: rgba(217,112,112,0.1); }

  .resultScore { font-size: 40px; font-weight: 700; text-align: center; margin: 30px 0 6px; }
  .resultLabel { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 30px; }

  .emptyHint { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; text-align: center; margin-top: 60px; padding: 0 10px; }

  /* ---- Voz ---- */
  .listenRow { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .voiceSelect {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    background: none;
    max-width: 160px;
  }
  .speed-row { display: flex; align-items: center; gap: 8px; margin: -8px 0 18px; flex-wrap: wrap; }
  .speed-lbl { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .speed-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .speed-pill { background: none; border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--text-dim); cursor: pointer; }
  .speed-pill.active { background: var(--course-accent-2); color: #fff; border-color: transparent; }

  /* ---- Diagramas ----
     Ilustraciones propias en SVG (no son fotos ni diagramas bajados de
     internet): así no dependen de conexión ni de derechos de terceros.
     Se les da un toque de color muy sutil sobre el tema oscuro para que
     se lean más como una ilustración real y menos como un boceto. */
  .diagram { margin: 4px 0 20px; color: var(--text); }
  .diagram svg { display: block; width: 100%; height: auto; }
  .diagram svg text { font-size: 9px; fill: var(--text-dim); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .diagramCaption { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.45; }
  :root { --course-wash: rgba(120,190,130,0.16); --course-wash-line: rgba(120,190,130,0.55); --course-wash2: rgba(214,181,124,0.28); --course-wash2-line: rgba(214,181,124,0.7); --course-accent-2: #d97070; }

  /* ================= Diseño nuevo 2026-11: fotos + anillo + racha semanal =================
     Mismo bloque que cafe.html/ski.html/snowboard.html — ver el comentario
     completo en cafe.html. Las variables --course-accent* de arriba son lo
     único que cambia de un curso a otro. */

  .hero { display: flex; align-items: center; gap: 16px; }
  .hero-body { flex: 1; min-width: 0; }
  .hero-photo {
    position: relative; z-index: 1; flex-shrink: 0;
    width: 86px; height: 86px; border-radius: 20px; overflow: hidden;
    border: 1px solid var(--course-wash-line);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .ringCardRow { display: flex; align-items: center; gap: 14px; }
  .ring-wrap { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
  .ring-wrap svg { width: 54px; height: 54px; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--line); stroke-width: 5; }
  .ring-fill { fill: none; stroke: var(--course-accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--course-accent); }
  .lesson-card-photo {
    width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .lesson-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .explore-row { display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px 20px; padding: 0 20px 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .explore-row::-webkit-scrollbar { display: none; }
  .explore-card {
    position: relative; flex: 0 0 150px; height: 108px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg-soft);
  }
  .explore-card.locked { opacity: 0.45; }
  .explore-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .explore-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,12,0) 30%, rgba(10,10,12,0.88) 100%);
  }
  .explore-card-body { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .explore-card-name { font-size: 12.5px; font-weight: 700; line-height: 1.2; }
  .explore-card-sub { font-size: 9.5px; color: rgba(255,255,255,0.75); margin-top: 2px; }

  .weekChartCard { display: flex; align-items: flex-end; gap: 10px; flex: 1.4; min-width: 0; }
  .weekChart { flex: 1; display: flex; align-items: flex-end; gap: 5px; height: 44px; }
  .weekChart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .weekChart-track { width: 100%; max-width: 14px; flex: 1; display: flex; align-items: flex-end; border-radius: 4px; background: var(--bg-soft); overflow: hidden; }
  .weekChart-bar { width: 100%; border-radius: 4px; background: var(--line); min-height: 3px; }
  .weekChart-bar.active { background: var(--course-accent); }
  .weekChart-col.today .weekChart-lbl { color: var(--text); font-weight: 700; }
  .weekChart-lbl { font-size: 8.5px; color: var(--text-dim); }
  .weekChartLabel { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }

  .modPhotos { display: flex; gap: 8px; margin: 0 0 16px; }
  .modPhotos figure { flex: 1; min-width: 0; margin: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-soft); }
  .modPhotos img { width: 100%; height: 118px; object-fit: cover; display: block; }
  .modPhotos figcaption { font-size: 9.5px; color: var(--text-dim); padding: 6px 9px 8px; line-height: 1.3; }

  /* ---- Pronóstico ---- */
  .forecastCard {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 22px;
  }
  .forecastTitle { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .forecastRow { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .forecastRow span:last-child { color: var(--text-dim); }
  .forecastEta { font-size: 13.5px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); line-height: 1.5; }

  /* ---- Dashboard (racha, semana, estadísticas, mes, heatmap) ---- */
  .streakRow { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .streakBadge { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 16px; border: 1px solid var(--course-accent-2); background: rgba(217,112,112,0.08); flex-shrink: 0; }
  .streakBadge .n { font-size: 20px; font-weight: 700; color: var(--course-accent-2); line-height: 1.1; }
  .streakBadge .lbl { font-size: 8.5px; color: var(--course-accent-2); opacity: .85; text-transform: uppercase; letter-spacing: .05em; margin-top: 1px; }
  .weekStrip { display: flex; gap: 6px; flex: 1; }
  .dayCell { flex: 1; aspect-ratio: 1; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 9.5px; color: var(--text-dim); }
  .dayCell.active { background: var(--course-accent-2); color: #fff; border-color: transparent; }
  .dayCell.today { outline: 2px solid var(--course-accent-2); outline-offset: 1px; }

  .statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .statCard { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .statCard .lbl { font-size: 10.5px; color: var(--text-dim); margin-bottom: 5px; }
  .statCard .val { font-size: 18px; font-weight: 600; }
  .statCard .val small { font-size: 11.5px; color: var(--text-dim); font-weight: 400; }

  .dashPanel { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 22px; }
  .dashPanelTitle { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }

  /* ---- Tu recorrido (learning path, tipo árbol de niveles) ---- */
  .pathTrack { display: flex; align-items: flex-start; overflow-x: auto; gap: 0; margin: 0 -20px 20px; padding: 4px 20px 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .pathTrack::-webkit-scrollbar { display: none; }
  .pathStep { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; width: 54px; cursor: pointer; }
  .pathCircle {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 700;
    border: 2px solid var(--line); color: var(--text-dim); background: var(--bg-soft);
    flex-shrink: 0;
  }
  .pathCircle svg { width: 17px; height: 17px; stroke-width: 2.3; fill: none; }
  .pathCircle.done { background: var(--course-accent); border-color: var(--course-accent); color: #0a0a0c; }
  .pathCircle.done svg { stroke: #0a0a0c; }
  .pathCircle.current { border-color: var(--course-accent); color: var(--course-accent); background: var(--course-wash); }
  .pathCircle.upcoming svg { stroke: var(--text-dim); opacity: 0.55; width: 15px; height: 15px; }
  .pathLine { flex-shrink: 0; width: 22px; height: 2px; background: var(--line); margin-top: 18px; }
  .pathLine.done { background: var(--course-accent); }
  .pathLabel { font-size: 9.5px; color: var(--text-dim); text-align: center; white-space: nowrap; }

  /* ---- Tu progreso (ring + actividad semanal + racha, dos columnas) ---- */
  .yourProgressRow { display: flex; gap: 18px; align-items: center; }
  .yourProgressRing { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
  .yourProgressRing .sub { font-size: 10.5px; color: var(--text-dim); text-align: center; line-height: 1.3; }
  .yourProgressRight { flex: 1; min-width: 0; }
  .streakRow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .streakRow .streakBadge { width: 46px; height: 46px; border-radius: 13px; }
  .streakRow .streakBadge .n { font-size: 16px; }

<script>
/* ============================================================
   Golf School — curso modular de golf (principiante a pro)
   Todo el contenido en español, terminología técnica en inglés
   sin traducir. Sin backend: todo vive en este archivo + localStorage.

/* Dos usuarios, cada uno con su propio progreso guardado por separado
   (cada uno lleva su propio ritmo, sus propios módulos completados y
   su propio pronóstico). */
const USERS = ['Sebas', 'Majo'];
const ACTIVE_USER_KEY = 'golf_active_user';

function getActiveUser() {
  try { return localStorage.getItem(ACTIVE_USER_KEY) || USERS[0]; } catch (e) { return USERS[0]; }
}
function setActiveUser(name) {
  try { localStorage.setItem(ACTIVE_USER_KEY, name); } catch (e) {}
}
let activeUser = getActiveUser();

function progressKey(user) { return 'golf_progress_v1__' + user; }

function loadProgress(user) {
  try {
    const raw = localStorage.getItem(progressKey(user));
    return raw ? JSON.parse(raw) : { completed: {} };
  } catch (e) { return { completed: {} }; }
}
function saveProgress(p) {
  try { localStorage.setItem(progressKey(activeUser), JSON.stringify(p)); } catch (e) {}
  pushProgressSoon();
}
let progress = loadProgress(activeUser);

function switchUser(name) {
  if (name === activeUser) return;
  activeUser = name;
  setActiveUser(name);
  progress = loadProgress(activeUser);
  render();
  syncProgressOnLoad();
}

/* ================= Sync de progreso con Supabase =================
   Ver el comentario completo en cafe.html — mismo patrón exacto, misma
   tabla course_progress, solo cambia COURSE_NAME. El progreso sigue
   viviendo principalmente en localStorage (la app funciona 100% offline);
   esto solo evita que se pierda al cambiar de dispositivo o borrar datos
   del navegador. */
const SUPABASE_URL = 'https://ahritihlqnbjvcighhwb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9prcahBAJHmeCZ8IB_bx5w_GQ6nl4wL';
const PROGRESS_TABLE = 'course_progress';
const COURSE_NAME = 'golf';

async function pullRemoteProgress(user) {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${PROGRESS_TABLE}?user_name=eq.${encodeURIComponent(user)}&course=eq.${COURSE_NAME}&select=data`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    return rows[0] ? rows[0].data : null;
  } catch (e) { return null; }
}

async function pushRemoteProgress(user, prog) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${PROGRESS_TABLE}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ user_name: user, course: COURSE_NAME, data: prog, updated_at: Date.now() })
    });
    return res.ok;
  } catch (e) { return false; }
}

function mergeProgressObjects(a, b) {
  const merged = { completed: {} };
  const ac = (a && a.completed) || {};
  const bc = (b && b.completed) || {};
  new Set([...Object.keys(ac), ...Object.keys(bc)]).forEach(id => {
    const x = ac[id], y = bc[id];
    merged.completed[id] = (x && y) ? ((x.at || 0) >= (y.at || 0) ? x : y) : (x || y);
  });
  return merged;
}

let pushTimer = null;
function pushProgressSoon() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushRemoteProgress(activeUser, progress), 600);
}

async function syncProgressOnLoad() {
  const remote = await pullRemoteProgress(activeUser);
  if (!remote) { pushRemoteProgress(activeUser, progress); return; }
  const merged = mergeProgressObjects(progress, remote);
  if (JSON.stringify(merged) !== JSON.stringify(progress)) {
    progress = merged;
    try { localStorage.setItem(progressKey(activeUser), JSON.stringify(progress)); } catch (e) {}
    render();
  }
  pushRemoteProgress(activeUser, progress);
}

        content: `

        content: `
          <p>Un set típico se organiza en familias, cada una pensada para una parte distinta del juego:</p>
          <ul>
            <li><span class="term">Woods</span> (maderas): el <span class="term">driver</span> y fairway woods como el <span class="term">3-wood</span> o <span class="term">5-wood</span>.</li>
            <li><span class="term">Hybrids</span>: cada vez reemplazan más a los hierros largos (2, 3 o 4), porque son más fáciles de elevar desde el pasto.</li>
            <li><span class="term">Irons</span>: normalmente del 4 al 9, para distancias medias.</li>
            <li><span class="term">Wedges</span>: <span class="term">pitching wedge</span> (PW), <span class="term">gap/approach wedge</span> (GW/AW), <span class="term">sand wedge</span> (SW) y <span class="term">lob wedge</span> (LW), de más a menos distancia y más a menos loft.</li>
          </ul>
          <p>El <span class="term">loft</span> (el ángulo de la cara) es el factor principal que determina trayectoria y distancia relativa: a menor loft, la bola sale más baja y llega más lejos; a mayor loft, sale más alta y más corta. Por eso el orden de distancia (de más a menos) es, en general: driver → 3-wood → 5-wood → hybrids/hierros largos → hierros medios (6-7) → hierros cortos (8-9) → PW → GW → SW → LW.</p>
          <p>Ojo: esto es un orden relativo, no una tabla de yardas fija — cada jugador tiene sus propias distancias según su velocidad de swing, así que no tiene mucho sentido comparar tus yardas con las de otra persona.</p>
          <p>Guía general de uso: driver o hybrid para tiros de salida donde priorizás distancia o control; fairway woods/hybrids/hierros largos para approaches lejanos; hierros medios y cortos para approaches a media y corta distancia; wedges para todo lo que pasa cerca del green (chips, pitches, bunkers).</p>

        content: `
          <p>La instrucción moderna (posible gracias a los datos de <span class="term">launch monitors</span> como TrackMan) reemplazó una explicación más vieja y menos precisa por lo que hoy se conoce como las <span class="term">ball flight laws</span> ("leyes del vuelo de la bola"): la <strong>cara del palo</strong> en el impacto, respecto a la línea objetivo, es lo que más determina la <strong>dirección inicial</strong> de la bola; el <strong>swing path</strong> (camino del palo), respecto a esa misma cara, es lo que determina cuánto se <strong>curva</strong>.</p>
          <p>Con esa base, así se definen los golpes (para un jugador diestro):</p>
          <ul>
            <li><span class="term">Straight</span>: cara cuadrada al objetivo y path igual a la cara — casi sin curva.</li>
            <li><span class="term">Draw</span>: cara apunta apenas a la izquierda del objetivo, con el path todavía más a la derecha que la cara — curva suave de derecha a izquierda.</li>
            <li><span class="term">Fade</span>: cara apunta apenas a la derecha del objetivo, con el path todavía más a la izquierda que la cara — curva suave de izquierda a derecha.</li>
            <li><span class="term">Hook</span>: como el draw pero exagerado — la cara está bastante más cerrada que el path, y suele terminar perdida a la izquierda.</li>
            <li><span class="term">Slice</span>: como el fade pero exagerado — la cara está bastante más abierta que el path, y suele terminar perdida a la derecha.</li>
            <li><span class="term">Pull</span> / <span class="term">push</span>: la bola sale (a la izquierda o a la derecha, respectivamente) y viaja casi recta, sin curvarse — pasa cuando la cara y el path apuntan juntos hacia el mismo lado del objetivo.</li>
          </ul>
          <p>La idea clave para memorizar: un draw y un hook son la misma "forma" de curva (derecha a izquierda), solo que en distinto grado — lo mismo entre fade y slice. Lo que cambia es cuánto se abre o se cierra la cara respecto al path, no el tipo de curva.</p>

            <div class="diagramCaption">La cara del palo define hacia dónde arranca la bola; el path relativo a esa cara define cuánto se curva. El hook es la misma curva que un draw, solo que exagerada.</div>

        summary: 'La cara del palo en el impacto define la dirección inicial de la bola; el swing path relativo a la cara define cuánto se curva. Draw/hook curvan de derecha a izquierda, fade/slice de izquierda a derecha — la diferencia entre cada par es solo el grado.',
        quiz: [
          { q: 'Según las "ball flight laws" modernas, ¿qué determina principalmente la DIRECCIÓN INICIAL de la bola?', options: ['El swing path', 'La cara del palo en el impacto', 'El tipo de bola', 'La velocidad del swing'], correct: 1, explain: 'La cara del palo respecto a la línea objetivo es el factor dominante en la dirección inicial; esto reemplazó la explicación más vieja centrada en el path.' },

        content: `
          <p>Chip y pitch son los dos golpes básicos para cuando estás cerca del green pero no sobre él, y se diferencian en la técnica y en el resultado que buscan:</p>
          <p><strong>Chip:</strong> un movimiento simple, descrito por instructores como "de una sola palanca" — básicamente los hombros se mueven en bloque, con poco o nada de <span class="term">wrist hinge</span> (quiebre de muñeca). Se usa cuando estás muy cerca del green. La bola sale <strong>baja y rueda mucho</strong> más de lo que vuela. Postura: bola atrás en el stance, peso favoreciendo el pie delantero, manos adelantadas.</p>
          <p><strong>Pitch:</strong> un movimiento de "dos palancas" — se le suma quiebre de muñeca al giro de hombros, con un arco más grande y algo de transferencia de peso. Se usa cuando necesitás más distancia aérea o salvar un obstáculo antes del green. La bola sale <strong>más alta, con más tiempo en el aire y rueda menos</strong> al aterrizar. Postura: bola más al centro o levemente adelantada, swing más largo con quiebre de muñeca en el backswing.</p>
          <p>Una forma simple de decidir cuál usar: si tenés mucho green por delante para trabajar y poco obstáculo, chip; si necesitás que la bola pare rápido o hay algo en el medio (bunker, rough alto), pitch.</p>

        content: `
          <p>Hay varios <span class="term">grips</span> estándar de putt, y ninguno es "el correcto" — cada jugador prueba hasta encontrar el que más control le da:</p>
          <ul>
            <li><span class="term">Reverse overlap</span>: el más tradicional; el índice de la mano de arriba se apoya sobre los dedos de la mano de abajo.</li>
            <li><span class="term">Cross-handed</span> (o <span class="term">left-hand-low</span>): las manos invertidas respecto al grip normal — ayuda a algunos jugadores a nivelar los hombros y evitar que la muñeca de adelante se rompa.</li>
            <li><span class="term">Claw grip</span>: la mano trasera no envuelve el grip de forma convencional, sino que descansa entre el pulgar y el índice — se usa para "aquietar" una mano trasera demasiado activa.</li>
          </ul>
          <p><strong>Lectura de greens:</strong> además de leer la pendiente "a ojo", existe un método sistemático llamado <span class="term">AimPoint</span>: estimás el porcentaje de pendiente bajo la bola y, con el brazo extendido y contando dedos, calculás un punto de apunte hacia el hoyo — un enfoque basado en física, no solo en sensación, que usan varios jugadores de gira junto a sus caddies.</p>
          <p><strong>Velocidad antes que línea:</strong> la investigación de golpes ganados (strokes gained) popularizada por Mark Broadie sugiere que el control de <em>velocidad/distancia</em> pesa tanto o más que acertar la línea exacta — un putt con buena velocidad pero línea imperfecta suele terminar más cerca del hoyo que uno con línea perfecta pero mala velocidad.</p>
          <p><strong>Mecánica básica:</strong> se enseña como un movimiento tipo <span class="term">pendulum</span> (péndulo) — hombros y brazos como una sola unidad, cuerpo estable, bola de posición algo adelantada en el stance.</p>
        `,

        quiz: [

          { q: '¿Qué es AimPoint?', options: ['Una marca de putters', 'Un método sistemático de lectura de greens basado en pendiente', 'Un tipo de bola', 'Una regla oficial de golf'], correct: 1, explain: 'AimPoint traduce la pendiente estimada bajo la bola en un punto de apunte concreto, en vez de leer solo "a ojo".' },

        content: `
          <p>El golpe de bunker greenside se juega distinto a casi cualquier otro: la idea NO es golpear la bola directamente, sino "sacarla" con un colchón de arena.</p>
          <ul>
            <li><strong>Cara y stance abiertos:</strong> abrí tanto el stance como la cara del palo antes de empezar el swing — esto ayuda a que el palo "resbale" bajo la bola en vez de clavarse.</li>
            <li><strong>Posición de la bola:</strong> adelantada, cerca del pie de adelante, con el peso favoreciendo ese mismo lado (una guía común es una distribución de peso de aproximadamente 80/20 hacia el pie delantero).</li>
            <li><strong>Punto de contacto:</strong> golpeá la arena unos 2-3 cm detrás de la bola (no la bola directamente), con un swing de afuera hacia adentro — eso desplaza una capa fina de arena que "empuja" la bola hacia afuera.</li>
            <li><strong>Follow-through:</strong> comprometete con un final de swing completo y alto. Desacelerar o "cortar" el swing es la causa más común de golpes malos desde el bunker (bola que se queda en la arena, o golpe fino que la manda muy lejos).</li>
          </ul>
          <p>El <span class="term">bounce</span> del sand wedge (el ángulo construido en la suela del palo) es justamente lo que permite que el borde de ataque se deslice por debajo de la bola en vez de enterrarse en la arena — por eso el sand wedge está diseñado específicamente para este golpe.</p>

        content: `
          <p>Estas situaciones se rigen por las <span class="term">Rules of Golf</span> 2023 (USGA/The R&A) y suelen generar dudas incluso entre jugadores con experiencia:</p>
          <p><strong>Penalty areas (zonas de penalización, antes llamadas "water hazards"):</strong> se marcan en amarillo o rojo. En ambos colores tenés, por 1 golpe de penalización: jugar <span class="term">stroke and distance</span> (volver a jugar desde el golpe anterior), o alivio <span class="term">back-on-the-line</span> (dejar caer la bola en cualquier punto de una línea imaginaria que una el hoyo con donde la bola cruzó hacia la zona, tan atrás como quieras). Las zonas <strong>rojas</strong> además permiten <span class="term">lateral relief</span>: dejar caer dentro de dos largos de palo de donde la bola cruzó, sin acercarte al hoyo. Importante: una bola en una penalty area <strong>no se puede declarar injugable</strong> — solo tenés las opciones de arriba.</p>
          <p><strong>Fuera de límites (<span class="term">OB</span>) y pelota perdida:</strong> la regla estándar es <span class="term">stroke and distance</span> — volvés a jugar desde donde pegaste antes, sumando 1 golpe de penalización (perdés el golpe original y la distancia que hubiera avanzado).</p>
          <p><strong>Regla local opcional (no siempre disponible):</strong> algunos campos adoptan una Regla Local Modelo que permite, para pelota perdida u OB fuera de una penalty area, dejar caer la bola cerca de donde se perdió en vez de volver caminando, mas 2 golpes de penalización (más que el stroke-and-distance estándar, para compensar el ahorro de tiempo). Esta regla es opcional, la decide cada Comité del campo, y <strong>no está pensada para competiciones de élite</strong> — solo para agilizar el juego recreativo.</p>

        content: `
          <p>Jugar bien no es solo pegarle bien a la bola — también es elegir bien qué intentar en cada golpe. Algunos principios que se repiten en la enseñanza de estrategia de juego:</p>
          <ul>
            <li><strong>Jugá para tu peor error, no para tu mejor golpe:</strong> elegí el objetivo pensando en qué pasa si el golpe sale mal, no solo en el resultado ideal — por ejemplo, apuntar lejos de un bunker o del agua aunque eso te aleje un poco de la bandera.</li>
            <li><strong>Apuntá a la parte generosa del green:</strong> salvo que tengas mucha confianza en el golpe, apuntar al centro o a la zona más amplia y segura del green suele salir mejor en el largo plazo que ir siempre directo a banderas complicadas.</li>
            <li><strong>Evaluá riesgo vs. recompensa:</strong> antes de un tiro agresivo (cortar un dogleg, pasar un hazard), pensá qué tan probable es que salga bien y qué tan caro es el error si sale mal.</li>
          </ul>
          <p>La investigación de golpes ganados (basada en el trabajo de Mark Broadie) es útil acá: entre jugadores de distinto nivel, los <strong>approach shots</strong> y los <strong>tiros de salida</strong> explican una parte más grande de la diferencia de puntaje que el juego corto o el putt (que aportan una porción menor, del orden del 15% según algunos análisis). Esto no significa que el juego corto no importe — significa que, para la mayoría de los jugadores, mejorar la toma de decisiones y el golpeo de approach suele tener más impacto en el puntaje que practicar solo cerca del green.</p>
        `,
        summary: 'Elegí tus objetivos pensando en el peor resultado posible, no solo en el mejor; apuntá a la zona generosa del green salvo que confíes mucho en el golpe. Según la investigación de golpes ganados, approach y tee shots explican más de la diferencia de puntaje entre niveles que el juego corto o el putt.',

        content: `
          <p>El <span class="term">World Handicap System</span> (WHS) es administrado conjuntamente por la USGA y The R&A desde su lanzamiento en 2020, y reemplazó varios sistemas regionales que existían antes en distintas partes del mundo, unificando cómo se mide el nivel de un jugador en todo el planeta.</p>

            <li><span class="term">Course Rating</span>: el puntaje que se espera que haga un jugador scratch (hándicap 0) en ese campo, en un buen día y condiciones normales.</li>
            <li><span class="term">Slope Rating</span>: mide qué tan difícil es un campo, en términos relativos, para un jugador "bogey" (no-scratch) comparado con un jugador scratch. Va de 55 a 155, con 113 como valor "estándar".</li>

          <p>Tu Handicap Index se actualiza todos los días: normalmente al día siguiente de cargar un puntaje, a la medianoche hora local.</p>

        content: `
          <p>Las Rules of Golf definen dos grandes formas de competir, con lógicas bien distintas:</p>
          <p><strong><span class="term">Stroke play</span></strong>: todos los jugadores compiten según su puntaje total. Cada golpe de la ronda (o de todas las rondas, en torneos de varios días) suma al total, y gana quien termina con menos golpes en total. No importa cómo te fue en un hoyo puntual — todo se acumula.</p>
          <p><strong><span class="term">Match play</span></strong>: se compite hoyo por hoyo. En cada hoyo, ganás, perdés o <span class="term">halve</span>ás (empatás) ese hoyo específico — un hoyo se "halvea" cuando ambos hacen el mismo puntaje. El resultado del partido se decide en cuanto un lado queda arriba por más hoyos de los que quedan por jugar, así que muchas veces el partido termina antes del hoyo 18. El margen se expresa como "X & Y" — por ejemplo, <strong>"3 & 2"</strong> significa que un jugador iba 3 hoyos arriba con solo 2 hoyos restantes, así que el resultado ya estaba matemáticamente decidido.</p>
          <p>Además de estos dos formatos "base", hay variantes recreativas comunes que vas a encontrar en la cancha: <span class="term">four-ball</span> (equipos de a dos, cada uno juega su bola, cuenta el mejor resultado del equipo), <span class="term">foursomes</span> (equipos de a dos, una sola bola, golpes alternados), <span class="term">scramble</span> (todos pegan, se elige el mejor resultado y se sigue desde ahí) y <span class="term">stableford</span> (puntos por hoyo según el resultado respecto al par, en vez de contar cada golpe).</p>
        `,

          { q: 'En match play, ¿qué significa que un hoyo se "halvee"?', options: ['Que nadie lo jugó', 'Que ambos jugadores hicieron el mismo puntaje en ese hoyo', 'Que se cancela el hoyo', 'Que se juega de nuevo'], correct: 1, explain: 'Un hoyo halveado es un empate en ese hoyo puntual — ninguno de los dos lo gana ni lo pierde.' },

        title: 'Anatomía del palo: cara, hosel, sweet spot y forgiveness',

        imgs: [{"url": "https://images.unsplash.com/photo-1591491640784-3232eb748d4b?w=1200&q=80&auto=format&fit=crop", "alt": "Anatomía de la cara de un palo de golf", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1593111774240-d529f12cf4bb?w=1200&q=80&auto=format&fit=crop", "alt": "Anatomía de la cara de un palo de golf", "credit": "Unsplash"}],
        content: `
          <p>Conocer las partes de la cabeza del palo ayuda a entender por qué unos palos "perdonan" más los golpes descentrados que otros:</p>
          <ul>
            <li><span class="term">Face</span> (cara): la superficie que golpea la bola.</li>
            <li><span class="term">Hosel</span>: el punto donde el shaft se conecta con la cabeza.</li>
            <li><span class="term">Sole</span> (suela): la parte inferior de la cabeza, la que toca (o roza) el pasto.</li>
            <li><span class="term">Toe</span> / <span class="term">heel</span>: el extremo de la cabeza más lejos del shaft, y el más cerca de él, respectivamente.</li>
            <li><span class="term">Bounce</span>: el ángulo entre el borde delantero y trasero de la suela — clave en wedges (Nivel 2).</li>
          </ul>
          <p>En hierros, hay dos grandes filosofías de diseño: <span class="term">blade</span> (o <span class="term">muscle back</span>), con la parte trasera sólida y rellena, sweet spot chico y poco forgiveness — pensados para jugadores con contacto muy consistente; y <span class="term">cavity back</span>, con la parte trasera hueca, que redistribuye el peso hacia el perímetro de la cabeza, generando un sweet spot más grande.</p>
          <p>El <span class="term">sweet spot</span> es el punto de la cara donde un golpe produce la máxima distancia y precisión, y está directamente relacionado con dónde está el <span class="term">center of gravity</span> (CG, centro de gravedad) de la cabeza: golpear alineado con el CG minimiza la energía que se pierde en vibración y torsión.</p>
          <p><span class="term">Forgiveness</span> (indulgencia ante golpes descentrados) se logra principalmente con <span class="term">MOI</span> (<span class="term">Moment of Inertia</span>, momento de inercia): mide cuánto resiste la cabeza a rotar cuando la golpeás fuera del centro. A mayor MOI, más estable queda la cara en un golpe descentrado, así que se pierde menos velocidad y se desvía menos la bola. El MOI se logra con <span class="term">perimeter weighting</span> (peso perimetral): mover el peso disponible hacia los bordes de la cabeza en vez de dejarlo en el centro.</p>
          <p>El reglamento de equipamiento de USGA/R&A pone un límite oficial al MOI de los drivers: <strong>5,900 g·cm²</strong> como máximo (más una tolerancia de medición de 100 g·cm²) — así se evita que la tecnología haga el juego demasiado fácil para los golpes descentrados en competición.</p>

        summary: 'La forgiveness de un palo depende del MOI (momento de inercia): a mayor MOI, más estable queda la cara ante golpes descentrados. Se logra con peso perimetral, típico de los diseños cavity back frente a los blade. El reglamento limita el MOI de drivers a 5,900 g·cm².',
        quiz: [
          { q: '¿Qué mide el MOI (Moment of Inertia) de una cabeza de palo?', options: ['Qué tan lejos pega', 'Cuánto resiste la cabeza a rotar en golpes descentrados', 'El peso total del palo', 'El color de la cara'], correct: 1, explain: 'A mayor MOI, más estable se mantiene la cara ante un golpe fuera del centro, perdiendo menos distancia y precisión.' },
          { q: '¿Qué diseño de hierro suele dar más forgiveness: blade o cavity back?', options: ['Blade / muscle back', 'Cavity back', 'Da igual, no hay diferencia', 'Ninguno de los dos'], correct: 1, explain: 'El cavity back redistribuye peso hacia el perímetro (perimeter weighting), generando más MOI y un sweet spot más grande.' },
          { q: '¿Cuál es el límite oficial de MOI para drivers según USGA/R&A?', options: ['460 g·cm²', '5,900 g·cm²', 'No hay límite', '100 g·cm²'], correct: 1, explain: 'El reglamento de equipamiento fija un máximo de 5,900 g·cm² (más 100 g·cm² de tolerancia de medición).' },
          { q: '¿Qué es el "sweet spot"?', options: ['El grip favorito de un jugador', 'El punto de la cara alineado con el centro de gravedad, que da máxima distancia y precisión', 'Un tipo de bunker', 'El ángulo del hosel'], correct: 1, explain: 'Golpear en el sweet spot minimiza la pérdida de energía por vibración y torsión, alineado con el CG de la cabeza.' },

      {
        id: 'n3m2',
        title: 'Bolas de golf: construcción y por qué importa cuál elegís',
        minutes: 8,
        imgs: [{"url": "https://images.unsplash.com/photo-1632946269126-0f8edbe8b068?w=1200&q=80&auto=format&fit=crop", "alt": "Construcción de la pelota de golf", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?w=1200&q=80&auto=format&fit=crop", "alt": "Construcción de la pelota de golf", "credit": "Unsplash"}],
        content: `
          <p>No todas las bolas de golf son iguales por dentro, y la construcción afecta directamente cómo se comportan:</p>
          <ul>
            <li><span class="term">2-piece</span>: núcleo sólido de goma rodeado por una cubierta de <span class="term">Surlyn</span>/ionómero. Es el diseño más simple: maximiza distancia (menos spin), muy durable y de menor precio — ideal para principiantes que buscan un vuelo recto y consistente.</li>
            <li><span class="term">3-piece</span> (y multicapa, 4-5 piezas): agrega una capa "manto" entre el núcleo y la cubierta, casi siempre con cubierta de <span class="term">uretano</span>, para balancear distancia con control de spin cerca del green. Cuestan más y se rayan más fácil, y apuntan a jugadores de hándicap más bajo que buscan control fino.</li>
          </ul>
          <p><strong>Cubiertas:</strong> <span class="term">Surlyn</span> (ionómero) es dura y duradera, resiste cortes, y da menos spin desde el tee (más distancia, vuelo más recto) pero menos control cerca del green. <span class="term">Urethane</span> es más blando, típico en bolas de nivel tour: más spin en golpes cortos (más control), mejor tacto, pero más caro y menos durable.</p>
          <p>Los <span class="term">dimples</span> (hoyuelos) no son decorativos: crean un flujo de aire turbulento alrededor de la bola que reduce el <span class="term">drag</span> (resistencia del aire) y ayuda a generar <span class="term">lift</span> (sustentación) — sin ellos, la bola "caería del cielo" mucho más rápido de lo que lo hace.</p>
          <p>Sobre la <span class="term">compression</span> (compresión): un dato que sorprende a muchos jugadores es que <strong>no hay una correlación directa comprobada</strong> entre velocidad de swing y la compresión "ideal" de la bola — incluso swings lentos logran comprimir bolas de compresión estándar. La recomendación de los fitters es fijarse en el resultado real (trayectoria y spin), no en hacer coincidir mecánicamente la compresión con la velocidad de swing.</p>
          <p>Por reglamento (USGA/R&A), toda bola conforme debe medir al menos <strong>1.680 pulgadas</strong> de diámetro y pesar como máximo <strong>1.620 onzas</strong> — además de cumplir límites de velocidad inicial y de distancia total bajo condiciones de prueba estandarizadas.</p>
        `,
        summary: 'Las bolas de 2 piezas maximizan distancia y durabilidad; las de 3+ piezas con cubierta de uretano dan más control de spin cerca del green. Los dimples reducen la resistencia del aire. La compresión no se correlaciona directamente con la velocidad de swing, contra la creencia popular. El reglamento fija un diámetro mínimo de 1.680" y un peso máximo de 1.620 oz.',
        quiz: [
          { q: '¿Qué tipo de bola suele dar MÁS distancia y durabilidad, a costa de menos control cerca del green?', options: ['3-piece con uretano', '2-piece con cubierta Surlyn', 'No hay diferencia', 'Las bolas multicapa siempre'], correct: 1, explain: 'La bola de 2 piezas con cubierta Surlyn prioriza distancia y durabilidad sobre control de spin.' },
          { q: '¿Para qué sirven los dimples de una bola de golf?', options: ['Solo decoración', 'Reducir la resistencia del aire y ayudar a la sustentación', 'Hacerla más pesada', 'Evitar que se raye'], correct: 1, explain: 'Los dimples generan un flujo de aire turbulento que reduce el drag y ayuda a mantener la bola más tiempo en el aire.' },
          { q: '¿Es cierto que un swing lento necesita obligatoriamente una bola de compresión baja?', options: ['Sí, siempre', 'No — no hay una correlación directa comprobada entre velocidad de swing y compresión ideal'], correct: 1, explain: 'Es una creencia muy extendida pero no confirmada: incluso swings lentos logran comprimir bolas de compresión estándar.' },
          { q: '¿Cuál es el diámetro mínimo reglamentario de una bola de golf conforme?', options: ['1.500 pulgadas', '1.680 pulgadas', '2.000 pulgadas', 'No hay mínimo'], correct: 1, explain: 'El reglamento USGA/R&A exige un diámetro mínimo de 1.680 pulgadas (42.67 mm).' },
        ],

      {

        title: 'Shafts: materiales, flex/stiffness, torque y kick point',
        minutes: 9,
        imgs: [{"url": "https://images.unsplash.com/photo-1627307887011-8a5029b6adcb?w=1200&q=80&auto=format&fit=crop", "alt": "Shafts de golf: materiales y flex", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1627307886970-04e0d82d17b6?w=1200&q=80&auto=format&fit=crop", "alt": "Shafts de golf: materiales y flex", "credit": "Unsplash"}],
        content: `
          <p>El shaft es, para muchos fitters, la parte del palo con más impacto en cómo se siente y se comporta el golpe:</p>
          <p><strong>Materiales:</strong> <span class="term">steel</span> (acero) es más pesado y en general más consistente/predecible en su flexión — el material más común en hierros. <span class="term">Graphite</span> (grafito) es más liviano, típico en maderas y drivers, y suele asociarse con mayor absorción de vibración y más velocidad de cabeza para un mismo esfuerzo del jugador.</p>
          <p><strong>Flex / stiffness:</strong> las categorías estándar de la industria son <span class="term">L</span> (Ladies), <span class="term">A</span> (Senior), <span class="term">R</span> (Regular), <span class="term">S</span> (Stiff) y <span class="term">X</span> (Extra Stiff), de menos a más rígido. Como guía general de fitting (no una regla estricta, ya que cada jugador es distinto), suelen asociarse a rangos de velocidad de swing con el driver: L por debajo de 72 mph, A entre 72-83, R entre 84-96, S entre 97-104, y X por encima de 105 mph.</p>
          <p><strong><span class="term">Torque</span>:</strong> mide cuánto resiste el shaft a torcerse sobre su propio eje durante el swing, medido en grados — a menor grado, menos se tuerce. Un shaft con torque excesivo para tu swing puede sentirse descontrolado (la cara llega abierta al impacto); uno con torque insuficiente puede sentirse "muerto" y difícil de cargar. En general, un shaft más rígido (mayor stiffness) tiende a tener también menor torque.</p>
          <p><strong><span class="term">Kick point</span></strong> (o <span class="term">bend point</span>): el punto del shaft que más se flexiona durante el swing. Un kick point <strong>bajo</strong> flexiona más cerca de la cabeza, sube el loft dinámico y da un lanzamiento más alto — útil para swings más lentos que necesitan ayuda para elevar la bola. Un kick point <strong>alto</strong> flexiona menos, da un lanzamiento más bajo y más control — útil para swings rápidos que ya generan altura de sobra.</p>
        `,
        summary: 'El acero es más pesado y consistente (típico en hierros); el grafito es más liviano y absorbe más vibración (típico en maderas). El flex va de L a X según velocidad de swing (guía general, no regla estricta). El torque mide resistencia a torcerse — menor torque suele ir con más stiffness. El kick point bajo da más altura; el alto, menos altura y más control.',
        quiz: [
          { q: '¿Qué material de shaft es típicamente más liviano y absorbe más vibración?', options: ['Acero', 'Grafito', 'Titanio', 'Ninguno absorbe vibración'], correct: 1, explain: 'El grafito es más liviano que el acero y suele absorber más vibración, por eso es común en maderas y drivers.' },
          { q: '¿Qué mide el "torque" de un shaft?', options: ['Su peso total', 'Cuánto resiste a torcerse sobre su propio eje', 'Su largo', 'El precio'], correct: 1, explain: 'El torque mide la resistencia a la torsión del shaft durante el swing, medido en grados.' },
          { q: '¿Qué efecto tiene un kick point BAJO?', options: ['Lanzamiento más bajo', 'Lanzamiento más alto', 'No afecta el lanzamiento', 'Solo afecta el color del shaft'], correct: 1, explain: 'Un kick point bajo flexiona más cerca de la cabeza, sumando loft dinámico y elevando el lanzamiento.' },
          { q: '¿Los rangos de flex por velocidad de swing (L, A, R, S, X) son una regla estricta?', options: ['Sí, son obligatorios', 'No, son una guía general — cada jugador es distinto y conviene un fitting'], correct: 1, explain: 'Son guías generales de la industria; un fitting profesional (Nivel 5) ajusta esto a las características reales del jugador.' },

      {
        id: 'n3m4',
        title: 'El driver a fondo: loft, ángulos y forgiveness vs. distancia',
        minutes: 9,
        imgs: [{"url": "https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=1200&q=80&auto=format&fit=crop", "alt": "Driver de golf en el tee", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1611374243147-44a702c2d44c?w=1200&q=80&auto=format&fit=crop", "alt": "Driver de golf en el tee", "credit": "Unsplash"}],
        content: `
          <p>El driver es el palo más especializado de la bolsa, y varios ángulos determinan cómo vuela la bola:</p>
          <ul>
            <li><span class="term">Loft</span>: en drivers de hombre suele ir de 8° a 12°, con 9°-10.5° como lo más común. Contra la intuición, un swing más lento generalmente necesita <strong>más</strong> loft (no menos) para lograr buen carry — no menos, como muchos jugadores asumen.</li>
            <li><span class="term">Lie angle</span>: el ángulo entre el eje del shaft y la suela del palo. Determina si la suela toca el piso de forma pareja al address, lo cual afecta si la cara llega cuadrada al impacto.</li>
            <li><span class="term">Face angle</span>: si la cara está cuadrada, abierta o cerrada respecto a la línea de vuelo — es, según fuentes de fitting, el factor más determinante de la dirección inicial de la bola (más que el swing path). Cara abierta tiende a producir slice; cara cerrada, draw/hook.</li>
          </ul>
          <p>Por reglamento, el volumen máximo de una cabeza de driver es de <strong>460 cm³</strong> (más 10 cm³ de tolerancia) — casi todos los drivers modernos usan el máximo permitido para maximizar forgiveness, aunque existen modelos algo más chicos (430-450 cm³) para jugadores avanzados que priorizan menos spin sobre más perdón.</p>

        content: `
          <p>El <span class="term">swing plane</span> (plano de swing) es, técnicamente, el ángulo entre el piso y el círculo que describe la cabeza del palo durante la parte baja del arco del swing (aproximadamente desde la altura de la rodilla en el downswing hasta el impacto). Los palos más largos y con menos loft (como el driver) generan planos más "planos" (ángulo menor); los palos más cortos y con más loft, planos más "verticales".</p>
          <p>Un marco de enseñanza popular (del instructor Jim Hardy) distingue entre <span class="term">one-plane swing</span> (el palo gira "alrededor" del cuerpo en un arco más ancho y plano, impulsado sobre todo por la rotación del cuerpo) y <span class="term">two-plane swing</span> (el palo se mueve más "arriba y abajo" por delante del cuerpo, con más participación de los brazos). Vale aclarar: esto es <strong>una filosofía de enseñanza específica, no un consenso biomecánico universal</strong> — hay swings híbridos, y distintos instructores enseñan distinto.</p>

        content: `
          <p>Más allá de entender la teoría (Nivel 2), producir un draw o fade <em>a propósito</em> es una habilidad que se trabaja con setup e intención:</p>
          <p>Para un <strong>draw intencional</strong>, el patrón habitual es un swing path relativamente hacia la derecha del objetivo (<span class="term">in-to-out</span>), combinado con una cara que apunta a la derecha de la línea objetivo pero cerrada respecto al path. Para un <strong>fade intencional</strong>, el patrón inverso: path hacia la izquierda del objetivo (<span class="term">out-to-in</span>), con la cara abierta respecto al path pero cerrada respecto al objetivo.</p>
          <p>Instructores reconocidos enseñan a "agregar la curva en el address": ajustar la alineación del cuerpo (pies, caderas, hombros) y la cara del palo <em>antes</em> de empezar el swing, en vez de intentar manipular la trayectoria a mitad de movimiento.</p>

        content: `
          <p>Las Rules of Golf vigentes son la edición <strong>2023</strong>, publicada conjuntamente por USGA y The R&A, en vigor desde el 1 de enero de 2023. Al día de hoy no se ha publicado una edición numerada nueva — el reglamento se actualiza con "aclaraciones" (clarifications) trimestrales, no con ediciones completas nuevas (aunque el ciclo histórico de grandes revisiones, cada 4 años aproximadamente, sugiere que la próxima podría llegar alrededor de 2027, sin confirmación oficial todavía).</p>
          <p><strong><span class="term">Unplayable ball</span> (Regla 19):</strong> podés declarar tu bola injugable en casi cualquier parte del campo (excepto dentro de una penalty area), con tres opciones de alivio, cada una de 1 golpe de penalización: <span class="term">stroke and distance</span> (volver a jugar desde antes), <span class="term">back-on-the-line relief</span> (dejar caer sobre la línea que une el hoyo con la bola, tan atrás como quieras) o alivio lateral (dentro de dos largos de palo, sin acercarte al hoyo). Si la bola injugable está en un bunker, hay una cuarta opción: salir del bunker en línea hacia atrás, mas 2 golpes de penalización.</p>
          <p><strong><span class="term">Equipment Rules</span> vs. reglas de juego:</strong> las Equipment Rules son un subconjunto específico (Regla 4 y Apéndice II para palos, Regla 5 y Apéndice III para bolas) que regula qué equipo puede usarse — son de naturaleza técnica y restrictiva, con el objetivo declarado de que los avances tecnológicos beneficien al juego sin desequilibrarlo.</p>
          <p><strong>El <span class="term">Committee</span> (Comité)</strong> de una competencia define las condiciones antes del torneo (elegibilidad, marcación del campo, reglas locales, horarios), las administra durante el juego (resuelve dudas, gestiona el clima, valida tarjetas) y resuelve empates y resultados al final. Un <span class="term">Rules Official</span> (árbitro) es la persona designada para hacer cumplir las reglas y dar fallos durante el juego — distinto del Comité, que fija las condiciones generales.</p>

        content: `
          <p>Competir bien no depende solo de la técnica del swing — hay dos áreas que los jugadores avanzados suelen trabajar de forma deliberada:</p>
          <p><strong>Preparación mental:</strong> una <span class="term">pre-shot routine</span> (rutina previa al golpe) consistente y repetible es una de las herramientas más enseñadas en la psicología deportiva del golf — asociada, entre otros, al psicólogo deportivo Bob Rotella. La idea es que repetir siempre los mismos pasos antes de cada golpe ayuda a mantener la concentración, manejar la presión y ejecutar con confianza en vez de duda, sin importar lo que pasó en el golpe anterior.</p>
          <p><strong>Preparación física:</strong> el Titleist Performance Institute (TPI), referencia en acondicionamiento físico específico para golf, enfatiza de forma consistente tres áreas generales: <strong>movilidad</strong> (especialmente de cadera y columna torácica, para permitir la rotación del swing), <strong>estabilidad del core</strong> (tronco) y <strong>equilibrio</strong>. Estas áreas se asocian con poder ejecutar el swing de forma más eficiente y con menor riesgo de sobrecarga por el movimiento repetitivo — sin que esto sea una garantía médica individual, ya que cada cuerpo es distinto.</p>
          <p>Un buen warm-up (calentamiento) consistente antes de una ronda o torneo — no solo golpear bolas al voleo, sino incluir movilidad y algunos golpes con distintos palos — es otra práctica común entre jugadores competitivos.</p>

        content: `
          <p>Más allá de stroke play y match play (Nivel 2), estos son formatos y conceptos que aparecen en competencias más serias:</p>
          <ul>
            <li><span class="term">Stableford</span>: en vez de contar cada golpe, se otorgan puntos por hoyo según el resultado respecto al par (por ejemplo, más puntos por un birdie que por un par, cero por un doble bogey o peor) — gana quien suma más puntos, no quien hace menos golpes.</li>
            <li><span class="term">Four-ball</span> (o <span class="term">best ball</span>): equipos de dos, cada jugador juega su propia bola durante todo el hoyo, y cuenta el mejor resultado del equipo en ese hoyo.</li>
            <li><span class="term">Foursomes</span>: equipos de dos con una sola bola, alternando quién pega cada golpe.</li>
            <li><span class="term">Scramble</span>: todo el equipo pega desde el mismo punto, se elige la mejor bola resultante y todos siguen desde ahí — muy común en golf recreativo/benéfico.</li>
          </ul>
          <p>En torneos profesionales de varias rondas existe el concepto de <span class="term">cut</span> ("corte"): después de un número fijo de rondas (habitualmente las dos primeras), se reduce el campo de jugadores para las rondas finales — quien no supera el corte ("missed the cut") no sigue jugando ni cobra premio de ese torneo.</p>
          <p>Los cuatro <span class="term">majors</span> masculinos son: el Masters (Augusta National), el PGA Championship (organizado por la PGA of America), el U.S. Open (organizado por la USGA) y The Open Championship (organizado por The R&A). El golf femenino tiene su propio calendario de majors, organizado por sus propios circuitos (LPGA y otros).</p>
        `,
        summary: 'Stableford puntúa por hoyo en vez de contar golpes totales; four-ball, foursomes y scramble son formatos de equipo con distinta lógica cada uno. En torneos profesionales de varias rondas existe el "cut", que reduce el campo de jugadores. Los cuatro majors masculinos son Masters, PGA Championship, U.S. Open y The Open Championship, cada uno organizado por una entidad distinta.',

      {

        minutes: 8,
        imgs: [{"url": "https://images.unsplash.com/photo-1591266871922-7ec7b50de8b2?w=1200&q=80&auto=format&fit=crop", "alt": "Estadísticas de juego de golf", "credit": "Unsplash"}, {"url": "https://images.unsplash.com/photo-1561503616-64b54b7da444?w=1200&q=80&auto=format&fit=crop", "alt": "Estadísticas de juego de golf", "credit": "Unsplash"}],
        content: `
          <p>El marco de <span class="term">strokes gained</span> ("golpes ganados") fue desarrollado por Mark Broadie, profesor de la Columbia Business School, y popularizado en su libro <em>Every Shot Counts</em>. El PGA Tour lo adoptó oficialmente, organizándolo en cuatro categorías: <span class="term">off-the-tee</span>, <span class="term">approach-the-green</span>, <span class="term">around-the-green</span> y <span class="term">putting</span>.</p>
          <p>La idea central: en vez de mirar un golpe de forma aislada, se compara tu resultado contra un promedio de referencia según la distancia y posición de cada golpe — así se puede medir con precisión cuánto aporta (o resta) cada faceta del juego a tu puntaje final, algo que las estadísticas tradicionales no lograban capturar bien.</p>
          <p>Un hallazgo ampliamente citado de esta investigación: el <strong>juego largo</strong> (tee shots + approach shots) explica una porción más grande de la diferencia de puntaje entre jugadores de distinto nivel que el juego corto o el putt — contradiciendo el dicho popular "se conduce para el show, se putea por el dinero". Ojo con la interpretación: esto es sobre la <em>contribución relativa</em> a las diferencias de puntaje entre jugadores de nivel similar, no una afirmación de que el juego corto o el putt "no importan" — de hecho, el propio marco de strokes gained permite valorar el putting con precisión, en vez de descartarlo.</p>

        content: `
          <p>Que un palo o una bola sean <span class="term">conforming</span> (conformes) significa que cumplen las <span class="term">Equipment Rules</span> publicadas conjuntamente por USGA y The R&A — y deben seguir siendo conformes no solo cuando son nuevos, sino también con el desgaste normal del uso.</p>
          <p>La USGA mantiene dos listas públicas: la <strong>List of Conforming Driver Heads</strong> y la <strong>Conforming Golf Ball List</strong>. Antes de que un modelo nuevo pueda usarse en competición, el fabricante tiene que someterlo a pruebas de la USGA y conseguir que aparezca en la lista correspondiente.</p>
          <p>Estas listas son de uso obligatorio en eventos profesionales, en todos los campeonatos de la USGA y en competiciones amateur reglamentadas seleccionadas — usar equipo que no está en la lista puede resultar en descalificación. En cambio, en una ronda social/recreativa sin comité de reglas verificando equipo, esta restricción no se aplica de la misma forma en la práctica.</p>

        content: `
          <p>Este es un tema regulatorio en desarrollo activo — la situación descrita acá es la más actual disponible a <strong>agosto de 2026</strong>, y puede seguir cambiando.</p>
          <p>En 2023, USGA y The R&A propusieron primero una regla local opcional solo para competiciones de élite, y en diciembre de ese año la reemplazaron por un plan de <span class="term">rollback</span> universal: cambiar las condiciones de prueba de la <span class="term">Overall Distance Standard</span> (la norma que limita cuánto puede volar+rodar una bola bajo condiciones estandarizadas) para reducir la distancia, aplicándolo en principio a todos los niveles de juego con fechas escalonadas (2028 para golf de élite, 2030 para recreativo). El PGA Tour y la PGA of America se opusieron públicamente, argumentando que el cambio era excesivo y afectaba de forma desproporcionada a jugadores recreativos.</p>
          <p>En marzo de 2026, la USGA propuso unificar todo en una sola fecha: <strong>1 de enero de 2030</strong>, para golf de élite y recreativo a la vez. Pero el <strong>17 de junio de 2026</strong>, en un giro importante, USGA, The R&A, el PGA Tour y el DP World Tour emitieron un comunicado conjunto anunciando que <strong>reevaluarán su enfoque</strong> en conjunto, en vez de que USGA/R&A decidan unilateralmente — sin una nueva fecha confirmada al momento de este módulo.</p>
          <p><strong>Estado a agosto de 2026:</strong> no hay ninguna Model Local Rule ni cambio de regla en vigor todavía. La fecha de 2030 que se había propuesto está "en revisión", y los organismos rectores ahora trabajan junto con los tours profesionales para definir un nuevo camino — que podría incluir cambios más allá de la pelota (por ejemplo, en el driver). Como este es un tema que sigue moviéndose, conviene tratarlo como "situación en desarrollo", no como algo ya decidido.</p>
        `,
        summary: 'El rollback de la pelota es un tema regulatorio activo, no decidido: pasó de una regla local para élite (2023) a un plan universal con fecha 2028/2030, luego a una fecha única 2030, y en junio de 2026 USGA/The R&A anunciaron que lo reevaluarán junto con el PGA Tour y el DP World Tour, sin nueva fecha confirmada. A agosto de 2026, no hay ningún cambio de regla en vigor.',

          { q: '¿Qué pasó el 17 de junio de 2026?', options: ['Se confirmó la fecha final de 2030', 'USGA, The R&A, PGA Tour y DP World Tour anunciaron que reevaluarán el enfoque juntos', 'Se canceló el proyecto para siempre', 'No pasó nada relevante'], correct: 1, explain: 'Fue un giro importante: los organismos rectores decidieron reevaluar el camino a seguir en conjunto con los tours profesionales, en vez de decidir unilateralmente.' },

        content: `
          <p>Un <span class="term">fitting</span> profesional conecta todo lo visto en Nivel 3 (cabeza, bola, shaft, driver) con las características reales del swing de un jugador, en vez de dar recomendaciones genéricas.</p>
          <p>Los <span class="term">launch monitors</span> capturan datos objetivos durante el fitting: <span class="term">ball speed</span> (velocidad de la bola tras el impacto), <span class="term">launch angle</span> (ángulo inicial de salida), <span class="term">spin rate</span> (velocidad de rotación) y las distancias de <span class="term">carry</span> (vuelo) y total. Las dos marcas más citadas de la industria son <strong>TrackMan</strong> y <strong>Foresight Sports</strong> (con sus modelos GCQuad y GC3) — usadas tanto por jugadores de gira como por fitters en tiendas especializadas.</p>
          <p>Con esos datos, un fitter traduce números objetivos en decisiones concretas: qué loft de driver, qué flex y kick point de shaft, y qué diseño de cabeza (más o menos forgiveness) le conviene realmente a ese jugador — no al jugador "promedio". Un ejemplo real de la industria (mayo 2026): TaylorMade señaló que su driver más reciente ofrece 128 combinaciones de ajuste distintas, lo cual requiere que el fitter esté bien entrenado para aprovecharlas — el acceso del consumidor final a tecnología de fitting, antes reservada casi solo a profesionales, es una tendencia real y creciente.</p>
        `,
        summary: 'Un fitting profesional usa datos objetivos de launch monitors (ball speed, launch angle, spin rate, carry) — TrackMan y Foresight Sports son las marcas más citadas — para elegir loft, shaft y cabeza según el swing real de cada jugador, en vez de recomendaciones genéricas.',

        content: `
          <p>Una tienda de golf suele ofrecer varios servicios de reparación y mantenimiento, más allá de la venta de equipo nuevo:</p>
          <ul>
            <li><span class="term">Regripping</span>: se recomienda en general una vez al año para jugadores habituales (más seguido si jugás varias veces por semana, más espaciado si jugás poco). Señales de que un grip necesita cambiarse: se siente resbaladizo aunque tengas las manos secas, tiene grietas o zonas deshilachadas, se endureció y perdió capacidad de absorber el impacto, o necesitás apretar más la mano de lo normal para sostener el palo.</li>
            <li><span class="term">Reshafting</span>: cambiar el shaft de una cabeza existente, típico cuando un jugador quiere probar un flex, peso o material distinto sin comprar un palo nuevo entero.</li>

        content: `
          <p>Dirigir una tienda de golf combina principios generales de retail especializado con algunas particularidades propias del negocio:</p>
          <ul>
            <li><strong>Inventario estacional:</strong> la demanda de golf es marcadamente estacional en climas templados (alta en primavera-verano), lo que exige planificar compras y liquidaciones fuera de temporada con cuidado.</li>

        content: `
          <p>"Profesional de la PGA" y "jugador del PGA Tour" son <strong>dos carreras completamente distintas</strong>, con procesos separados — una fuente común de confusión, aunque ambas compartan la sigla "PGA".</p>
          <p><strong>Camino A — Profesional de Clase A de la PGA of America</strong> (profesor de club/gestión, el perfil más relacionado con dirigir una tienda de golf): hay dos rutas oficiales. El <span class="term">Associate Program</span> combina empleo en una instalación de golf aprobada con cursos en línea, un <span class="term">Playing Ability Test</span> (PAT — dos rondas de 18 hoyos con un puntaje límite específico) y tres niveles de educación (seminarios presenciales + trabajo de portafolio). Alternativamente, el <span class="term">PGA Golf Management University Program</span> es una carrera universitaria de 4.5-5 años que combina una licenciatura con ~16 meses de pasantías en instalaciones de golf, en universidades acreditadas específicamente para este programa.</p>
          <p><strong>Camino B — Jugador de gira (PGA Tour):</strong> totalmente independiente del camino anterior, sin requerir ninguna certificación de la PGA of America. El sistema actual pasa por el <span class="term">Korn Ferry Tour</span> (la vía principal hacia el PGA Tour) y por el <span class="term">Q-School</span> (PGA TOUR Q-School), que hoy es un proceso de cuatro etapas donde solo los primeros 5 de la etapa final consiguen tarjeta directa del PGA Tour, y otro grupo más amplio consigue estatus en el Korn Ferry Tour. También existe el programa <span class="term">PGA Tour University</span>, que da acceso directo a giras profesionales a los mejores jugadores universitarios (NCAA) según su ranking.</p>

      {
