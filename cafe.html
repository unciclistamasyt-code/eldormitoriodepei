<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>&nbsp;</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content=" " />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
<style>
  /* En pantallas anchas (desktop), el .screen del style.css compartido no
     tiene max-width — se estira a todo el ancho del navegador. ski.html y
     snowboard.html sí limitan su .wrap a 760px centrado, lo que les da ese
     look más "contenido"/con borde. Replicamos lo mismo acá solo para
     golf.html, sin tocar style.css (que también usan index/menu/ruleta). */
  .screen { max-width: 760px; margin: 0 auto; }

  .topTitle {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .topSub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
  }

  :root { --course-accent: #cf9a5c; --course-accent-dim: rgba(207,154,92,0.14); }

  /* ---- Hero ---- */
  .hero {
    position: relative;
    border-radius: 22px;
    padding: 22px 20px 20px;
    margin-bottom: 20px;
    background: linear-gradient(145deg, rgba(207,154,92,0.16), rgba(10,10,12,0) 62%), var(--bg-soft);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute; right: -36px; top: -36px; width: 170px; height: 170px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(207,154,92,0.2), transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow { position: relative; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--course-accent); font-weight: 700; margin-bottom: 9px; }
  .hero-title { position: relative; font-size: 23px; line-height: 1.25; font-weight: 800; margin: 0 0 7px; }
  .hero-title b { color: var(--course-accent); }
  .hero-sub { position: relative; font-size: 13px; color: var(--text-dim); margin: 0 0 16px; }
  .hero-cta {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    background: var(--course-accent); color: #0a0a0c; font-weight: 700; font-size: 13.5px;
    padding: 11px 20px; border-radius: 999px;
  }
  .hero-cta svg { width: 12px; height: 12px; fill: #0a0a0c; }

  /* ---- Tarjeta "seguí donde ibas" ---- */
  .lesson-card {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 15px; border-radius: 18px; border: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .lesson-card-icon {
    width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0;
    background: var(--course-accent-dim);
    display: flex; align-items: center; justify-content: center;
  }
  .lesson-card-icon svg { width: 22px; height: 22px; stroke: var(--course-accent); fill: none; stroke-width: 1.8; }
  .lesson-card-body { flex: 1; min-width: 0; }
  .lesson-card-eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 4px; }
  .lesson-card-title { font-size: 14.5px; font-weight: 700; margin-bottom: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lesson-progress-row { display: flex; align-items: center; gap: 8px; }
  .lesson-progress { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .lesson-progress-fill { height: 100%; background: var(--course-accent); border-radius: 3px; }
  .lesson-progress-pct { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
  .lesson-card-btn {
    margin-top: 11px; display: inline-flex; align-items: center; gap: 6px;
    background: var(--course-accent); color: #0a0a0c; font-weight: 700; font-size: 12.5px;
    padding: 8px 14px; border-radius: 999px;
  }

  /* ---- Explorar niveles (grilla de íconos) ---- */
  .explore-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 20px; }
  .explore-tile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 4px; border-radius: 16px; border: 1px solid var(--line); text-align: center; }
  .explore-tile.locked { opacity: 0.35; }
  .explore-tile-icon { width: 36px; height: 36px; border-radius: 11px; background: var(--course-accent-dim); display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 800; color: var(--course-accent); }
  .explore-tile-label { font-size: 9.5px; color: var(--text-dim); line-height: 1.25; }

  /* ---- Fila de progreso (estilo "Your Progress") ---- */
  .progress-row { display: flex; border: 1px solid var(--line); border-radius: 16px; padding: 16px 8px; margin-bottom: 20px; }
  .progress-item { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .progress-icon { font-size: 16px; }
  .progress-num { font-size: 16px; font-weight: 800; }
  .progress-lbl { font-size: 9px; color: var(--text-dim); line-height: 1.25; }

  /* ---- Botón de repaso ---- */
  .reviewBtn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 20px;
  }
  .reviewBtn.disabled { opacity: 0.4; }
  .reviewIcon {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: var(--course-accent-dim);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .reviewIcon svg { width: 17px; height: 17px; stroke: var(--course-accent); fill: none; stroke-width: 1.8; }
  .reviewText { flex: 1; }
  .reviewTitle { font-size: 14px; font-weight: 600; }
  .reviewSub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .chev { width: 14px; height: 14px; stroke: var(--text-dim); fill: none; stroke-width: 1.6; flex-shrink: 0; }

  /* ---- Niveles ---- */
  .levelCard {
    padding: 14px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .levelCard.locked { opacity: 0.4; }
  .levelNum {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: var(--course-accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--course-accent);
    flex-shrink: 0;
  }
  .levelBody { flex: 1; min-width: 0; }
  .levelName { font-size: 15.5px; font-weight: 600; }
  .levelSub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .levelProgress { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .levelBar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .levelBarFill { height: 100%; background: var(--text); border-radius: 2px; }

  /* ---- Módulos ---- */
  .moduleRow {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
  }
  .moduleRow.locked { opacity: 0.35; }
  .modCheck {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--text-dim);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .modCheck svg { width: 12px; height: 12px; opacity: 0; stroke: var(--bg); }
  .moduleRow.done .modCheck { background: var(--text); border-color: var(--text); }
  .moduleRow.done .modCheck svg { opacity: 1; }
  .modBody { flex: 1; min-width: 0; }
  .modTitle { font-size: 15px; line-height: 1.35; }
  .modMeta { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }

  /* ---- Lección ---- */
  .lessonHead { margin-bottom: 4px; }
  .lessonKicker { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .lessonTitle { font-size: 21px; font-weight: 700; line-height: 1.25; margin-top: 6px; }
  .lessonMeta { font-size: 12px; color: var(--text-dim); margin-top: 6px; margin-bottom: 18px; }

  .listenBtn {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 13px;
    margin-bottom: 22px;
    align-self: flex-start;
  }
  .listenBtn svg { width: 14px; height: 14px; stroke: var(--text); fill: none; stroke-width: 1.6; }
  .listenBtn.playing { border-color: var(--text); }

  .lessonBody { font-size: 15.5px; line-height: 1.65; }
  .lessonBody p { margin: 0 0 14px; }
  .lessonBody ul, .lessonBody ol { margin: 0 0 14px; padding-left: 20px; }
  .lessonBody li { margin-bottom: 8px; }
  .lessonBody strong { font-weight: 600; }
  .term {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.92em;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    color: var(--accent);
    white-space: nowrap;
  }

  .summaryBox {
    margin-top: 8px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg-soft);
  }
  .summaryLabel { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .summaryText { font-size: 14px; line-height: 1.55; }

  .primaryBtn {
    margin-top: 24px;
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .primaryBtn:active { opacity: 0.85; }
  .primaryBtn.secondary {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
  }

  /* ---- Quiz ---- */
  .quizProgress { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .quizQ { font-size: 17px; font-weight: 600; line-height: 1.4; margin-bottom: 18px; }
  .quizOpt {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 10px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .quizOpt.selected { border-color: var(--text); }
  .quizOpt.correct { border-color: #5fbf7a; background: rgba(95,191,122,0.1); }
  .quizOpt.wrong { border-color: #c15b3e; background: rgba(193,91,62,0.1); }

  .resultScore { font-size: 40px; font-weight: 700; text-align: center; margin: 30px 0 6px; }
  .resultLabel { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 30px; }

  .emptyHint { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; text-align: center; margin-top: 60px; padding: 0 10px; }

  /* ---- Voz ---- */
  .listenRow { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .voiceSelect {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    background: none;
    max-width: 160px;
  }
  .speed-row { display: flex; align-items: center; gap: 8px; margin: -8px 0 18px; flex-wrap: wrap; }
  .speed-lbl { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .speed-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .speed-pill { background: none; border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--text-dim); cursor: pointer; }
  .speed-pill.active { background: var(--course-accent-2); color: #fff; border-color: transparent; }

  /* ---- Diagramas ----
     Ilustraciones propias en SVG (no son fotos ni diagramas bajados de
     internet): así no dependen de conexión ni de derechos de terceros.
     Se les da un toque de color muy sutil sobre el tema oscuro para que
     se lean más como una ilustración real y menos como un boceto. */
  .diagram { margin: 4px 0 20px; color: var(--text); }
  .diagram svg { display: block; width: 100%; height: auto; }
  .diagram svg text { font-size: 9px; fill: var(--text-dim); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .diagramCaption { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.45; }
  :root { --course-wash: rgba(207,154,92,0.16); --course-wash-line: rgba(207,154,92,0.55); --course-wash2: rgba(193,91,62,0.28); --course-wash2-line: rgba(193,91,62,0.7); --course-accent-2: #c15b3e; }

  /* ================= Diseño nuevo 2026-11: fotos + anillo + racha semanal =================
     Piezas agregadas a pedido del usuario: foto de portada en el hero, anillo
     de progreso circular en vez de barra lineal en la tarjeta de "continuar",
     tarjetas de nivel con foto en una fila horizontal, y un mini gráfico de
     barras de actividad semanal junto a la racha — todo inspirado en la
     captura de referencia que mandó. Mismo patrón en los 4 cursos: las
     variables --course-accent* ya definidas arriba son lo único que cambia
     de un curso a otro, este bloque de componentes es idéntico en todos. */

  .hero { display: flex; align-items: center; gap: 16px; }
  .hero-body { flex: 1; min-width: 0; }
  .hero-photo {
    position: relative; z-index: 1; flex-shrink: 0;
    width: 86px; height: 86px; border-radius: 20px; overflow: hidden;
    border: 1px solid var(--course-wash-line);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .ringCardRow { display: flex; align-items: center; gap: 14px; }
  .ring-wrap { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
  .ring-wrap svg { width: 54px; height: 54px; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--line); stroke-width: 5; }
  .ring-fill { fill: none; stroke: var(--course-accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--course-accent); }
  .lesson-card-photo {
    width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .lesson-card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---- Explorar niveles: fila horizontal con foto de portada ---- */
  .explore-row { display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px 20px; padding: 0 20px 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .explore-row::-webkit-scrollbar { display: none; }
  .explore-card {
    position: relative; flex: 0 0 150px; height: 108px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg-soft);
  }
  .explore-card.locked { opacity: 0.45; }
  .explore-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .explore-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,12,0) 30%, rgba(10,10,12,0.88) 100%);
  }
  .explore-card-body { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .explore-card-name { font-size: 12.5px; font-weight: 700; line-height: 1.2; }
  .explore-card-sub { font-size: 9.5px; color: rgba(255,255,255,0.75); margin-top: 2px; }

  /* ---- Gráfico de actividad semanal (barras finas, 1 serie, sin leyenda) ---- */
  .weekChartCard { display: flex; align-items: flex-end; gap: 10px; flex: 1.4; min-width: 0; }
  .weekChart { flex: 1; display: flex; align-items: flex-end; gap: 5px; height: 44px; }
  .weekChart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .weekChart-track { width: 100%; max-width: 14px; flex: 1; display: flex; align-items: flex-end; border-radius: 4px; background: var(--bg-soft); overflow: hidden; }
  .weekChart-bar { width: 100%; border-radius: 4px; background: var(--line); min-height: 3px; }
  .weekChart-bar.active { background: var(--course-accent); }
  .weekChart-col.today .weekChart-lbl { color: var(--text); font-weight: 700; }
  .weekChart-lbl { font-size: 8.5px; color: var(--text-dim); }
  .weekChartLabel { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }

  /* ---- Fotos dentro de la lección (mínimo 2 por módulo) ---- */
  .modPhotos { display: flex; gap: 8px; margin: 0 0 16px; }
  .modPhotos figure { flex: 1; min-width: 0; margin: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-soft); }
  .modPhotos img { width: 100%; height: 118px; object-fit: cover; display: block; }
  .modPhotos figcaption { font-size: 9.5px; color: var(--text-dim); padding: 6px 9px 8px; line-height: 1.3; }

  /* ---- Pronóstico ---- */
  .forecastCard {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 22px;
  }
  .forecastTitle { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .forecastRow { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .forecastRow span:last-child { color: var(--text-dim); }
  .forecastEta { font-size: 13.5px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); line-height: 1.5; }

  /* ---- Dashboard (racha, semana, estadísticas, mes, heatmap) ---- */
  .streakRow { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .streakBadge { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 16px; border: 1px solid var(--course-accent-2); background: rgba(193,91,62,0.08); flex-shrink: 0; }
  .streakBadge .n { font-size: 20px; font-weight: 700; color: var(--course-accent-2); line-height: 1.1; }
  .streakBadge .lbl { font-size: 8.5px; color: var(--course-accent-2); opacity: .85; text-transform: uppercase; letter-spacing: .05em; margin-top: 1px; }
  .weekStrip { display: flex; gap: 6px; flex: 1; }
  .dayCell { flex: 1; aspect-ratio: 1; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 9.5px; color: var(--text-dim); }
  .dayCell.active { background: var(--course-accent-2); color: #fff; border-color: transparent; }
  .dayCell.today { outline: 2px solid var(--course-accent-2); outline-offset: 1px; }

  .statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
  .statCard { padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .statCard .lbl { font-size: 10.5px; color: var(--text-dim); margin-bottom: 5px; }
  .statCard .val { font-size: 18px; font-weight: 600; }
  .statCard .val small { font-size: 11.5px; color: var(--text-dim); font-weight: 400; }

  .dashPanel { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 22px; }
  .dashPanelTitle { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }

  .monthChart { display: flex; align-items: flex-end; gap: 6px; height: 64px; margin: 6px 0 4px; }
  .monthCol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; }
  .monthBar { width: 60%; border-radius: 5px 5px 0 0; background: var(--course-accent-2); min-height: 2px; }
  .monthLbl { font-size: 9px; color: var(--text-dim); text-transform: uppercase; }

  .heatGrid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin: 4px 0 10px; }
  .heatCell { width: 100%; aspect-ratio: 1; border-radius: 2px; background: var(--bg-soft); }
  .heatCell.l1 { background: rgba(193,91,62,0.2); }
  .heatCell.l2 { background: rgba(193,91,62,0.4); }
  .heatCell.l3 { background: rgba(193,91,62,0.6); }
  .heatCell.l4 { background: rgba(193,91,62,0.8); }
  .heatCell.l5 { background: var(--course-accent-2); }
  .heatLegend { display: flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--text-dim); justify-content: flex-end; }
  .heatLegend .heatCell { width: 9px; height: 9px; }

  /* ---- Feedback del quiz ---- */
  .feedbackBox {
    margin-top: 4px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .feedbackBox.good { background: rgba(95,191,122,0.1); border: 1px solid #5fbf7a; }
  .feedbackBox.bad { background: rgba(193,91,62,0.1); border: 1px solid #c15b3e; }
  .feedbackHead { font-weight: 700; margin-bottom: 4px; }

  .resultGrade { font-size: 15px; font-weight: 600; text-align: center; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <a class="back" id="backBtn" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5 L8 12 L15 19"/></svg>
      </a>

   más abajo) para no perderse entre dispositivos.
   ============================================================ */

/* Un solo usuario (Sebas) — Coffee School no tiene selector de perfil,
   a diferencia de golf.html. Se mantiene la misma clave de localStorage
   que ya se usaba por defecto (Sebas era el primer/único perfil activo),
   así que no se pierde ningún progreso ya guardado. */
const activeUser = 'Sebas';

function progressKey(user) { return 'cafe_progress_v1__' + user; }

function loadProgress(user) {
  try {
    const raw = localStorage.getItem(progressKey(user));
    return raw ? JSON.parse(raw) : { completed: {} };
  } catch (e) { return { completed: {} }; }
}
function saveProgress(p) {
  try { localStorage.setItem(progressKey(activeUser), JSON.stringify(p)); } catch (e) {}
  pushProgressSoon();
}
let progress = loadProgress(activeUser);

/* ================= Sync de progreso con Supabase =================
   El progreso vive principalmente en localStorage (la app funciona 100%
   offline), pero eso significa que no viaja entre dispositivos y que un
   navegador que borra datos lo pierde. Este bloque replica el patrón ya
   usado en ropa.html/recetas.html: al cargar, se trae la fila remota de
   este usuario+curso y se combina con la local módulo por módulo (se
   queda con la versión más reciente de cada uno, así no se pierde nada
   sin importar qué dispositivo sincronizó último); después de cada cambio
   local se vuelve a subir el resultado combinado. Usa la misma tabla
   course_progress para los 4 cursos (golf/ski/snowboard/cafe), distinguidos
   por la columna "course". */
const SUPABASE_URL = 'https://ahritihlqnbjvcighhwb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9prcahBAJHmeCZ8IB_bx5w_GQ6nl4wL';
const PROGRESS_TABLE = 'course_progress';
const COURSE_NAME = 'cafe';

async function pullRemoteProgress(user) {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${PROGRESS_TABLE}?user_name=eq.${encodeURIComponent(user)}&course=eq.${COURSE_NAME}&select=data`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    return rows[0] ? rows[0].data : null;
  } catch (e) { return null; }
}

async function pushRemoteProgress(user, prog) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${PROGRESS_TABLE}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ user_name: user, course: COURSE_NAME, data: prog, updated_at: Date.now() })
    });
    return res.ok;
  } catch (e) { return false; }
}

/* Combina dos objetos {completed:{moduleId:{at,...}}} quedándose, para cada
   módulo, con el que tenga el "at" más reciente (o el único que exista). */
function mergeProgressObjects(a, b) {
  const merged = { completed: {} };
  const ac = (a && a.completed) || {};
  const bc = (b && b.completed) || {};
  new Set([...Object.keys(ac), ...Object.keys(bc)]).forEach(id => {
    const x = ac[id], y = bc[id];
    merged.completed[id] = (x && y) ? ((x.at || 0) >= (y.at || 0) ? x : y) : (x || y);
  });
  return merged;
}

let pushTimer = null;
function pushProgressSoon() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushRemoteProgress(activeUser, progress), 600);
}

async function syncProgressOnLoad() {
  const remote = await pullRemoteProgress(activeUser);
  if (!remote) { pushRemoteProgress(activeUser, progress); return; }
  const merged = mergeProgressObjects(progress, remote);
  if (JSON.stringify(merged) !== JSON.stringify(progress)) {
    progress = merged;
    try { localStorage.setItem(progressKey(activeUser), JSON.stringify(progress)); } catch (e) {}
    render();
  }
  pushRemoteProgress(activeUser, progress);
}

          <p><strong>Kenia</strong> produce cafés muy ácidos y afrutados, con notas que suelen describirse como "blackcurrant" (grosella negra) o tomate. Tiene un sistema propio de clasificación por tamaño de grano: <span class="term">AA</span> (el más grande), <span class="term">AB</span>, y <span class="term">PB</span> (<span class="term">peaberry</span>, cuando la cereza desarrolla un solo grano redondeado en vez de los dos habituales). Gran parte de su café se vende a través de un sistema de subasta.</p>
          <p>Ruanda y Burundi, vecinos de la región de los Grandes Lagos, también producen arabicas lavados de calidad creciente, con perfiles que suelen recordar a los de Kenia pero algo más suaves.</p>

        content: `
          <p>El <span class="term">proceso</span> es cómo se separa la semilla de la pulpa de la cereza, y es una de las variables que más cambia el sabor final — tanto como el origen mismo.</p>
          <ul>
            <li><strong>Lavado (washed):</strong> se quita toda la pulpa y el mucílago antes de secar, generalmente fermentando el grano en tanques de agua para aflojar ese mucílago pegajoso. Resultado: tazas más limpias, brillantes y ácidas, donde se nota con claridad el origen.</li>
            <li><strong>Natural (seco):</strong> la cereza entera se seca al sol con toda la pulpa puesta, fermentando dentro de su propia cáscara durante el secado. Resultado: más dulzor y cuerpo, notas a fruta madura o incluso a vino, menos "limpio" que un lavado.</li>
            <li><strong>Honey:</strong> se quita la cáscara pero se deja parte o todo el mucílago pegajoso durante el secado (se habla de honey amarillo, rojo o negro según cuánto mucílago queda). Es un punto intermedio entre lavado y natural.</li>
            <li><strong>Anaeróbico:</strong> fermentación controlada dentro de tanques sellados sin oxígeno. Es una tendencia reciente del movimiento de especialidad, y suele dar perfiles muy intensos y experimentales, con notas a fruta tropical y a veces aromas descritos como "funky".</li>
          </ul>
        `,

        content: `
          <p>Casi todas las variedades de arabica derivan de dos variedades "madre" históricas: <span class="term">Typica</span> y <span class="term">Bourbon</span>. De ahí salieron, entre muchas otras, <span class="term">Caturra</span> (una mutación enana de Bourbon, más productiva), <span class="term">Catuaí</span> y <span class="term">Pacamara</span>.</p>
          <p>La variedad más famosa de los últimos 20 años es <span class="term">Geisha</span> (también escrita <span class="term">Gesha</span>), originaria de Etiopía pero que se volvió célebre al cultivarse en Panamá — desde mediados de la década de 2000 sus perfiles florales y a té de jazmín, muy distintos del café promedio, la convirtieron en una de las variedades más cotizadas en subastas de café de especialidad del mundo.</p>
          <p>¿Qué hace que un café se considere <span class="term">specialty coffee</span> (café de especialidad)? La definición más usada viene de la <span class="term">SCA</span> (Specialty Coffee Association), que establece un protocolo de cata (<span class="term">cupping</span>) donde catadores certificados puntúan la taza sobre 100 puntos. Un café que obtiene <strong>80 puntos o más</strong> se considera "specialty grade"; por debajo, se lo clasifica como "commercial grade". La puntuación no depende solo del sabor: también cuenta la ausencia de defectos físicos en el grano y la trazabilidad del origen.</p>

        content: `
          <p>El tueste transforma el grano verde (sin sabor a "café" todavía) en el grano marrón y aromático que conocemos, a través de reacciones químicas que ocurren con el calor — las más conocidas son la <span class="term">reacción de Maillard</span> (dora el grano y genera sabores tostados) y la <span class="term">caramelización</span> de los azúcares.</p>
          <p>Durante el proceso se escuchan dos sonidos característicos: el <span class="term">first crack</span> (primer crack), cuando el grano se expande y literalmente "truena" por primera vez, y más adelante el <span class="term">second crack</span> (segundo crack), un sonido más suave y rápido.</p>
          <ul>
            <li><strong>Tueste claro (light roast):</strong> se detiene poco después del first crack. Conserva más acidez y los sabores propios del origen. Color canela claro, superficie seca.</li>

            <li><strong>Tueste oscuro (dark roast):</strong> pasado el second crack. Superficie con aceite visible, sabores a tueste/humo que dominan por encima de los del origen, menos acidez. Es el estilo clásico del espresso italiano tradicional, aunque hoy buena parte del café de especialidad usa tuestes más claros incluso para espresso.</li>

        ],
        content: `
          <p>Hay una creencia muy extendida de que el café de tueste oscuro tiene más cafeína porque "sabe más fuerte". Es al revés: la cafeína se degrada levemente con el calor durante el tueste, así que si hay alguna diferencia, el tueste claro conserva un poquito más de cafeína por peso de grano, no menos.</p>
          <p>Lo que realmente cambia con un tueste más oscuro es el <strong>sabor</strong> — más amargor, menos acidez, más notas a tueste — no la cantidad de cafeína.</p>
          <p>Hay sí un matiz real con la medición: como el grano de tueste oscuro pierde más masa y agua durante el proceso, es menos denso. Entonces, si medís el café por volumen (una cucharada) en vez de por peso, una cucharada de grano oscuro pesa menos que una de grano claro — y por lo tanto esa cucharada específica puede tener algo menos de cafeína. Pero esa diferencia es por la densidad del grano, no porque el tueste oscuro "tenga menos cafeína" en sí mismo.</p>

        ],
        content: `
          <p>El café en grano empieza a perder frescura apenas se tuesta. Durante los primeros días libera dióxido de carbono (<span class="term">desgasificación</span> o <span class="term">degassing</span>), un subproducto natural del tueste. Por eso un café recién tostado a veces necesita "reposar" entre 24 horas y varios días antes de prepararse — si se usa demasiado fresco para espresso en particular, el exceso de CO2 puede dar una crema excesiva e inestable.</p>
          <p>La ventana ideal de consumo para la mayoría de los cafés suele ubicarse entre una y cuatro semanas después del tueste — ni recién tostado del todo, ni demasiado viejo.</p>
          <p>Para guardar el café: un recipiente hermético, lejos de la luz, el calor y la humedad. Si es la bolsa original de una tostadora de especialidad, suele traer una válvula de desgasificación de una sola vía, que deja salir el CO2 sin dejar entrar aire — está diseñada para guardarse tal cual, sin necesidad de pasarlo a otro envase.</p>
          <p>Comprar en grano entero en vez de molido alarga muchísimo la vida útil: una vez molido, el café tiene mucha más superficie expuesta al aire y pierde aroma en cuestión de minutos a horas, no de semanas.</p>

        summary: 'El café libera CO2 los primeros días después de tostarse (degassing). La ventana ideal de consumo suele ser 1 a 4 semanas post-tueste. Guardar hermético, lejos de luz/calor/humedad, y en grano entero.',

        content: `
          <p>El <span class="term">cupping</span> es el protocolo estándar que usa la industria para evaluar café de forma objetiva y comparable. Estos son sus pasos básicos:</p>
          <ul>
            <li><strong>Fragancia:</strong> oler el café recién molido, todavía seco, antes de agregar agua.</li>
            <li><strong>Aroma:</strong> verter agua caliente sobre el molido y oler lo que sube apenas se moja.</li>
            <li><strong>Romper la costra (<span class="term">breaking the crust</span>):</strong> a los pocos minutos se forma una capa de café molido flotando arriba; se rompe con una cuchara, acercando la nariz para captar el aroma que libera.</li>
            <li><strong>Desnatado (<span class="term">skimming</span>):</strong> se retiran con la cuchara los sólidos que quedaron flotando en la superficie.</li>
            <li><strong>Cata a sorbos fuertes (<span class="term">slurping</span>):</strong> se toma un sorbo rápido y ruidoso, que atomiza el líquido sobre toda la lengua y el paladar a la vez, en vez de tomarlo como se bebe normalmente.</li>
          </ul>
          <p>Durante la cata se evalúan categorías específicas: fragancia/aroma, sabor, acidez, cuerpo, dulzor, balance, retrogusto (aftertaste) y defectos. Esto, en versión simplificada, se puede practicar perfectamente en casa con dos o tres cafés distintos lado a lado.</p>

          { q: '¿Por qué en el cupping se toma el café a sorbos fuertes y ruidosos (slurping)?', options: ['Es solo una costumbre sin motivo', 'Porque atomiza el líquido sobre toda la lengua y el paladar a la vez', 'Porque así se enfría más rápido', 'Porque es más rápido que tomarlo normal'], correct: 1, explain: 'El slurping atomiza el café sobre toda la boca de una vez, permitiendo percibir mejor todas las características del sabor.' },
          { q: '¿Cuál de estos NO es un paso del protocolo de cupping descrito?', options: ['Oler el café seco (fragancia)', 'Romper la costra', 'Agregar leche espumada', 'Desnatar la superficie'], correct: 2, explain: 'Agregar leche espumada no forma parte del protocolo de cupping — el café se cata solo, sin aditivos, para evaluarlo de forma objetiva.' },

        ],
        content: `
          <p>La <span class="term">Coffee Taster's Flavor Wheel</span> (rueda de sabores del catador de café), desarrollada por la SCA junto con World Coffee Research, organiza los descriptores de sabor en categorías amplias en el centro — frutal, floral, dulce, a nuez/cacao, especiado, tostado, entre otras — que se van ramificando hacia afuera en descriptores cada vez más específicos. Por ejemplo: frutal → bayas → grosella negra.</p>
          <p>Es importante entender que la rueda es un <strong>vocabulario compartido</strong> para comunicar lo que se percibe, no una lista literal de ingredientes que están físicamente en el café — ningún café "tiene" grosella negra adentro, pero el cerebro puede reconocer compuestos aromáticos similares y asociarlos con ese recuerdo.</p>
          <p>Algunos consejos prácticos para catar en casa:</p>
          <ul>
            <li>Probar el café a distintas temperaturas mientras se enfría: muchos sabores cambian o se vuelven más evidentes a medida que baja la temperatura.</li>

            <li>Empezar por categorías amplias (¿es más frutal o más a nuez?) antes de intentar afinar un descriptor muy específico.</li>
          </ul>

          { q: 'Cuando alguien dice que un café "sabe a grosella negra", ¿significa que literalmente contiene esa fruta?', options: ['Sí, literalmente', 'No — es una asociación de compuestos aromáticos similares, no un ingrediente real', 'Solo en cafés orgánicos', 'Solo es posible en espresso'], correct: 1, explain: 'La rueda es un vocabulario para describir percepciones, no una lista de ingredientes reales presentes en el café.' },
          { q: '¿Por qué conviene probar el café a distintas temperaturas mientras se enfría?', options: ['Porque no hay ninguna diferencia', 'Porque muchos sabores cambian o se vuelven más evidentes al bajar la temperatura', 'Porque el café caliente no tiene sabor', 'Solo aplica al cold brew'], correct: 1, explain: 'A medida que el café se enfría, distintos sabores pueden volverse más o menos evidentes — por eso se recomienda probarlo en varios momentos.' },

          <p>El punto de partida estándar para la mayoría de los métodos filtrados es una ratio entre <strong>1:15 y 1:18</strong> en peso (1 gramo de café molido por cada 15 a 18 gramos/mililitros de agua). Las guías norteamericanas tienden a recomendar más cerca de 1:18 (más suave); algunos países nórdicos prefieren una taza más concentrada, cerca de 1:16. Conviene siempre <strong>pesar</strong> el café con una balanza, no medir por cucharadas — el volumen de un grano cambia según el tueste y la molienda, pero el peso no.</p>
          <p>La temperatura ideal del agua para métodos filtrados está entre <strong>90°C y 96°C</strong> (195°F a 205°F) — justo por debajo del punto de hervor. Agua hirviendo a 100°C puede extraer de más y dar sabores amargos o "quemados".</p>

      {

        ],
        content: `
          <p>La <span class="term">prensa francesa</span> es un método de <span class="term">inmersión total</span>: el café molido queda en contacto directo con toda el agua durante todo el tiempo de preparación, a diferencia de un filtrado donde el agua va pasando.</p>
          <p><strong>Molienda:</strong> gruesa, como sal gruesa o granos de pimienta — una molienda fina se filtraría mal por el colador metálico y daría una taza turbia con mucho sedimento.</p>
          <p><strong>Pasos básicos:</strong></p>
          <ul>
            <li>Ratio aproximada 1:15.</li>
            <li>Verter agua a 93-96°C sobre el café molido.</li>
            <li>Remover suavemente para asegurar que todo el café esté mojado.</li>
            <li>Dejar reposar unos <strong>4 minutos</strong>.</li>
            <li>Romper la costra que se forma arriba con una cuchara, y retirar la espuma de la superficie.</li>
            <li>Recién ahí, bajar el émbolo lentamente y con presión pareja.</li>
          </ul>
          <p>Servir enseguida: si el café se deja mucho tiempo en contacto con los posos después de bajar el émbolo, sigue extrayendo y puede amargarse.</p>
        `,

          { q: '¿Qué molienda se usa en prensa francesa?', options: ['Muy fina, como polvo', 'Gruesa, como sal gruesa', 'Exactamente igual que espresso', 'No se muele, se usa grano entero'], correct: 1, explain: 'Se usa molienda gruesa — una fina se colaría mal y daría una taza turbia con sedimento.' },

        content: `
          <p>El <span class="term">pour-over</span> (filtrado manual por goteo) consiste en verter agua caliente sobre café molido en un filtro, dejando que el líquido pase por gravedad.</p>
          <p><strong>V60:</strong> cono con ranuras espiraladas en las paredes y un agujero grande en la base, que favorece un flujo más rápido y tazas más brillantes y claras. Usa filtros de papel cónicos.</p>
          <p><strong>Chemex:</strong> su propio filtro de papel, bastante más grueso que el de un V60 estándar, que retiene más aceites y partículas finas — da una taza más limpia y suave, con un flujo más lento.</p>
          <p><strong>Técnica básica (aplica a ambos):</strong></p>
          <ul>
            <li><strong>Bloom</strong> (pre-infusión): verter una cantidad de agua equivalente al doble del peso del café (ej. 40g de agua para 20g de café), y dejar reposar 30 a 45 segundos. Esto permite que el CO2 que libera el café recién molido escape antes de la extracción principal, para una extracción más pareja.</li>
            <li>Verter el resto del agua en 2 o 3 pulsos, en movimientos circulares desde el centro hacia afuera, sin tocar directamente el borde del filtro.</li>
            <li>Tiempo total de extracción recomendado: aproximadamente 2.5 a 4 minutos, según el volumen que se esté preparando.</li>
          </ul>

          { q: '¿Qué diferencia principal hay entre el filtro de V60 y el de Chemex?', options: ['No hay ninguna diferencia', 'El de Chemex es más grueso, retiene más aceites y da un flujo más lento', 'El de V60 es de tela', 'El de Chemex no usa papel'], correct: 1, explain: 'El filtro de Chemex es considerablemente más grueso que el de un V60, retiene más aceites/finos y hace que el flujo sea más lento.' },
          { q: '¿Cómo se debe verter el agua después del bloom?', options: ['De una sola vez, todo junto', 'En 2 o 3 pulsos, en movimientos circulares desde el centro', 'Directamente sobre el borde del filtro', 'Con el agua hirviendo a 100°C'], correct: 1, explain: 'Se vierte en 2 o 3 pulsos circulares del centro hacia afuera, evitando mojar directamente el borde del filtro.' },
          { q: '¿Cuál es el tiempo total de extracción recomendado para un pour-over típico?', options: ['10-15 segundos', '2.5 a 4 minutos', '20 a 30 minutos', '12 a 24 horas'], correct: 1, explain: 'El tiempo total recomendado ronda entre 2.5 y 4 minutos, según el volumen que se esté preparando.' },

        ],
        content: `
          <p>El <span class="term">AeroPress</span> es un método híbrido: combina inmersión (el café y el agua están en contacto dentro de un cilindro) con presión manual (se empuja un émbolo de goma que fuerza el líquido a través de un filtro de papel o metal en la base).</p>

        content: `
          <p>La <span class="term">moka</span> (cafetera italiana, también llamada <span class="term">macchinetta</span>) prepara café usando la presión que genera el vapor de agua al calentarse. No es técnicamente "espresso" — usa mucha menos presión que una máquina de espresso real — pero da un resultado concentrado y de estilo similar.</p>
          <p>Tiene tres partes: la cámara inferior (donde va el agua), el filtro o embudo (donde va el café molido) y la cámara superior (donde sube el café ya preparado).</p>

            <li>Llenar la cámara inferior con agua hasta justo debajo de la válvula de seguridad (nunca por encima).</li>

            <li>Armar y poner a fuego medio-bajo, con la tapa abierta para poder ver cuándo empieza a salir el café.</li>
            <li>Retirar del fuego apenas empieza a salir el café con su característico sonido burbujeante/silbante — dejarla más tiempo en el fuego después de ese punto tiende a dar sabores quemados o amargos.</li>
          </ul>

        content: `

        content: `

        content: `

          <p><strong>Molino de cuchillas (blade grinder):</strong> corta el grano de forma irregular — en la misma molienda terminan partículas muy grandes junto con partículas casi en polvo. El problema es que esas partículas finas se sobre-extraen (dan amargor) mientras las gruesas se sub-extraen (dan sabor aguado/agrio) <strong>al mismo tiempo</strong>, en la misma taza — un desbalance que ningún otro paso del proceso puede corregir después.</p>

          <p>Otro detalle importante: moler el café justo antes de prepararlo (no la noche anterior) conserva muchísimo mejor los aromas volátiles, que se pierden rápido una vez molido el grano.</p>

          <p>El café preparado es aproximadamente <strong>98% a 99% agua</strong> — así que la calidad del agua importa tanto como la calidad del grano, aunque se piense mucho menos en ella.</p>

/* Índice plano de todos los módulos con contenido real, para el repaso. */
function allUnlockedModules() {
  const out = [];
  CURRICULUM.forEach(level => {
    if (level.locked) return;
    level.modules.forEach(m => out.push(m));
  });
  return out;
}
function findModule(moduleId) {
  for (const level of CURRICULUM) {
    if (level.locked) continue;
    const m = level.modules.find(x => x.id === moduleId);
    if (m) return { level, module: m };
  }
  return null;
}
function levelStats(level) {
  if (level.locked) return { done: 0, total: level.modules.length };
  const done = level.modules.filter(m => progress.completed[m.id]).length;
  return { done, total: level.modules.length };
}

/* ================= Pronóstico de cuándo terminarías el curso =================
   Estimación honesta a partir de tu propio ritmo: cuántos minutos de
   contenido ya completaste y en cuántos días, proyectado sobre los
   minutos que faltan de TODO el curso (26 módulos, incluidos los que
   todavía están "próximamente"). No es una promesa, es una proyección. */
function allModulesFlat() {
  const out = [];
  CURRICULUM.forEach(level => level.modules.forEach(m => out.push(m)));
  return out;
}
function courseForecast() {
  const all = allModulesFlat();
  const totalMinutes = all.reduce((s, m) => s + m.minutes, 0);

  const idToMinutes = {};
  allUnlockedModules().forEach(m => { idToMinutes[m.id] = m.minutes; });

  const completedEntries = Object.entries(progress.completed);
  const completedCount = completedEntries.length;
  const completedMinutes = completedEntries.reduce((s, [id]) => s + (idToMinutes[id] || 0), 0);
  const remainingMinutes = Math.max(0, totalMinutes - completedMinutes);

  const scores = completedEntries.map(([, v]) => v.score && typeof v.score.pct === 'number' ? v.score.pct : null).filter(v => v !== null);
  const avgScorePct = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;

  let etaText = null;
  if (completedCount === 0) {
    etaText = 'Completá tu primer módulo para empezar a ver un pronóstico.';
  } else if (remainingMinutes <= 0) {
    etaText = '¡Ya completaste todo el contenido disponible del curso!';
  } else {
    const timestamps = completedEntries.map(([, v]) => v.at).sort((a, b) => a - b);
    const spanDays = (timestamps[timestamps.length - 1] - timestamps[0]) / 86400000;
    if (completedCount < 2 || spanDays < 1) {
      etaText = `Te faltan ${formatMinutes(remainingMinutes)} de contenido. Seguí completando módulos en distintos días para que la app calcule tu ritmo real y te dé una fecha estimada.`;
    } else {
      const paceMinutesPerDay = completedMinutes / spanDays;
      const daysLeft = Math.max(1, Math.ceil(remainingMinutes / paceMinutesPerDay));
      const target = new Date(Date.now() + daysLeft * 86400000);
      const dateStr = target.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
      etaText = `A tu ritmo actual (~${Math.round(paceMinutesPerDay)} min/día), terminarías el curso completo alrededor del ${dateStr} (~${daysLeft} días).`;
    }
  }

  return { totalMinutes, completedMinutes, remainingMinutes, completedCount, totalCount: all.length, avgScorePct, etaText };
}
function formatMinutes(min) {
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  const rem = min % 60;
  return rem ? `${h} h ${rem} min` : `${h} h`;
}

/* ================= Dashboard (racha, semana, heatmap, mes) =================
   Todo se deriva de los timestamps que ya guarda progress.completed[id].at —
   no hace falta ningún storage nuevo. */
function dayKey(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.toISOString().slice(0, 10);
}
function computeCafeStats() {
  const entries = Object.entries(progress.completed).filter(([, v]) => v && v.at);
  const byDay = {};
  entries.forEach(([, v]) => { const k = dayKey(v.at); byDay[k] = (byDay[k] || 0) + 1; });

  // Racha actual: cuenta hacia atrás desde hoy (si hoy no tiene actividad
  // todavía, no rompe la racha — simplemente empieza a contar desde ayer).
  let streak = 0;
  const cursor = new Date(); cursor.setHours(0, 0, 0, 0);
  if (!byDay[dayKey(cursor.getTime())]) cursor.setDate(cursor.getDate() - 1);
  while (byDay[dayKey(cursor.getTime())]) { streak++; cursor.setDate(cursor.getDate() - 1); }

  // Racha récord: la corrida más larga de días consecutivos con actividad.
  const sortedDays = Object.keys(byDay).sort();
  let record = 0, run = 0, prevD = null;
  sortedDays.forEach(k => {
    const d = new Date(k + 'T00:00:00');
    run = (prevD && Math.round((d - prevD) / 86400000) === 1) ? run + 1 : 1;
    record = Math.max(record, run);
    prevD = d;
  });

  // Semana actual (lunes a domingo) para la tira de días.
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const isoDow = (today.getDay() + 6) % 7; // 0=lunes
  const monday = new Date(today); monday.setDate(today.getDate() - isoDow);
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const count = byDay[dayKey(d.getTime())] || 0;
    week.push({ label: ['L', 'M', 'X', 'J', 'V', 'S', 'D'][i], active: !!count, count, isToday: dayKey(d.getTime()) === dayKey(today.getTime()) });
  }

  // Heatmap: últimas 20 semanas (140 días), 5 columnas por semana visualmente
  // en una grilla de 20 columnas x 7 filas, una celda por día.
  const heatDays = [];
  for (let i = 139; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const n = byDay[dayKey(d.getTime())] || 0;
    let cls = 'heatCell';
    if (n >= 5) cls += ' l5'; else if (n >= 3) cls += ' l4'; else if (n === 2) cls += ' l3'; else if (n === 1) cls += ' l2';
    heatDays.push(cls);
  }

  // Módulos completados por mes (últimos 6 meses con datos, o los últimos 6
  // meses calendario si no hay suficiente historial).
  const byMonth = {};
  entries.forEach(([, v]) => { const m = new Date(v.at).toISOString().slice(0, 7); byMonth[m] = (byMonth[m] || 0) + 1; });
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    const key = d.toISOString().slice(0, 7);
    months.push({ key, label: d.toLocaleDateString('es-ES', { month: 'short' }).replace('.', ''), count: byMonth[key] || 0 });
  }
  const monthMax = Math.max(1, ...months.map(m => m.count));

  return { streak, record, week, heatDays, months, monthMax };
}

/* ================= Navegación (pila de vistas) ================= */
let viewStack = [{ view: 'niveles' }];

function push(view, data) {
  stopSpeaking();
  viewStack.push({ view, data });
  render();
  document.getElementById('app').scrollTop = 0;
}
function back() {
  stopSpeaking();
  viewStack.pop();
  if (!viewStack.length) { window.location.href = 'index.html'; return; }
  render();
  document.getElementById('app').scrollTop = 0;
}
document.getElementById('backBtn').addEventListener('click', (e) => {
  e.preventDefault();
  back();
});

/* ================= Texto a voz (botón "escuchar") =================
   El botón lee el MÓDULO COMPLETO, no solo el resumen. Safari/iOS tiene
   un bug conocido donde speechSynthesis corta utterances largas a mitad
   de camino — se evita partiendo el texto en oraciones cortas (se hablan
   en cadena) y con un "watchdog" que hace pause()/resume() cada pocos
   segundos, que es el workaround estándar para ese bug. */

const VOICE_PREF_KEY = 'cafe_voice_pref';
const AUDIO_RATE_KEY = 'cafe_audio_rate';
let availableVoices = [];
let speakWatchdog = null;
let speakChain = null; // { chunks, idx, btn } — para poder cancelar
let audioRate = 1;
try { const savedRate = parseFloat(localStorage.getItem(AUDIO_RATE_KEY)); if (savedRate && savedRate > 0) audioRate = savedRate; } catch (e) {}

function setAudioRate(r) {
  audioRate = r;
  try { localStorage.setItem(AUDIO_RATE_KEY, String(r)); } catch (e) {}
  if (speakChain && speakChain.currentAudio) speakChain.currentAudio.playbackRate = r;
  initSpeedUI();
}
function initSpeedUI() {
  document.querySelectorAll('.speed-pill').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === audioRate);
  });
}

function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  availableVoices = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    refreshVoices();
    // Si estamos parados en una lección, redibujá para que aparezca el
    // selector de voz apenas el navegador termine de cargar las voces
    // (en muchos navegadores getVoices() llega vacío en el primer intento).
    const top = viewStack[viewStack.length - 1];
    if (top && top.view === 'leccion') render();
  };
}

/* Heurística para preferir voces que suenan más naturales/humanas:
   las voces "Enhanced"/"Premium"/"Neural" suelen ser mejores que las
   "compact" por defecto, cuando el dispositivo las tiene instaladas. */
function scoreVoice(v) {
  let score = 0;
  const name = (v.name || '').toLowerCase();
  if (v.lang && v.lang.toLowerCase().startsWith('es')) score += 100;
  if (/enhanced|premium|neural|natural|siri/.test(name)) score += 50;
  if (v.localService) score += 5;
  return score;
}
function voiceOptions() {
  if (!availableVoices.length) return [];
  const spanish = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
  const list = spanish.length ? spanish : availableVoices;
  return list.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a));
}
function getPreferredVoice() {
  const opts = voiceOptions();
  if (!opts.length) return null;
  let savedName = null;
  try { savedName = localStorage.getItem(VOICE_PREF_KEY); } catch (e) {}
  if (savedName) {
    const match = opts.find(v => v.name === savedName);
    if (match) return match;
  }
  return opts[0];
}
function setVoicePref(name) {
  try { localStorage.setItem(VOICE_PREF_KEY, name); } catch (e) {}
}

function stopSpeaking() {
  if (speakWatchdog) { clearInterval(speakWatchdog); speakWatchdog = null; }
  if (speakChain) {
    if (speakChain.currentAudio) {
      try { speakChain.currentAudio.pause(); speakChain.currentAudio.src = ''; } catch (e) {}
    }
    if (speakChain.btn) speakChain.btn.classList.remove('playing');
  }
  speakChain = null;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

/* Convierte el HTML de un módulo en texto plano hablable, agregando el
   título y el resumen final como cierre. */
function moduleSpeechText(m) {
  const tmp = document.createElement('div');
  tmp.innerHTML = m.content;
  tmp.querySelectorAll('li').forEach(li => { li.textContent = li.textContent.trim().replace(/[.:]?$/, '. '); });
  const raw = tmp.textContent.replace(/\s+/g, ' ').trim();
  return `${m.title}. ${raw} En resumen: ${m.summary}`;
}

function splitIntoChunks(text) {
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  let cur = '';
  sentences.forEach(s => {
    if ((cur + s).length > 180 && cur) { chunks.push(cur.trim()); cur = s; }
    else cur += s;
  });
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

/* ================= Voz "real" (Google Translate TTS) con fallback =================
   Por defecto, la app pide el audio de cada oración al endpoint público de
   Google Translate (el mismo que usa la librería gTTS) — da una voz en
   español mucho más natural y consistente que las voces del dispositivo,
   y no depende de qué voces tenga instaladas el iPhone. Es un endpoint NO
   oficial (no hay una API con clave detrás), así que puede fallar o dejar
   de funcionar sin aviso — por eso cada oración que falla (sin internet,
   bloqueado, lo que sea) cae automáticamente a la voz del dispositivo
   (speechSynthesis), sin que el usuario tenga que hacer nada. */

const GOOGLE_TTS_ENDPOINT = 'https://translate.google.com/translate_tts';

function googleTtsUrl(text) {
  const params = new URLSearchParams({ ie: 'UTF-8', q: text, tl: 'es', client: 'tw-ob' });
  return `${GOOGLE_TTS_ENDPOINT}?${params.toString()}`;
}

/* Reproduce un chunk con la voz de Google. Resuelve al terminar, rechaza
   si falla (sin internet, endpoint bloqueado, timeout, etc.). */
function playGoogleTtsChunk(text) {
  return new Promise((resolve, reject) => {
    const audio = new Audio(googleTtsUrl(text));
    audio.playbackRate = audioRate;
    let settled = false;
    const finish = (ok, err) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (speakChain && speakChain.currentAudio === audio) speakChain.currentAudio = null;
      ok ? resolve() : reject(err || new Error('google-tts-failed'));
    };
    const timer = setTimeout(() => { audio.pause(); finish(false, new Error('timeout')); }, 6000);
    audio.addEventListener('ended', () => finish(true));
    audio.addEventListener('error', () => finish(false, new Error('audio-error')));
    if (speakChain) speakChain.currentAudio = audio;
    audio.play().catch(err => finish(false, err));
  });
}

/* Reproduce un chunk con la voz del dispositivo (fallback). Nunca rechaza:
   si falla, simplemente sigue con el próximo chunk. */
function playSynthChunk(text, voice) {
  return new Promise((resolve) => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = voice ? voice.lang : 'es-ES';
    if (voice) utter.voice = voice;
    utter.rate = 0.98 * audioRate;
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    window.speechSynthesis.speak(utter);
  });
}

/* ================= Audio pregrabado (voz "real" de ElevenLabs) =================
   Algunos módulos tienen su audio grabado de antemano con una voz humana
   mucho más natural (ElevenLabs) — se reproduce desde Supabase Storage
   (bucket público site-media), y queda cacheado por el service worker tras
   la primera reproducción para funcionar offline después. Si el archivo no
   está o falla, cae al flujo en vivo de siempre (Google Translate TTS con
   fallback a la voz del dispositivo). */
const PREGEN_AUDIO_MODULES = new Set([]);

const MEDIA_BASE_URL = 'https://ahritihlqnbjvcighhwb.supabase.co/storage/v1/object/public/site-media';

function pregenAudioUrl(moduleId) {
  return `${MEDIA_BASE_URL}/audio/${moduleId}.mp3`;
}

function playPregenAudio(moduleId, btn, text, fallbackVoice) {
  const audio = new Audio(pregenAudioUrl(moduleId));
  audio.playbackRate = audioRate;
  speakChain = { btn, currentAudio: audio };
  btn.classList.add('playing');
  const fallToLive = () => {
    if (!speakChain || speakChain.currentAudio !== audio) return;
    speakChain.currentAudio = null;
    speakWithLiveVoice(text, btn, fallbackVoice);
  };
  audio.addEventListener('ended', () => stopSpeaking());
  audio.addEventListener('error', fallToLive);
  audio.play().catch(fallToLive);
}

function toggleSpeak(text, btn, moduleId) {
  if (speakChain || (('speechSynthesis' in window) && window.speechSynthesis.speaking)) {
    stopSpeaking();
    return;
  }
  const fallbackVoice = getPreferredVoice();
  if (moduleId && PREGEN_AUDIO_MODULES.has(moduleId)) {
    playPregenAudio(moduleId, btn, text, fallbackVoice);
    return;
  }
  speakWithLiveVoice(text, btn, fallbackVoice);
}

function speakWithLiveVoice(text, btn, fallbackVoice) {
  const chunks = splitIntoChunks(text);
  speakChain = { chunks, idx: 0, btn, currentAudio: null };
  btn.classList.add('playing');
  // Si el primer chunk falla con Google, asumimos que no hay internet /
  // el endpoint está bloqueado, y usamos la voz del dispositivo para el
  // resto — así no esperamos un timeout de 6s por cada oración.
  let googleFailedThisPlayback = false;

  async function speakNext() {
    if (!speakChain) return;
    if (speakChain.idx >= speakChain.chunks.length) { stopSpeaking(); return; }
    const chunk = speakChain.chunks[speakChain.idx];
    if (!googleFailedThisPlayback) {
      try {
        await playGoogleTtsChunk(chunk);
        if (!speakChain) return;
        speakChain.idx++;
        speakNext();
        return;
      } catch (e) {
        googleFailedThisPlayback = true;
      }
    }
    if (!speakChain) return;
    if (!('speechSynthesis' in window)) { stopSpeaking(); return; }
    await playSynthChunk(chunk, fallbackVoice);
    if (!speakChain) return;
    speakChain.idx++;
    speakNext();
  }
  speakNext();

  // Watchdog contra el bug de Safari/iOS que corta utterances largas de
  // speechSynthesis — solo entra en juego cuando estamos en el fallback.
  speakWatchdog = setInterval(() => {
    if (!('speechSynthesis' in window)) return;
    if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending) return;
    window.speechSynthesis.pause();
    window.speechSynthesis.resume();
  }, 4000);
}

/* ================= Render ================= */
function render() {
  const top = viewStack[viewStack.length - 1];
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (top.view === 'niveles') renderNiveles(app);
  else if (top.view === 'nivel') renderNivel(app, top.data);
  else if (top.view === 'leccion') renderLeccion(app, top.data);
  else if (top.view === 'quiz') renderQuiz(app, top.data);
  else if (top.view === 'repaso') renderRepaso(app, top.data);
}

/* ================= Hero / tarjeta "seguí donde ibas" / explorar =================
   Dashboard tipo "school": banner con título grande + botón pill, tarjeta de
   "continuar" con anillo de progreso circular, fila de niveles con foto para
   explorar, y una fila de 3 estadísticas con íconos + racha semanal. Todo se
   arma a partir de los mismos datos que ya existían (progress.completed,
   CURRICULUM, courseForecast/computeCafeStats). */
function nextIncompleteModule() {
  for (const level of CURRICULUM) {
    if (level.locked) continue;
    for (const m of level.modules) {
      if (!progress.completed[m.id]) return { level, module: m };
    }
  }
  return null;
}

/* Foto de portada del hero: la primera imagen del primer módulo del curso,
   así no depende de un campo aparte y se mantiene coherente con el resto. */
function heroPhotoUrl() {
  const first = CURRICULUM[0] && CURRICULUM[0].modules[0];
  return first && first.imgs && first.imgs[0] ? first.imgs[0].url : null;
}

function renderHero(app, next) {
  const hero = document.createElement('div');
  hero.className = 'hero';
  const photo = heroPhotoUrl();
  hero.innerHTML = `
    <div class="hero-body">
      <div class="hero-eyebrow">☕ Coffee School</div>
      <h1 class="hero-title">Tomá mejor café.<br><b>Desde el grano.</b></h1>
      <p class="hero-sub">Método, origen y tueste — un módulo a la vez.</p>
      <div class="hero-cta">
        <svg viewBox="0 0 24 24"><path d="M6 4 L20 12 L6 20 Z"/></svg>
        <span>${next ? 'Seguir aprendiendo' : 'Repasar el curso'}</span>
      </div>
    </div>
    ${photo ? `<div class="hero-photo"><img src="${photo}" alt="" loading="lazy" /></div>` : ''}
  `;
  hero.querySelector('.hero-cta').addEventListener('click', () => {
    if (next) push('leccion', { moduleId: next.module.id });
    else if (Object.keys(progress.completed).length > 0) startRepaso();
  });
  app.appendChild(hero);
}

/* Anillo de progreso circular en vez de barra lineal — r=24, circunferencia
   ≈150.8, se recorta el stroke-dasharray según el % para dibujar el arco. */
function ringSvg(pct) {
  const r = 24, c = 2 * Math.PI * r;
  const offset = c * (1 - pct / 100);
  return `
    <div class="ring-wrap">
      <svg viewBox="0 0 54 54">
        <circle class="ring-track" cx="27" cy="27" r="${r}" />
        <circle class="ring-fill" cx="27" cy="27" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}" />
      </svg>
      <div class="ring-pct">${pct}%</div>
    </div>
  `;
}

function renderLessonCard(app, next) {
  if (!next) return;
  const { level, module: m } = next;
  const stats = levelStats(level);
  const pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
  const photo = m.imgs && m.imgs[0] ? m.imgs[0].url : null;
  const card = document.createElement('div');
  card.className = 'lesson-card';
  card.innerHTML = `
    <div class="ringCardRow">
      ${ringSvg(pct)}
      ${photo ? `<div class="lesson-card-photo"><img src="${photo}" alt="" loading="lazy" /></div>` : ''}
    </div>
    <div class="lesson-card-body">
      <div class="lesson-card-eyebrow">${level.name} · continuá donde ibas</div>
      <div class="lesson-card-title">${m.title}</div>
      <div class="lesson-card-btn">Continuar lección →</div>
    </div>
  `;
  card.addEventListener('click', () => push('leccion', { moduleId: m.id }));
  app.appendChild(card);
}

/* Fila horizontal de niveles con foto de portada (reemplaza la grilla de
   íconos anterior). La portada de cada nivel es la primera imagen de su
   primer módulo. */
function renderExploreGrid(app) {
  const row = document.createElement('div');
  row.className = 'explore-row';
  CURRICULUM.forEach(level => {
    const firstMod = level.modules[0];
    const cover = firstMod && firstMod.imgs && firstMod.imgs[0] ? firstMod.imgs[0].url : null;
    const card = document.createElement('div');
    card.className = 'explore-card' + (level.locked ? ' locked' : '');
    card.innerHTML = `
      ${cover ? `<img src="${cover}" alt="" loading="lazy" />` : ''}
      <div class="explore-card-body">
        <div class="explore-card-name">${level.name}</div>
        <div class="explore-card-sub">${level.locked ? 'próximamente' : level.modules.length + ' módulos'}</div>
      </div>
    `;
    if (!level.locked) card.addEventListener('click', () => push('nivel', { levelId: level.id }));
    row.appendChild(card);
  });
  app.appendChild(row);
}

function renderProgressRow(app, fc, gs) {
  const hours = Math.round((fc.completedMinutes / 60) * 10) / 10;
  const row = document.createElement('div');
  row.className = 'progress-row';
  row.innerHTML = `
    <div class="progress-item"><div class="progress-icon">🏆</div><div class="progress-num">${fc.completedCount}</div><div class="progress-lbl">Módulos<br>completados</div></div>
    <div class="progress-item"><div class="progress-icon">⏱️</div><div class="progress-num">${hours}</div><div class="progress-lbl">Horas<br>aprendidas</div></div>
    <div class="progress-item"><div class="progress-icon">🔥</div><div class="progress-num">${gs.streak}</div><div class="progress-lbl">Racha<br>de días</div></div>
  `;
  app.appendChild(row);

  const chartCard = document.createElement('div');
  chartCard.className = 'levelCard';
  chartCard.style.cssText = 'flex-direction:column; align-items:stretch; cursor:default;';
  const maxCount = Math.max(1, ...gs.week.map(d => d.count || 0));
  chartCard.innerHTML = `
    <div class="weekChartLabel">Actividad de la semana</div>
    <div class="weekChart">
      ${gs.week.map(d => {
        const h = d.count ? Math.max(14, Math.round((d.count / maxCount) * 100)) : 6;
        return `
          <div class="weekChart-col${d.isToday ? ' today' : ''}">
            <div class="weekChart-track"><div class="weekChart-bar${d.count ? ' active' : ''}" style="height:${h}%"></div></div>
            <div class="weekChart-lbl">${d.label}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  app.appendChild(chartCard);
}

function renderNiveles(app) {
  const totalDone = Object.keys(progress.completed).length;
  const next = nextIncompleteModule();
  const fc = courseForecast();
  const gs = computeCafeStats();

  renderHero(app, next);
  renderLessonCard(app, next);
  renderExploreGrid(app);

  const reviewBtn = document.createElement('div');
  reviewBtn.className = 'reviewBtn' + (totalDone === 0 ? ' disabled' : '');
  reviewBtn.innerHTML = `
    <div class="reviewIcon"><svg viewBox="0 0 24 24"><path d="M4 12 a8 8 0 1 1 2.5 5.8"/><path d="M4 12 L4 17 L9 17"/></svg></div>
    <div class="reviewText">
      <div class="reviewTitle">Repaso general</div>
      <div class="reviewSub">${totalDone === 0 ? 'Completá al menos un módulo para desbloquearlo' : 'Quiz con preguntas de los ' + totalDone + ' módulo' + (totalDone === 1 ? '' : 's') + ' que ya completaste'}</div>
    </div>
    <svg class="chev" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>
  `;
  if (totalDone > 0) reviewBtn.addEventListener('click', () => startRepaso());
  app.appendChild(reviewBtn);

  renderProgressRow(app, fc, gs);

  const levelListTitle = document.createElement('div');
  levelListTitle.className = 'dashPanelTitle';
  levelListTitle.style.marginBottom = '10px';
  levelListTitle.textContent = 'Todos los niveles';
  app.appendChild(levelListTitle);

  CURRICULUM.forEach(level => {
    const stats = levelStats(level);
    const card = document.createElement('div');
    card.className = 'levelCard' + (level.locked ? ' locked' : '');
    card.innerHTML = `
      <div class="levelNum">${level.name.replace('Nivel ', '')}</div>
      <div class="levelBody">
        <div class="levelName">${level.name} — ${level.subtitle}</div>
        ${level.locked
          ? `<div class="levelSub">próximamente</div>`
          : `<div class="levelProgress">${stats.done}/${stats.total} módulos completados</div>
             <div class="levelBar"><div class="levelBarFill" style="width:${stats.total ? (stats.done / stats.total * 100) : 0}%"></div></div>`
        }
      </div>
      ${level.locked ? '' : '<svg class="chev" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>'}
    `;
    if (!level.locked) card.addEventListener('click', () => push('nivel', { levelId: level.id }));
    app.appendChild(card);
  });

  renderDashboard(app, fc, gs);
}

function renderNivel(app, data) {
  const level = CURRICULUM.find(l => l.id === data.levelId);

  const hint = document.createElement('div');
  hint.className = 'modMeta';
  hint.style.marginBottom = '10px';
  hint.textContent = 'Tocá el círculo para marcar o desmarcar un módulo como completado.';
  app.appendChild(hint);

  level.modules.forEach(m => {
    const done = !!progress.completed[m.id];
    const row = document.createElement('div');
    row.className = 'moduleRow' + (done ? ' done' : '');
    row.innerHTML = `
      <div class="modCheck"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M4 12 L9 17 L20 6"/></svg></div>
      <div class="modBody">
        <div class="modTitle">${m.title}</div>
        <div class="modMeta">${m.minutes} min · ${done ? 'completado' : 'sin empezar'}</div>
      </div>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>
    `;
    row.querySelector('.modCheck').addEventListener('click', (e) => {
      e.stopPropagation();
      if (progress.completed[m.id]) {
        delete progress.completed[m.id];
      } else {
        progress.completed[m.id] = { at: Date.now(), score: null, manual: true };
      }
      saveProgress(progress);
      render();
    });
    row.addEventListener('click', () => push('leccion', { moduleId: m.id }));
    app.appendChild(row);
  });
}

function renderLeccion(app, data) {
  const found = findModule(data.moduleId);
  if (!found) { app.innerHTML = '<div class="emptyHint">Módulo no encontrado.</div>'; return; }
  const { level, module: m } = found;

  const head = document.createElement('div');
  head.className = 'lessonHead';
  head.innerHTML = `
    <div class="lessonKicker">${level.name} · ${level.subtitle}</div>
    <div class="lessonTitle">${m.title}</div>
    <div class="lessonMeta">${m.minutes} min de lectura</div>
  `;
  app.appendChild(head);

  if (m.imgs && m.imgs.length) {
    const photos = document.createElement('div');
    photos.className = 'modPhotos';
    photos.innerHTML = m.imgs.map(im => `
      <figure>
        <img src="${im.url}" alt="${im.alt || ''}" loading="lazy" />
        <figcaption>${im.credit || ''}</figcaption>
      </figure>
    `).join('');
    app.appendChild(photos);
  }

  const listenRow = document.createElement('div');
  listenRow.className = 'listenRow';

  const listenBtn = document.createElement('div');
  listenBtn.className = 'listenBtn';
  listenBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z"/><path d="M17 9 a4 4 0 0 1 0 6"/></svg><span>Escuchar el módulo</span>`;
  listenBtn.addEventListener('click', () => toggleSpeak(moduleSpeechText(m), listenBtn, m.id));
  listenRow.appendChild(listenBtn);

  const voiceOpts = voiceOptions();
  if (voiceOpts.length > 1) {
    const select = document.createElement('select');
    select.className = 'voiceSelect';
    select.title = 'Voz de respaldo de tu dispositivo';
    const preferred = getPreferredVoice();
    voiceOpts.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name.replace(/^Microsoft |^Google /, '');
      if (preferred && v.name === preferred.name) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => setVoicePref(select.value));
    listenRow.appendChild(select);
  }
  app.appendChild(listenRow);

  const speedRow = document.createElement('div');
  speedRow.className = 'speed-row';
  speedRow.innerHTML = `
    <span class="speed-lbl">Velocidad</span>
    <div class="speed-pills">
      <button class="speed-pill" data-rate="0.75" onclick="setAudioRate(0.75)">0.75x</button>
      <button class="speed-pill" data-rate="1" onclick="setAudioRate(1)">1x</button>
      <button class="speed-pill" data-rate="1.25" onclick="setAudioRate(1.25)">1.25x</button>
      <button class="speed-pill" data-rate="1.5" onclick="setAudioRate(1.5)">1.5x</button>
      <button class="speed-pill" data-rate="2" onclick="setAudioRate(2)">2x</button>
    </div>
  `;
  app.appendChild(speedRow);

  const voiceHint = document.createElement('div');
  voiceHint.className = 'modMeta';
  voiceHint.style.marginTop = '-14px';
  voiceHint.style.marginBottom = '18px';
  voiceHint.textContent = PREGEN_AUDIO_MODULES.has(m.id)
    ? 'Este módulo tiene audio grabado con una voz humana real (no una síntesis).'
    : 'Por defecto "Escuchar el módulo" usa una voz en español más natural. Si falla, cae automáticamente a la voz de tu dispositivo elegida arriba — que no incluye "Siri Voice": eso es una limitación de iOS, Safari solo expone al selector las voces descargadas en Ajustes → Accesibilidad → Contenido hablado → Voces, nunca la voz de Siri en sí.';
  app.appendChild(voiceHint);
  initSpeedUI();

  const body = document.createElement('div');
  body.className = 'lessonBody';
  body.innerHTML = m.content;
  app.appendChild(body);

  const summaryBox = document.createElement('div');
  summaryBox.className = 'summaryBox';
  summaryBox.innerHTML = `<div class="summaryLabel">Resumen</div><div class="summaryText">${m.summary}</div>`;
  app.appendChild(summaryBox);

  const quizBtn = document.createElement('div');
  quizBtn.className = 'primaryBtn';
  quizBtn.textContent = progress.completed[m.id] ? 'Repetir el quiz' : 'Empezar el quiz';
  quizBtn.addEventListener('click', () => push('quiz', { moduleId: m.id }));
  app.appendChild(quizBtn);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuiz(app, data) {
  const found = findModule(data.moduleId);
  if (!found) { app.innerHTML = '<div class="emptyHint">Módulo no encontrado.</div>'; return; }
  runQuizSession(app, found.module.quiz, {
    onFinish: (score) => {
      progress.completed[found.module.id] = { at: Date.now(), score };
      saveProgress(progress);
    },
    finishLabel: 'Volver al módulo',
    onFinishNav: () => { viewStack.pop(); render(); },
  });
}

function startRepaso() {
  const pool = [];
  allUnlockedModules().forEach(m => {
    if (progress.completed[m.id]) pool.push(...m.quiz.map(q => ({ ...q, _mod: m.title })));
  });
  const picked = shuffle(pool).slice(0, 10);
  push('repaso', { questions: picked });
}

function renderRepaso(app, data) {
  if (!data.questions.length) {
    app.innerHTML = '<div class="emptyHint">Todavía no hay suficientes módulos completados para armar un repaso.</div>';
    return;
  }
  runQuizSession(app, data.questions, {
    isRepaso: true,
    finishLabel: 'Volver',
    onFinishNav: () => { viewStack.pop(); render(); },
  });
}

/* Calificación cualitativa a partir del porcentaje de aciertos. */
function gradeLabel(pct) {
  if (pct === 100) return '¡Perfecto!';
  if (pct >= 80) return 'Muy bien';
  if (pct >= 60) return 'Bien, pero conviene repasar';
  return 'Convendría repasar el módulo de nuevo';
}

/* Motor de quiz reusado tanto por el quiz de módulo como por el repaso.
   Cada pregunta da retroalimentación inmediata (correcto/incorrecto +
   explicación) y el avance a la siguiente pregunta es manual, para que
   haya tiempo de leerla en vez de saltar sola. */
function runQuizSession(app, questions, opts) {
  let idx = 0;
  let correctCount = 0;

  function renderQuestion() {
    app.innerHTML = '';
    const q = questions[idx];

    const prog = document.createElement('div');
    prog.className = 'quizProgress';
    prog.textContent = `Pregunta ${idx + 1} de ${questions.length}` + (opts.isRepaso && q._mod ? ' · ' + q._mod : '');
    app.appendChild(prog);

    const qEl = document.createElement('div');
    qEl.className = 'quizQ';
    qEl.textContent = q.q;
    app.appendChild(qEl);

    const optEls = [];
    q.options.forEach((opt, i) => {
      const optEl = document.createElement('div');
      optEl.className = 'quizOpt';
      optEl.textContent = opt;
      optEl.addEventListener('click', () => onAnswer(i));
      app.appendChild(optEl);
      optEls.push(optEl);
    });

    function onAnswer(i) {
      optEls.forEach(el => el.replaceWith(el.cloneNode(true))); // saca listeners, evita doble click
      const freshEls = app.querySelectorAll('.quizOpt');
      const isCorrect = i === q.correct;
      if (isCorrect) correctCount++;
      freshEls[i].classList.add(isCorrect ? 'correct' : 'wrong');
      if (!isCorrect) freshEls[q.correct].classList.add('correct');

      const feedback = document.createElement('div');
      feedback.className = 'feedbackBox ' + (isCorrect ? 'good' : 'bad');
      feedback.innerHTML = `<div class="feedbackHead">${isCorrect ? '¡Correcto!' : 'No es correcto'}</div>` +
        (isCorrect ? '' : `<div>La respuesta correcta es: ${q.options[q.correct]}.</div>`) +
        (q.explain ? `<div style="margin-top:4px">${q.explain}</div>` : '');
      app.appendChild(feedback);

      const nextBtn = document.createElement('div');
      nextBtn.className = 'primaryBtn';
      nextBtn.textContent = idx + 1 < questions.length ? 'Siguiente pregunta' : 'Ver resultado';
      nextBtn.addEventListener('click', () => {
        idx++;
        if (idx < questions.length) renderQuestion();
        else renderResult();
      });
      app.appendChild(nextBtn);
    }
  }

  function renderResult() {
    app.innerHTML = '';
    const pct = Math.round((correctCount / questions.length) * 100);

    const score = document.createElement('div');
    score.className = 'resultScore';
    score.textContent = `${correctCount}/${questions.length}`;
    app.appendChild(score);

    const grade = document.createElement('div');
    grade.className = 'resultGrade';
    grade.textContent = gradeLabel(pct);
    app.appendChild(grade);

    const label = document.createElement('div');
    label.className = 'resultLabel';
    label.textContent = `${pct}% de aciertos`;
    app.appendChild(label);

    if (opts.onFinish) opts.onFinish({ correct: correctCount, total: questions.length, pct });

    const btn = document.createElement('div');
    btn.className = 'primaryBtn';
    btn.textContent = opts.finishLabel || 'Continuar';
    btn.addEventListener('click', () => opts.onFinishNav ? opts.onFinishNav() : back());
    app.appendChild(btn);
  }

  renderQuestion();
}

render();
syncProgressOnLoad();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
