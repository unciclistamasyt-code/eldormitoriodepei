<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>&nbsp;</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content=" " />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
<style>
  .editBtn {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 18px);
    right: 20px;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 6px 4px;
  }

  .zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }

  .ringHolder {
    position: relative;
    width: min(66vw, 260px);
    height: min(66vw, 260px);
  }
  .ringHolder svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ringHolder circle {
    fill: none;
    stroke-width: 1.4;
  }
  .track { stroke: var(--line); }
  .progress {
    stroke: var(--text);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .time {
    font-size: 44px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .phase {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .ctrlBtn {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease;
  }
  .ctrlBtn:active { transform: scale(0.92); }
  .ctrlBtn svg { width: 18px; height: 18px; }
  .playBtn {
    width: 66px; height: 66px;
    background: var(--text);
    border: none;
  }
  .playBtn svg { stroke: var(--bg); fill: var(--bg); width: 20px; height: 20px; }

  .sessions {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .editPanel {
    position: fixed;
    inset: 0;
    background: rgba(10,10,12,0.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    z-index: 10;
  }
  .editPanel.open { display: flex; }
  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 220px;
    gap: 14px;
  }
  .field label {
    font-size: 13px;
    color: var(--text-dim);
  }
  .field input {
    width: 70px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    padding: 8px 10px;
    text-align: center;
    outline: none;
  }
  .editPanel .actions {
    display: flex;
    gap: 14px;
    width: 220px;
  }
  .editPanel button.act {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
  }
  .btn-save { background: var(--text); color: var(--bg); }
  .btn-cancel { border: 1px solid var(--line); color: var(--text); }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5 L8 12 L15 19"/></svg>
      </a>
      <div class="spacer"></div>
    </div>

    <button class="editBtn" id="editOpen">ajustar</button>

    <div class="zone fade-in">
      <div class="ringHolder">
        <svg viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="46"></circle>
          <circle class="progress" id="progressCircle" cx="50" cy="50" r="46"></circle>
        </svg>
        <div class="center">
          <div class="time" id="timeLabel">25:00</div>
          <div class="phase" id="phaseLabel">trabajo</div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrlBtn" id="resetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4v5h5"/><path d="M4.6 15a8 8 0 1 0 1.7-8.7L4 9"/></svg>
        </button>
        <button class="ctrlBtn playBtn" id="playBtn">
          <svg viewBox="0 0 24 24"><path id="playIcon" d="M6 4 L20 12 L6 20 Z"/></svg>
        </button>
        <button class="ctrlBtn" id="skipBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5 L14 12 L5 19 Z" fill="currentColor" stroke="none"/><line x1="17" y1="5" x2="17" y2="19"/></svg>
        </button>
      </div>

      <div class="sessions" id="sessionsLabel">0 completados</div>
    </div>
  </div>

  <div class="editPanel" id="editPanel">
    <div class="field">
      <label>trabajo (min)</label>
      <input type="number" id="workInput" min="1" max="120" />
    </div>
    <div class="field">
      <label>descanso (min)</label>
      <input type="number" id="breakInput" min="1" max="60" />
    </div>
    <div class="actions">
      <button class="act btn-cancel" id="editCancel">cancelar</button>
      <button class="act btn-save" id="editSave">guardar</button>
    </div>
  </div>

<script>
const CIRC = 2 * Math.PI * 46;
document.getElementById('progressCircle').style.strokeDasharray = CIRC;

function getSettings() {
  try {
    const raw = localStorage.getItem('pomodoro_settings');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { work: 25, break: 5 };
}
function saveSettings(s) {
  localStorage.setItem('pomodoro_settings', JSON.stringify(s));
}

let settings = getSettings();
let phase = 'work'; // 'work' | 'break'
let running = false;
let remaining = settings.work * 60;
let total = settings.work * 60;
let endAt = null;
let tickHandle = null;
let sessionsDone = parseInt(localStorage.getItem('pomodoro_sessions') || '0', 10);

function fmt(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateDisplay() {
  document.getElementById('timeLabel').textContent = fmt(Math.max(0, remaining));
  document.getElementById('phaseLabel').textContent = phase === 'work' ? 'trabajo' : 'descanso';
  document.getElementById('sessionsLabel').textContent = sessionsDone + (sessionsDone === 1 ? ' completado' : ' completados');
  const frac = total > 0 ? remaining / total : 0;
  const offset = CIRC * (1 - frac);
  document.getElementById('progressCircle').style.strokeDashoffset = offset;
}

function setPlayIcon(isPlaying) {
  const el = document.getElementById('playIcon');
  if (isPlaying) {
    el.setAttribute('d', 'M7 4 h4 v16 h-4 Z M13 4 h4 v16 h-4 Z');
  } else {
    el.setAttribute('d', 'M6 4 L20 12 L6 20 Z');
  }
}

function tick() {
  if (!running) return;
  const now = Date.now();
  remaining = Math.max(0, Math.round((endAt - now) / 1000));
  updateDisplay();
  if (remaining <= 0) {
    onPhaseComplete();
  }
}

function start() {
  if (running) return;
  running = true;
  endAt = Date.now() + remaining * 1000;
  setPlayIcon(true);
  tickHandle = setInterval(tick, 250);
}

function pause() {
  running = false;
  setPlayIcon(false);
  if (tickHandle) clearInterval(tickHandle);
}

function reset() {
  pause();
  phase = 'work';
  total = settings.work * 60;
  remaining = total;
  updateDisplay();
}

function onPhaseComplete() {
  pause();
  if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
  beep();
  if (phase === 'work') {
    sessionsDone += 1;
    localStorage.setItem('pomodoro_sessions', String(sessionsDone));
    phase = 'break';
    total = settings.break * 60;
  } else {
    phase = 'work';
    total = settings.work * 60;
  }
  remaining = total;
  updateDisplay();
}

function skip() {
  onPhaseComplete();
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 720;
    g.gain.value = 0.15;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, 320);
  } catch(e) {}
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (running) pause(); else start();
});
document.getElementById('resetBtn').addEventListener('click', reset);
document.getElementById('skipBtn').addEventListener('click', skip);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) tick();
});

const editPanel = document.getElementById('editPanel');
document.getElementById('editOpen').addEventListener('click', () => {
  document.getElementById('workInput').value = settings.work;
  document.getElementById('breakInput').value = settings.break;
  editPanel.classList.add('open');
});
document.getElementById('editCancel').addEventListener('click', () => {
  editPanel.classList.remove('open');
});
document.getElementById('editSave').addEventListener('click', () => {
  const w = parseInt(document.getElementById('workInput').value, 10);
  const b = parseInt(document.getElementById('breakInput').value, 10);
  if (w > 0 && b > 0) {
    settings = { work: w, break: b };
    saveSettings(settings);
    reset();
  }
  editPanel.classList.remove('open');
});

remaining = settings.work * 60;
total = remaining;
updateDisplay();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
