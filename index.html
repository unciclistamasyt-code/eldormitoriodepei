<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>&nbsp;</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content=" " />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
<style>
  .screen { padding-left: 0; padding-right: 0; }
  .topbar { padding: 0 20px; }
  .wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 2vh;
    touch-action: pan-y;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: min(58vh, 460px);
    cursor: grab;
  }
  .stage.grabbing { cursor: grabbing; }
  .hub {
    position: absolute;
    left: 50%;
    top: 24%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    width: 220px;
  }
  .hub .name {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--text);
    transition: opacity 0.12s ease;
  }
  .hub .hint {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .ring {
    position: absolute;
    left: 50%;
    top: 54%;
    width: 0;
    height: 0;
  }
  .card {
    position: absolute;
    left: 0;
    top: 0;
    width: 82px;
    height: 109px;
    margin: -54.5px 0 0 -41px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    will-change: transform, opacity;
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .card.icon-card {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-soft);
  }
  .card.icon-card svg {
    width: 34px;
    height: 34px;
    stroke: var(--text);
    fill: none;
    stroke-width: 1.4;
  }
  .card .cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 5px 6px 6px;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .card.icon-card .cap { color: var(--text-dim); background: none; text-shadow: none; }
  .card.active {
    border-color: rgba(232,230,223,0.5);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar"></div>
    <div class="wrap fade-in">
      <div class="stage" id="stage">
        <div class="hub">
          <div class="name" id="hubName">&nbsp;</div>
          <div class="hint">Arrastra para girar · toca para entrar</div>
        </div>
        <div class="ring" id="ring"></div>
      </div>
    </div>
  </div>

<script>
var APPS = [
  { href: 'ruleta.html',    label: 'Ruleta',    img: 'icons/cards/ruleta.jpg' },
  { href: 'checklist.html', label: 'Checklist',  icon: '<path d="M4 12 L9 17 L20 6"/>' },
  { href: 'pomodoro.html',  label: 'Pomodoro',   img: 'icons/cards/pomodoro.jpg' },
  { href: 'ropa.html',      label: 'Ropa',       img: 'icons/cards/ropa.jpg' },
  { href: 'golf.html',      label: 'Golf',       img: 'icons/cards/golf.jpg' },
  { href: 'menu.html',      label: 'Menú',       img: 'icons/cards/menu.jpg' },
  { href: 'salud.html',     label: 'Salud',      img: 'icons/cards/salud.jpg' },
  { href: 'recetas.html',   label: 'Recetas',    img: 'icons/cards/recetas.jpg' },
  { href: 'comidas.html',   label: 'Comidas',    icon: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' },
  { href: 'ski.html',       label: 'Ski School', img: 'icons/cards/ski.jpg' },
  { href: 'snowboard.html', label: 'Snowboard School', img: 'icons/cards/snowboard.jpg' },
  { href: 'cafe.html',      label: 'Coffee School', icon: '<path d="M4 9 h14 v5 a7 7 0 0 1 -7 7 h0 a7 7 0 0 1 -7 -7 Z"/><path d="M18 10 h2 a2.5 2.5 0 0 1 0 5 h-2"/><path d="M8 3 c0 1.2 -1.4 1.2 -1.4 2.4 S8 6.8 8 5.6"/><path d="M12 3 c0 1.2 -1.4 1.2 -1.4 2.4 S12 6.8 12 5.6"/>' },
  { href: 'nuevayork.html', label: 'NYC Dic.',   img: 'icons/cards/nuevayork.jpg' },
  { href: 'clima.html',     label: 'Clima',      icon: '<circle cx="12" cy="13" r="4.3"/><path d="M12 4v2.3M12 19.7V22M4.3 13h2.3M17.4 13h2.3M6.3 7.3l1.6 1.6M16.1 17.1l1.6 1.6M6.3 18.7l1.6-1.6M16.1 8.9l1.6-1.6"/>' }
];

var ring = document.getElementById('ring');
var hubName = document.getElementById('hubName');
var stage = document.getElementById('stage');
var STEP = 360 / APPS.length;
var RX = 150, RY = 78;

var cards = APPS.map(function (app, i) {
  var el = document.createElement('a');
  el.className = 'card' + (app.img ? '' : ' icon-card');
  el.href = app.href;
  el.dataset.index = i;
  el.draggable = false;
  el.addEventListener('dragstart', function (e) { e.preventDefault(); });
  if (app.img) {
    var img = document.createElement('img');
    img.src = app.img;
    img.alt = app.label;
    img.draggable = false;
    el.appendChild(img);
  } else {
    el.innerHTML = '<svg viewBox="0 0 24 24">' + app.icon + '</svg>';
  }
  var cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = app.label;
  el.appendChild(cap);
  el.addEventListener('click', function (e) {
    if (dragged) { e.preventDefault(); }
  });
  ring.appendChild(el);
  return el;
});

var rotation = 0;      // current wheel rotation, degrees
var velocity = 0;
var dragging = false;
var dragged = false;
var startX = 0, lastX = 0, lastT = 0;
var rafId = null;

function layout() {
  var frontIdx = -1, frontVal = -2;
  for (var i = 0; i < APPS.length; i++) {
    var angle = (i * STEP + rotation) * Math.PI / 180;
    var x = RX * Math.sin(angle);
    var y = RY * Math.cos(angle);
    var front = Math.cos(angle); // 1 = closest/front, -1 = farthest/back
    var scale = 0.62 + 0.38 * (front + 1) / 2;
    var opacity = 0.45 + 0.55 * (front + 1) / 2;
    var z = Math.round(front * 100) + 100;
    var el = cards[i];
    el.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) scale(' + scale.toFixed(3) + ')';
    el.style.opacity = opacity.toFixed(2);
    el.style.zIndex = z;
    el.classList.toggle('active', front > 0.85);
    if (front > frontVal) { frontVal = front; frontIdx = i; }
  }
  hubName.textContent = APPS[frontIdx].label;
}

function pointerDown(e) {
  if (!e.touches) {
    // Mouse only: stop native link-drag/text-selection from hijacking the
    // gesture — this is what made dragging feel broken on desktop while
    // touch (which never triggers native drag) worked fine.
    e.preventDefault();
    stage.classList.add('grabbing');
  }
  dragging = true;
  dragged = false;
  startX = lastX = (e.touches ? e.touches[0].clientX : e.clientX);
  lastT = Date.now();
  velocity = 0;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

function pointerMove(e) {
  if (!dragging) return;
  var x = (e.touches ? e.touches[0].clientX : e.clientX);
  var dx = x - lastX;
  if (Math.abs(x - startX) > 6) dragged = true;
  var now = Date.now();
  var dt = Math.max(now - lastT, 1);
  velocity = (dx / dt) * 16; // deg-ish per frame at 60fps
  rotation += dx * 0.45;
  lastX = x;
  lastT = now;
  layout();
  if (dragged) e.preventDefault();
}

function pointerUp() {
  if (!dragging) return;
  dragging = false;
  stage.classList.remove('grabbing');
  inertia();
}

function inertia() {
  velocity *= 0.94;
  rotation += velocity * 0.45;
  layout();
  if (Math.abs(velocity) > 0.05) {
    rafId = requestAnimationFrame(inertia);
  } else {
    snap();
  }
}

function snap() {
  var target = Math.round(rotation / STEP) * STEP;
  var diff = target - rotation;
  if (Math.abs(diff) < 0.05) { rotation = target; layout(); return; }
  rotation += diff * 0.18;
  layout();
  rafId = requestAnimationFrame(snap);
}

stage.addEventListener('mousedown', pointerDown);
window.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
stage.addEventListener('touchstart', pointerDown, { passive: true });
stage.addEventListener('touchmove', pointerMove, { passive: false });
stage.addEventListener('touchend', pointerUp);

layout();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
