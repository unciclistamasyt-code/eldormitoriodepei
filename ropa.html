<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>&nbsp;</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content=" " />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
<style>
  .tabs {
    display: flex;
    gap: 22px;
    justify-content: center;
    margin-top: 4px;
    margin-bottom: 20px;
  }
  .tab {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
  }
  .tab.active {
    color: var(--text);
    border-bottom: 1px solid var(--text);
  }

  .view { display: none; flex: 1; flex-direction: column; }
  .view.active { display: flex; }

  /* ---- Combinar ---- */
  .occasionRow {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .occasionRow input {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
  }
  .occasionRow input::placeholder { color: var(--text-dim); }
  .goBtn {
    width: 46px;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .goBtn svg { width: 18px; height: 18px; }

  .emptyState {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 0 20px;
  }
  .emptyState button {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    color: var(--text);
    font-size: 13px;
  }

  .guessTag {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    min-height: 14px;
  }

  .flatlay {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    flex: 1;
    align-content: start;
  }
  .flatlay .piece {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1;
    position: relative;
  }
  .flatlay .piece img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .flatlay .piece .lbl {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: rgba(10,10,12,0.7);
    padding: 2px 6px;
    border-radius: 6px;
  }

  .shuffleRow {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .shuffleBtn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .shuffleBtn svg { width: 22px; height: 22px; }
  .shuffleBtn:active { transform: scale(0.94); }

  /* ---- Clóset ---- */
  .catFilter {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
  }
  .catFilter .chip {
    flex-shrink: 0;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
  }
  .catFilter .chip.active {
    color: var(--bg);
    background: var(--text);
    border-color: var(--text);
  }

  .closetGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    flex: 1;
    align-content: start;
    overflow-y: auto;
  }
  .closetGrid .item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
  }
  .closetGrid .item img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .closetGrid .item .del {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(10,10,12,0.75);
    color: var(--text);
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---- Agregar ---- */
  .fieldGroup { margin-bottom: 24px; }
  .fieldLabel {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .chipRow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chipRow .chip {
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
  }
  .chipRow .chip.selected {
    color: var(--bg);
    background: var(--text);
    border-color: var(--text);
  }

  .photoPicker {
    width: 100%;
    aspect-ratio: 1.4;
    border: 1px dashed var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    overflow: hidden;
    position: relative;
    margin-bottom: 24px;
  }
  .photoPicker img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }
  .photoPicker input {
    position: absolute; inset: 0;
    opacity: 0;
  }

  .saveBtn {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    padding: 15px;
    border-radius: 10px;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .saveBtn:disabled { opacity: 0.35; }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5 L8 12 L15 19"/></svg>
      </a>
      <div class="spacer"></div>
    </div>

    <div class="tabs fade-in">
      <div class="tab active" data-view="combinar">combinar</div>
      <div class="tab" data-view="closet">clóset</div>
      <div class="tab" data-view="agregar">agregar</div>
    </div>

    <!-- COMBINAR -->
    <div class="view active fade-in" id="view-combinar">
      <div class="occasionRow">
        <input id="occasionInput" type="text" placeholder="¿qué vas a hacer hoy?" maxlength="80" />
        <button class="goBtn" id="occasionGo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="guessTag" id="guessTag"></div>
      <div id="combinarBody">
        <div class="emptyState">
          <div>agrega algunas prendas primero</div>
          <button id="goToAgregar">agregar ropa</button>
        </div>
      </div>
      <div class="shuffleRow" id="shuffleRow" style="display:none;">
        <button class="shuffleBtn" id="shuffleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 3l4 4-4 4"/><path d="M3 7h6a4 4 0 0 1 4 4"/><path d="M17 21l4-4-4-4"/><path d="M3 17h6a4 4 0 0 0 4-4"/></svg>
        </button>
      </div>
    </div>

    <!-- CLOSET -->
    <div class="view" id="view-closet">
      <div class="catFilter" id="catFilter"></div>
      <div class="closetGrid" id="closetGrid"></div>
    </div>

    <!-- AGREGAR -->
    <div class="view" id="view-agregar">
      <div class="photoPicker" id="photoPicker">
        <span id="photoPickerLabel">toca para elegir foto</span>
        <img id="photoPreview" style="display:none;" />
        <input type="file" accept="image/*" id="photoInput" />
      </div>

      <div class="fieldGroup">
        <div class="fieldLabel">categoría</div>
        <div class="chipRow" id="categoryChips"></div>
      </div>

      <div class="fieldGroup">
        <div class="fieldLabel">para qué ocasión (puedes elegir varias)</div>
        <div class="chipRow" id="tagChips"></div>
      </div>

      <button class="saveBtn" id="saveItemBtn" disabled>guardar prenda</button>
    </div>
  </div>

<script>
/* ---------------- IndexedDB helper ---------------- */
const DB_NAME = 'closet_db';
const STORE = 'items';
let dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(STORE)) {
      db.createObjectStore(STORE, { keyPath: 'id' });
    }
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

async function dbAdd(item) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll() {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------------- Categories & tags ---------------- */
const CATEGORIES = [
  { key: 'top', label: 'top' },
  { key: 'bottom', label: 'bottom' },
  { key: 'dress', label: 'vestido' },
  { key: 'shoes', label: 'calzado' },
  { key: 'outerwear', label: 'abrigo' },
  { key: 'accessory', label: 'accesorio' }
];
const TAGS = [
  { key: 'formal', label: 'formal' },
  { key: 'trabajo', label: 'trabajo' },
  { key: 'casual', label: 'casual' },
  { key: 'deportivo', label: 'deportivo' },
  { key: 'elegante', label: 'elegante' }
];
const KEYWORD_MAP = {
  formal: ['formal', 'reunion', 'reunión', 'entrevista', 'presentacion', 'presentación', 'junta', 'importante'],
  trabajo: ['trabajo', 'oficina', 'laboral'],
  elegante: ['elegante', 'fiesta', 'boda', 'gala', 'cena', 'cita', 'evento'],
  deportivo: ['deporte', 'deportivo', 'gym', 'gimnasio', 'correr', 'ejercicio', 'entrenar', 'trotar'],
  casual: ['casual', 'salir', 'amigos', 'parque', 'caminar', 'compras', 'relajado']
};

function guessTags(text) {
  const t = text.toLowerCase();
  const found = [];
  for (const key in KEYWORD_MAP) {
    if (KEYWORD_MAP[key].some(kw => t.includes(kw))) found.push(key);
  }
  return found.length ? found : ['casual'];
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchView(t.dataset.view));
});
document.getElementById('goToAgregar').addEventListener('click', () => switchView('agregar'));

function switchView(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'closet') renderCloset();
}

/* ---------------- Agregar prenda ---------------- */
let selectedCategory = null;
let selectedTags = new Set();
let pendingPhotoDataUrl = null;

CATEGORIES.forEach(c => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = c.label;
  chip.addEventListener('click', () => {
    selectedCategory = c.key;
    document.querySelectorAll('#categoryChips .chip').forEach(el => el.classList.remove('selected'));
    chip.classList.add('selected');
    validateForm();
  });
  document.getElementById('categoryChips').appendChild(chip);
});

TAGS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = t.label;
  chip.addEventListener('click', () => {
    if (selectedTags.has(t.key)) {
      selectedTags.delete(t.key);
      chip.classList.remove('selected');
    } else {
      selectedTags.add(t.key);
      chip.classList.add('selected');
    }
    validateForm();
  });
  document.getElementById('tagChips').appendChild(chip);
});

document.getElementById('photoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 800;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.82);
      document.getElementById('photoPreview').src = pendingPhotoDataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoPickerLabel').style.display = 'none';
      validateForm();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function validateForm() {
  const ok = pendingPhotoDataUrl && selectedCategory && selectedTags.size > 0;
  document.getElementById('saveItemBtn').disabled = !ok;
}

document.getElementById('saveItemBtn').addEventListener('click', async () => {
  const item = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    category: selectedCategory,
    tags: Array.from(selectedTags),
    photo: pendingPhotoDataUrl,
    createdAt: Date.now()
  };
  await dbAdd(item);

  pendingPhotoDataUrl = null;
  selectedCategory = null;
  selectedTags = new Set();
  document.querySelectorAll('.chip').forEach(el => el.classList.remove('selected'));
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoPickerLabel').style.display = 'block';
  document.getElementById('photoInput').value = '';
  validateForm();

  if (navigator.vibrate) navigator.vibrate(15);
  switchView('closet');
});

/* ---------------- Clóset ---------------- */
let closetFilter = 'all';

function buildCatFilter() {
  const wrap = document.getElementById('catFilter');
  wrap.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'chip active';
  all.textContent = 'todo';
  all.addEventListener('click', () => { closetFilter = 'all'; renderCloset(); });
  wrap.appendChild(all);
  CATEGORIES.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = c.label;
    chip.addEventListener('click', () => { closetFilter = c.key; renderCloset(); });
    wrap.appendChild(chip);
  });
}
buildCatFilter();

async function renderCloset() {
  document.querySelectorAll('#catFilter .chip').forEach((el, i) => {
    const key = i === 0 ? 'all' : CATEGORIES[i - 1].key;
    el.classList.toggle('active', key === closetFilter);
  });

  const items = await dbGetAll();
  const filtered = closetFilter === 'all' ? items : items.filter(i => i.category === closetFilter);
  const grid = document.getElementById('closetGrid');
  grid.innerHTML = '';

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.style.gridColumn = '1 / -1';
    empty.className = 'emptyState';
    empty.style.padding = '40px 0';
    empty.textContent = '—';
    grid.appendChild(empty);
    return;
  }

  filtered.sort((a, b) => b.createdAt - a.createdAt).forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<img src="${item.photo}" /><div class="del">×</div>`;
    el.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await dbDelete(item.id);
      renderCloset();
    });
    grid.appendChild(el);
  });
}

/* ---------------- Combinar ---------------- */
function pickForCategory(items, category, tags) {
  const inCat = items.filter(i => i.category === category);
  if (!inCat.length) return null;
  const matching = inCat.filter(i => i.tags.some(t => tags.includes(t)));
  const pool = matching.length ? matching : inCat;
  return pool[Math.floor(Math.random() * pool.length)];
}

let lastGuessedTags = null;

async function buildOutfit() {
  const items = await dbGetAll();
  const body = document.getElementById('combinarBody');
  const shuffleRow = document.getElementById('shuffleRow');

  if (!items.length) {
    body.innerHTML = '<div class="emptyState"><div>agrega algunas prendas primero</div><button id="goToAgregar2">agregar ropa</button></div>';
    document.getElementById('goToAgregar2').addEventListener('click', () => switchView('agregar'));
    shuffleRow.style.display = 'none';
    document.getElementById('guessTag').textContent = '';
    return;
  }

  const text = document.getElementById('occasionInput').value.trim();
  const tags = text ? guessTags(text) : lastGuessedTags || ['casual'];
  lastGuessedTags = tags;
  document.getElementById('guessTag').textContent = tags.join(' · ');

  const pieces = [];
  const dress = Math.random() < 0.35 ? pickForCategory(items, 'dress', tags) : null;
  if (dress) {
    pieces.push(['vestido', dress]);
  } else {
    const top = pickForCategory(items, 'top', tags);
    const bottom = pickForCategory(items, 'bottom', tags);
    if (top) pieces.push(['top', top]);
    if (bottom) pieces.push(['bottom', bottom]);
  }
  const shoes = pickForCategory(items, 'shoes', tags);
  if (shoes) pieces.push(['calzado', shoes]);

  if (Math.random() < 0.5) {
    const outer = pickForCategory(items, 'outerwear', tags);
    if (outer) pieces.push(['abrigo', outer]);
  }
  if (Math.random() < 0.4) {
    const acc = pickForCategory(items, 'accessory', tags);
    if (acc) pieces.push(['accesorio', acc]);
  }

  if (!pieces.length) {
    body.innerHTML = '<div class="emptyState"><div>no hay suficientes prendas para esa combinación todavía</div></div>';
    shuffleRow.style.display = 'none';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'flatlay';
  pieces.forEach(([label, item]) => {
    const el = document.createElement('div');
    el.className = 'piece';
    el.innerHTML = `<img src="${item.photo}" /><div class="lbl">${label}</div>`;
    grid.appendChild(el);
  });
  body.innerHTML = '';
  body.appendChild(grid);
  shuffleRow.style.display = 'flex';
}

document.getElementById('occasionGo').addEventListener('click', buildOutfit);
document.getElementById('occasionInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') buildOutfit();
});
document.getElementById('shuffleBtn').addEventListener('click', buildOutfit);

/* ---------------- Init ---------------- */
buildOutfit();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
