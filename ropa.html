<script>
/* ---------------- IndexedDB helper ---------------- */
const DB_NAME = 'closet_db';
const STORE = 'items';
let dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(STORE)) {
      db.createObjectStore(STORE, { keyPath: 'id' });
    }
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

async function dbAdd(item) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll() {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------------- Categories & tags ---------------- */
const CATEGORIES = [
  { key: 'top', label: 'top' },
  { key: 'bottom', label: 'bottom' },
  { key: 'dress', label: 'vestido' },
  { key: 'shoes', label: 'calzado' },
  { key: 'outerwear', label: 'abrigo' },
  { key: 'accessory', label: 'accesorio' }
];
const TAGS = [
  { key: 'formal', label: 'formal' },
  { key: 'trabajo', label: 'trabajo' },
  { key: 'casual', label: 'casual' },
  { key: 'deportivo', label: 'deportivo' },
  { key: 'elegante', label: 'elegante' }
];
const KEYWORD_MAP = {
  formal: ['formal', 'reunion', 'reunión', 'entrevista', 'presentacion', 'presentación', 'junta', 'importante'],
  trabajo: ['trabajo', 'oficina', 'laboral'],
  elegante: ['elegante', 'fiesta', 'boda', 'gala', 'cena', 'cita', 'evento'],
  deportivo: ['deporte', 'deportivo', 'gym', 'gimnasio', 'correr', 'ejercicio', 'entrenar', 'trotar'],
  casual: ['casual', 'salir', 'amigos', 'parque', 'caminar', 'compras', 'relajado']
};

function guessTags(text) {
  const t = text.toLowerCase();
  const found = [];
  for (const key in KEYWORD_MAP) {
    if (KEYWORD_MAP[key].some(kw => t.includes(kw))) found.push(key);
  }
  return found.length ? found : ['casual'];
}

/* ---------------- Clima (para ajustar el outfit al día) ----------------
   Open-Meteo: gratis, sin API key, funciona directo desde el navegador.
   Se usa la ubicación del dispositivo (con permiso) para pedir la
   temperatura de hoy y así preferir manga larga/pantalón y abrigo si hace
   frío, o manga corta/short y sin abrigo si hace calor. */
const WEATHER_CACHE_KEY = 'ropa_weather_cache_v1';
const WEATHER_CACHE_MS = 60 * 60 * 1000; // 1 hora

let weatherInfo = null;

const WEATHER_CODE_LABELS = {
  0: 'despejado', 1: 'mayormente despejado', 2: 'parcialmente nublado', 3: 'nublado',
  45: 'neblina', 48: 'neblina con escarcha',
  51: 'llovizna', 53: 'llovizna', 55: 'llovizna fuerte',
  61: 'lluvia', 63: 'lluvia', 65: 'lluvia fuerte',
  71: 'nieve', 73: 'nieve', 75: 'nieve fuerte',
  80: 'chubascos', 81: 'chubascos', 82: 'chubascos fuertes',
  95: 'tormenta', 96: 'tormenta con granizo', 99: 'tormenta con granizo'
};

function loadWeatherCache() {
  try {
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || Date.now() - parsed.ts > WEATHER_CACHE_MS) return null;
    return parsed.data;
  } catch (e) {
    return null;
  }
}
function saveWeatherCache(data) {
  try {
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
  } catch (e) { /* almacenamiento lleno o bloqueado — no es crítico */ }
}

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&forecast_days=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('clima: HTTP ' + res.status);
  const data = await res.json();
  const tempMax = data.daily.temperature_2m_max[0];
  const tempMin = data.daily.temperature_2m_min[0];
  const code = data.daily.weathercode[0];
  return {
    tempMax, tempMin, code,
    isCold: tempMax < 16,
    isHot: tempMax > 26,
    label: WEATHER_CODE_LABELS[code] || ''
  };
}

function renderWeatherBar(msg) {
  const el = document.getElementById('weatherBar');
  if (!el) return;
  if (weatherInfo) {
    const tag = weatherInfo.label ? ' · ' + weatherInfo.label : '';
    el.textContent = `hoy: ${Math.round(weatherInfo.tempMin)}°–${Math.round(weatherInfo.tempMax)}°C${tag}`;
    el.classList.remove('pending');
  } else {
    el.textContent = msg || 'toca para ajustar por el clima de hoy';
    el.classList.add('pending');
  }
}

function getCurrentPositionOnce() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
  });
}

async function initWeather(forceLocate) {
  if (!forceLocate) {
    const cached = loadWeatherCache();
    if (cached) { weatherInfo = cached; renderWeatherBar(); return; }
  }
  if (!navigator.geolocation) {
    renderWeatherBar('este navegador no puede darme tu ubicación');
    return;
  }
  renderWeatherBar('obteniendo tu ubicación…');
  let pos;
  try {
    /* El "timeout" nativo de getCurrentPosition no siempre dispara el
       callback de error (se ha visto quedarse colgado indefinidamente en
       algunos navegadores/dispositivos), así que además se pone un límite
       manual para no dejar el botón atascado en "obteniendo ubicación…". */
    pos = await withTimeout(getCurrentPositionOnce(), 12000);
  } catch (err) {
    renderWeatherBar('activa la ubicación para ajustar por el clima de hoy');
    return;
  }
  try {
    renderWeatherBar('consultando el clima…');
    const w = await withTimeout(fetchWeather(pos.coords.latitude, pos.coords.longitude), 10000);
    weatherInfo = w;
    saveWeatherCache(w);
    renderWeatherBar();
    buildOutfit();
  } catch (err) {
    renderWeatherBar('no se pudo obtener el clima (' + (err && err.message ? err.message : err) + ')');
  }
}

/* Lightweight background removal: flood-fill from the border, matching
   pixels close to the sampled border color, assuming a plain/even backdrop. */
function removeBackground(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;

  let rSum = 0, gSum = 0, bSum = 0, count = 0;
  for (let x = 0; x < w; x++) {
    for (const y of [0, h - 1]) {
      const i = (y * w + x) * 4;
      rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2]; count++;
    }
  }
  for (let y = 0; y < h; y++) {
    for (const x of [0, w - 1]) {
      const i = (y * w + x) * 4;
      rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2]; count++;
    }
  }
  const bgR = rSum / count, bgG = gSum / count, bgB = bSum / count;
  const threshold = 38;
  const visited = new Uint8Array(w * h);
  const isBg = new Uint8Array(w * h);
  const queue = new Int32Array(w * h);
  let qHead = 0, qTail = 0;

  function colorDist(i) {
    const dr = data[i] - bgR, dg = data[i + 1] - bgG, db = data[i + 2] - bgB;
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }
  function tryEnqueue(x, y) {
    const idx = y * w + x;
    if (visited[idx]) return;
    visited[idx] = 1;
    const i = idx * 4;
    if (colorDist(i) < threshold) {
      isBg[idx] = 1;
      queue[qTail++] = idx;
    }
  }
  for (let x = 0; x < w; x++) { tryEnqueue(x, 0); tryEnqueue(x, h - 1); }
  for (let y = 0; y < h; y++) { tryEnqueue(0, y); tryEnqueue(w - 1, y); }

  while (qHead < qTail) {
    const idx = queue[qHead++];
    const x = idx % w, y = (idx / w) | 0;
    const neighbors = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
    for (const [nx, ny] of neighbors) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const nidx = ny * w + nx;
      if (visited[nidx]) continue;
      visited[nidx] = 1;
      const i = nidx * 4;
      if (colorDist(i) < threshold) {
        isBg[nidx] = 1;
        queue[qTail++] = nidx;
      }
    }
  }

  /* Second pass: catch background-colored pockets that are fully enclosed
     by the garment (e.g. the gap between two pant legs) and so were never
     reached by the border flood-fill above. */
  for (let idx = 0; idx < w * h; idx++) {
    if (!visited[idx] && colorDist(idx * 4) < threshold) {
      isBg[idx] = 1;
    }
  }

  for (let idx = 0; idx < w * h; idx++) {
    if (isBg[idx]) {
      data[idx * 4 + 3] = 0;
    } else {
      const x = idx % w, y = (idx / w) | 0;
      let edgeCount = 0;
      if (x > 0 && isBg[idx - 1]) edgeCount++;
      if (x < w - 1 && isBg[idx + 1]) edgeCount++;
      if (y > 0 && isBg[idx - w]) edgeCount++;
      if (y < h - 1 && isBg[idx + w]) edgeCount++;
      if (edgeCount > 0) data[idx * 4 + 3] = Math.round(255 * (1 - edgeCount * 0.12));
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

/* Crop the canvas to the bounding box of its non-transparent pixels, so a
   loosely-framed photo still fills the mannequin nicely. */
function cropToContent(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const data = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 10) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return canvas;
  const pad = 6;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
  return out;
}

/* Finds the garment's true color among its opaque pixels, used to draw a
   solid-color illustrated version on the mannequin instead of stretching
   the real photo onto a fixed shape.

   Two passes, because a single pass with fine buckets (the original
   approach) often picked the WRONG color: real fabric photos have soft
   shading/fold gradients across the same color, which spreads that color
   over many small neighboring buckets — so a small uniform patch (a
   shadow, a tag, an overexposed highlight) could end up "winning" just
   because it was more uniform, even though it covers less of the garment.
     Pass 1 uses coarse buckets to find the general neighborhood of the
   most common color.
     Pass 2 re-averages every sampled pixel close to that neighborhood
   (not just the ones that fell in the same bucket), so the result isn't
   thrown off by where the bucket grid lines happen to fall and better
   reflects the fabric's actual color across its shading. */
function getDominantColor(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const data = ctx.getImageData(0, 0, w, h).data;
  const total = w * h;
  const step = Math.max(1, Math.floor(total / 30000));
  const ALPHA_MIN = 220; // descarta bordes semi-transparentes mezclados con el fondo

  const buckets = new Map();
  for (let i = 0; i < total; i += step) {
    const idx = i * 4;
    if (data[idx + 3] < ALPHA_MIN) continue;
    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
    const key = ((r / 24) | 0) + ',' + ((g / 24) | 0) + ',' + ((b / 24) | 0);
    let bucket = buckets.get(key);
    if (!bucket) { bucket = { r: 0, g: 0, b: 0, count: 0 }; buckets.set(key, bucket); }
    bucket.r += r; bucket.g += g; bucket.b += b; bucket.count++;
  }
  let best = null;
  for (const bucket of buckets.values()) {
    if (!best || bucket.count > best.count) best = bucket;
  }
  if (!best) return '#9a9a9a';
  const coarseR = best.r / best.count, coarseG = best.g / best.count, coarseB = best.b / best.count;

  let r2 = 0, g2 = 0, b2 = 0, n2 = 0;
  const THRESHOLD = 55;
  for (let i = 0; i < total; i += step) {
    const idx = i * 4;
    if (data[idx + 3] < ALPHA_MIN) continue;
    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
    const dr = r - coarseR, dg = g - coarseG, db = b - coarseB;
    if (Math.sqrt(dr * dr + dg * dg + db * db) <= THRESHOLD) {
      r2 += r; g2 += g; b2 += b; n2++;
    }
  }
  const r = Math.round(n2 ? r2 / n2 : coarseR);
  const g = Math.round(n2 ? g2 / n2 : coarseG);
  const b = Math.round(n2 ? b2 / n2 : coarseB);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* AI background removal (works on any background, not just plain ones).
   Loaded lazily from a CDN the first time it's needed and cached by the
   browser after that. If it fails to load or times out for any reason
   (offline, CDN hiccup, slow device), we fall back to the lightweight
   flood-fill removal above so adding clothes never gets stuck. */
const IMGLY_CDN_URL = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/index.mjs';
let _imglyModulePromise = null;
function loadImgly() {
  if (!_imglyModulePromise) _imglyModulePromise = import(IMGLY_CDN_URL);
  return _imglyModulePromise;
}
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}
async function removeBackgroundAI(sourceCanvas) {
  const blob = await new Promise(res => sourceCanvas.toBlob(res, 'image/png'));
  const mod = await withTimeout(loadImgly(), 25000);
  const removeBg = mod.default || mod.removeBackground;
  const resultBlob = await withTimeout(
    removeBg(blob, { model: 'isnet_quint8', output: { format: 'image/png' } }),
    45000
  );
  const bitmap = await createImageBitmap(resultBlob);
  const out = document.createElement('canvas');
  out.width = bitmap.width; out.height = bitmap.height;
  out.getContext('2d').drawImage(bitmap, 0, 0);
  return out;
}

/* ---------------- Combinar ---------------- */
function pickForCategory(items, category, tags, excludeId) {
  let inCat = items.filter(i => i.category === category);
  if (!inCat.length) return null;

  /* Cuando el usuario pide "cambia el top" (u otra prenda) en la
     conversación, se descarta la que ya tenía puesta para que el nuevo
     armado elija otra distinta — salvo que sea la única que tiene. */
  if (excludeId) {
    const withoutExcluded = inCat.filter(i => i.id !== excludeId);
    if (withoutExcluded.length) inCat = withoutExcluded;
  }

  /* Si sabemos el clima de hoy, entre las prendas que ya calzan la
     categoría se prefieren las de manga/largo adecuados (sin descartar
     el resto si no hay ninguna así). */
  if (weatherInfo && category === 'top') {
    const wantSleeve = weatherInfo.isCold ? 'larga' : (weatherInfo.isHot ? 'corta' : null);
    if (wantSleeve) {
      const bySleeve = inCat.filter(i => (i.sleeve || 'corta') === wantSleeve);
      if (bySleeve.length) inCat = bySleeve;
    }
  }
  if (weatherInfo && category === 'bottom') {
    const wantLength = weatherInfo.isHot ? 'corto' : (weatherInfo.isCold ? 'largo' : null);
    if (wantLength) {
      const byLength = inCat.filter(i => (i.length || 'largo') === wantLength);
      if (byLength.length) inCat = byLength;
    }
  }

  const matching = inCat.filter(i => i.tags.some(t => tags.includes(t)));
  const pool = matching.length ? matching : inCat;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* Anchor points (in the mannequin's 200x380 viewBox) that each garment
   callout line starts from, and which side of the mannequin its real-photo
   badge sits on — mirrors the reference image's "line pointing out to a
   small photo of the actual piece" layout. Spaced out so up to 5 badges
   (top/vestido, bottom, abrigo, calzado, accesorio) never overlap. */
const CALLOUT_ANCHORS = {
  top:       { x: 48,  y: 60,  side: 'left'  },
  vestido:   { x: 48,  y: 140, side: 'left'  },
  calzado:   { x: 48,  y: 300, side: 'left'  },
  abrigo:    { x: 152, y: 100, side: 'right' },
  bottom:    { x: 152, y: 190, side: 'right' },
  accesorio: { x: 152, y: 290, side: 'right' }
};

let lastOutfitPieces = null;

function renderCallouts(pieces) {
  lastOutfitPieces = pieces;
  const stage = document.getElementById('mannequinStage');
  const wrap = stage.querySelector('.mannequinWrap');
  const svgLines = document.getElementById('calloutLines');
  const badgesWrap = document.getElementById('calloutBadges');
  const ns = 'http://www.w3.org/2000/svg';

  svgLines.innerHTML = '';
  badgesWrap.innerHTML = '';

  const stageRect = stage.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  if (!stageRect.width || !wrapRect.width) return;

  svgLines.setAttribute('width', stageRect.width);
  svgLines.setAttribute('height', stageRect.height);

  const scaleX = wrapRect.width / 200;
  const scaleY = wrapRect.height / 380;
  const offsetX = wrapRect.left - stageRect.left;
  const offsetY = wrapRect.top - stageRect.top;

  pieces.forEach(([label, item]) => {
    const a = CALLOUT_ANCHORS[label];
    if (!a) return;
    const anchorX = offsetX + a.x * scaleX;
    const anchorY = offsetY + a.y * scaleY;
    const badgeEdgeX = a.side === 'left' ? 54 : stageRect.width - 54;

    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', anchorX);
    line.setAttribute('y1', anchorY);
    line.setAttribute('x2', badgeEdgeX);
    line.setAttribute('y2', anchorY);
    svgLines.appendChild(line);

    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', anchorX);
    dot.setAttribute('cy', anchorY);
    dot.setAttribute('r', 2.5);
    dot.setAttribute('class', 'dot');
    svgLines.appendChild(dot);

    const badge = document.createElement('div');
    badge.className = 'calloutBadge';
    badge.style.top = anchorY + 'px';
    badge.style[a.side] = '0px';
    badge.innerHTML = `<img src="${item.photo}" /><span>${label}</span>`;
    badge.addEventListener('click', () => openLightbox(item.photo));
    badgesWrap.appendChild(badge);
  });
}

/* Toca la foto circular junto al maniquí para verla en grande. */
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('photoLightbox').classList.add('show');
}
document.getElementById('photoLightbox').addEventListener('click', () => {
  document.getElementById('photoLightbox').classList.remove('show');
});

let calloutResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(calloutResizeTimer);
  calloutResizeTimer = setTimeout(() => {
    if (lastOutfitPieces) renderCallouts(lastOutfitPieces);
  }, 150);
});

function svgImage(href, x, y, w, h, clipId) {
  const ns = 'http://www.w3.org/2000/svg';
  const img = document.createElementNS(ns, 'image');
  img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', href);
  img.setAttribute('href', href);
  img.setAttribute('x', x);
  img.setAttribute('y', y);
  img.setAttribute('width', w);
  img.setAttribute('height', h);
  if (clipId) {
    /* "slice" (cover) fills the whole clothing silhouette with the photo,
       instead of floating the whole photo inside a box — this is what
       makes the garment look worn instead of pasted on top. */
    img.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    img.setAttribute('clip-path', 'url(#' + clipId + ')');
  } else {
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  }
  img.setAttribute('filter', 'url(#clothShadow)');
  return img;
}

/* ---------------- Conversación sobre el outfit ----------------
   No hay IA ni backend — es una interpretación simple por palabras clave
   de lo que responde el usuario, que ajusta el próximo armado (sin abrigo,
   cambia el top, más formal, etc.) y explica en texto por qué se eligió
   cada combinación. */
let chatState = { forcedAbrigo: null, forcedAccesorio: null, excludedIds: {}, extraTags: [] };
let pendingChangeNotes = [];
let pendingChangeCategories = [];

function resetChatState() {
  chatState = { forcedAbrigo: null, forcedAccesorio: null, excludedIds: {}, extraTags: [] };
  const wrap = document.getElementById('chatMessages');
  if (wrap) wrap.innerHTML = '';
}

function normalizeText(str) {
  return str.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function addChatMessage(role, text) {
  const wrap = document.getElementById('chatMessages');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'chatMsg ' + role;
  el.textContent = text;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  document.getElementById('chatPanel').style.display = 'block';
}

function joinList(arr) {
  if (arr.length === 0) return '';
  if (arr.length === 1) return arr[0];
  return arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1];
}

/* Arma la frase que explica por qué se eligió esa combinación: qué piezas
   entraron, y si el clima de hoy influyó en la manga/largo/abrigo. */
function describeOutfit(pieces, tags) {
  const byLabel = Object.fromEntries(pieces);
  const parts = [];
  if (byLabel['vestido']) {
    parts.push('un vestido');
  } else {
    if (byLabel['top']) parts.push('un top de manga ' + (byLabel['top'].sleeve === 'larga' ? 'larga' : 'corta'));
    if (byLabel['bottom']) parts.push(byLabel['bottom'].length === 'corto' ? 'un short' : 'un pantalón');
  }
  if (byLabel['abrigo']) parts.push('abrigo');
  if (byLabel['calzado']) parts.push('calzado');
  if (byLabel['accesorio']) parts.push('un accesorio');

  if (!parts.length) return 'No encontré suficientes prendas para armar algo con lo que pediste.';

  let sentence = `Para ${tags.join(' · ')} elegí ${joinList(parts)}.`;
  if (weatherInfo) {
    const range = `${Math.round(weatherInfo.tempMin)}°–${Math.round(weatherInfo.tempMax)}°C`;
    if (weatherInfo.isCold) {
      const bits = [];
      if (byLabel['top'] && byLabel['top'].sleeve === 'larga') bits.push('manga larga');
      if (byLabel['bottom'] && byLabel['bottom'].length !== 'corto') bits.push('pantalón');
      if (byLabel['abrigo']) bits.push('abrigo');
      sentence += bits.length
        ? ` Hoy hace frío (${range}), así que preferí ${joinList(bits)}.`
        : ` Hoy hace frío (${range}), aunque esta combinación no fue la más abrigadora.`;
    } else if (weatherInfo.isHot) {
      const bits = [];
      if (byLabel['top'] && byLabel['top'].sleeve !== 'larga') bits.push('manga corta');
      if (byLabel['bottom'] && byLabel['bottom'].length === 'corto') bits.push('short');
      sentence += bits.length
        ? ` Hoy hace calor (${range}), así que preferí ${joinList(bits)} y evité el abrigo.`
        : ` Hoy hace calor (${range}).`;
    }
  }
  return sentence;
}

const CHAT_NO_ABRIGO = ['sin abrigo', 'sin chaqueta', 'sin saco', 'quita el abrigo', 'quitar el abrigo', 'no quiero abrigo', 'no abrigo'];
const CHAT_SI_ABRIGO = ['con abrigo', 'mas abrigador', 'tengo frio', 'hace frio', 'agrega abrigo', 'agregale abrigo', 'pon abrigo', 'quiero abrigo', 'sumale abrigo'];
const CHAT_NO_ACC = ['sin bolso', 'sin accesorio', 'quita el bolso', 'quitar el bolso', 'no quiero bolso'];
const CHAT_SI_ACC = ['con bolso', 'agrega un bolso', 'agrega bolso', 'pon un bolso', 'quiero un bolso', 'agrega accesorio', 'quiero un accesorio'];
const CHAT_CHANGE = {
  top: ['cambia el top', 'otro top', 'cambia la playera', 'otra playera', 'cambia la camisa', 'otra camisa', 'cambia la blusa', 'otra blusa'],
  bottom: ['cambia el pantalon', 'otro pantalon', 'cambia el bottom', 'otro bottom', 'cambia el short', 'otro short'],
  calzado: ['cambia los zapatos', 'otros zapatos', 'cambia el calzado', 'otro calzado', 'cambia los tenis', 'otros tenis'],
  abrigo: ['cambia el abrigo', 'otro abrigo'],
  accesorio: ['cambia el bolso', 'otro bolso', 'cambia el accesorio', 'otro accesorio'],
  vestido: ['cambia el vestido', 'otro vestido']
};

function matchAny(text, list) {
  return list.some(k => text.includes(k));
}

/* Lee lo que escribió el usuario y ajusta chatState en consecuencia.
   Devuelve una lista de notas cortas (para explicar qué se cambió) — si
   no reconoce nada, la lista queda vacía y igual se vuelve a armar el
   outfit con la ocasión actual. */
function interpretChatReply(rawText) {
  const text = normalizeText(rawText);
  const notes = [];

  if (matchAny(text, CHAT_NO_ABRIGO)) { chatState.forcedAbrigo = false; notes.push('quité el abrigo'); }
  else if (matchAny(text, CHAT_SI_ABRIGO)) { chatState.forcedAbrigo = true; notes.push('agregué abrigo'); }

  if (matchAny(text, CHAT_NO_ACC)) { chatState.forcedAccesorio = false; notes.push('quité el accesorio'); }
  else if (matchAny(text, CHAT_SI_ACC)) { chatState.forcedAccesorio = true; notes.push('agregué un accesorio'); }

  if (lastOutfitPieces) {
    for (const cat in CHAT_CHANGE) {
      if (matchAny(text, CHAT_CHANGE[cat])) {
        const current = lastOutfitPieces.find(([label]) => label === cat);
        if (current) {
          chatState.excludedIds[cat] = current[1].id;
          pendingChangeCategories.push(cat);
        }
      }
    }
  }

  const extraTags = [];
  for (const key in KEYWORD_MAP) {
    if (KEYWORD_MAP[key].some(kw => text.includes(kw)) && !chatState.extraTags.includes(key)) {
      extraTags.push(key);
    }
  }
  if (extraTags.length) {
    chatState.extraTags = [...new Set([...chatState.extraTags, ...extraTags])];
    notes.push('tomé en cuenta que quieres algo más ' + extraTags.join('/'));
  }

  return notes;
}

document.getElementById('chatSend').addEventListener('click', sendChatReply);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatReply();
});

function sendChatReply() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addChatMessage('user', text);
  input.value = '';
  const notes = interpretChatReply(text);
  pendingChangeNotes = notes;
  buildOutfit();
}

async function buildOutfit() {
  const items = await dbGetAll();
  const empty = document.getElementById('combinarEmpty');
  const result = document.getElementById('combinarResult');
  const shuffleRow = document.getElementById('shuffleRow');
  const clothingLayer = document.getElementById('clothingLayer');

  if (!items.length) {
    empty.innerHTML = '<div>agrega algunas prendas primero</div><button id="goToAgregar2">agregar ropa</button>';
    document.getElementById('goToAgregar2').addEventListener('click', () => switchView('agregar'));
    empty.style.display = 'flex';
    result.style.display = 'none';
    shuffleRow.style.display = 'none';
    document.getElementById('guessTag').textContent = '';
    return;
  }

  const text = document.getElementById('occasionInput').value.trim();
  const baseTags = text ? guessTags(text) : lastGuessedTags || ['casual'];
  const tags = [...new Set([...baseTags, ...chatState.extraTags])];
  lastGuessedTags = baseTags;
  document.getElementById('guessTag').textContent = tags.join(' · ');

  const pieces = [];
  const dress = Math.random() < 0.35 ? pickForCategory(items, 'dress', tags, chatState.excludedIds.vestido) : null;
  if (dress) {
    pieces.push(['vestido', dress]);
  } else {
    const top = pickForCategory(items, 'top', tags, chatState.excludedIds.top);
    const bottom = pickForCategory(items, 'bottom', tags, chatState.excludedIds.bottom);
    if (top) pieces.push(['top', top]);
    if (bottom) pieces.push(['bottom', bottom]);
  }
  const shoes = pickForCategory(items, 'shoes', tags, chatState.excludedIds.calzado);
  if (shoes) pieces.push(['calzado', shoes]);

  /* Con frío casi siempre suma abrigo; con calor casi nunca — salvo que
     el usuario haya pedido explícitamente con/sin abrigo en el chat. */
  const abrigoChance = weatherInfo ? (weatherInfo.isCold ? 0.9 : (weatherInfo.isHot ? 0.05 : 0.5)) : 0.5;
  const wantAbrigo = chatState.forcedAbrigo !== null ? chatState.forcedAbrigo : Math.random() < abrigoChance;
  if (wantAbrigo) {
    const outer = pickForCategory(items, 'outerwear', tags, chatState.excludedIds.abrigo);
    if (outer) pieces.push(['abrigo', outer]);
  }
  const wantAccesorio = chatState.forcedAccesorio !== null ? chatState.forcedAccesorio : Math.random() < 0.4;
  if (wantAccesorio) {
    const acc = pickForCategory(items, 'accessory', tags, chatState.excludedIds.accesorio);
    if (acc) pieces.push(['accesorio', acc]);
  }
  chatState.excludedIds = {};

  /* Si el usuario pidió "cambia X", compara la prenda nueva con la que
     tenía antes (lastOutfitPieces todavía no se actualiza — eso pasa en
     renderCallouts, que corre después) para decir la verdad: si de
     verdad cambió, o si no había otra opción guardada. */
  if (pendingChangeCategories.length) {
    const prevByLabel = Object.fromEntries(lastOutfitPieces || []);
    const newByLabel = Object.fromEntries(pieces);
    pendingChangeCategories.forEach(cat => {
      const newItem = newByLabel[cat];
      const oldItem = prevByLabel[cat];
      if (newItem && oldItem && newItem.id !== oldItem.id) pendingChangeNotes.push('cambié el ' + cat);
      else if (newItem && !oldItem) pendingChangeNotes.push('agregué ' + cat);
      else pendingChangeNotes.push('no tengo otra opción de ' + cat + ' guardada');
    });
    pendingChangeCategories = [];
  }

  if (!pieces.length) {
    empty.style.display = 'flex';
    empty.innerHTML = '<div>no hay suficientes prendas para esa combinación todavía</div>';
    result.style.display = 'none';
    shuffleRow.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  result.style.display = 'flex';
  shuffleRow.style.display = 'flex';

  clothingLayer.innerHTML = '';
  const byLabel = Object.fromEntries(pieces);

  if (byLabel['vestido']) {
    const c = byLabel['vestido'].color;
    clothingLayer.appendChild(svgShape(SHAPE_D.vestido, c));
    clothingLayer.appendChild(svgShape(SLEEVE_D.cortaL, c));
    clothingLayer.appendChild(svgShape(SLEEVE_D.cortaR, c));
  } else {
    if (byLabel['bottom']) {
      const b = byLabel['bottom'];
      const corto = b.length === 'corto';
      clothingLayer.appendChild(svgShape(corto ? SHAPE_D.bottomCorto : SHAPE_D.bottom, b.color));
    }
    if (byLabel['top']) {
      const t = byLabel['top'];
      const larga = t.sleeve === 'larga';
      clothingLayer.appendChild(svgShape(SHAPE_D.top, t.color));
      clothingLayer.appendChild(svgShape(larga ? SLEEVE_D.largaL : SLEEVE_D.cortaL, t.color));
      clothingLayer.appendChild(svgShape(larga ? SLEEVE_D.largaR : SLEEVE_D.cortaR, t.color));
    }
  }
  if (byLabel['abrigo']) {
    const c = byLabel['abrigo'].color;
    clothingLayer.appendChild(svgShape(SHAPE_D.abrigo, c));
    clothingLayer.appendChild(svgShape(SLEEVE_D.abrigoL, c));
    clothingLayer.appendChild(svgShape(SLEEVE_D.abrigoR, c));
  }
  if (byLabel['calzado']) {
    const c = byLabel['calzado'].color;
    clothingLayer.appendChild(svgEllipse(78, 258, 13, 7, c));
    clothingLayer.appendChild(svgEllipse(122, 258, 13, 7, c));
  }
  if (byLabel['accesorio']) {
    clothingLayer.appendChild(svgStrap('M 122 158 Q 138 140 154 158'));
    clothingLayer.appendChild(svgRect(118, 157, 34, 26, 4, byLabel['accesorio'].color));
  }

  requestAnimationFrame(() => renderCallouts(pieces));

  const changePrefix = pendingChangeNotes.length ? 'Listo, ' + joinList(pendingChangeNotes) + '. ' : '';
  const explanation = changePrefix + describeOutfit(pieces, tags);
  pendingChangeNotes = [];
  addChatMessage('assistant', explanation);
}

function startNewOccasion() {
  resetChatState();
  buildOutfit();
}
document.getElementById('occasionGo').addEventListener('click', startNewOccasion);
document.getElementById('occasionInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startNewOccasion();
});
document.getElementById('shuffleBtn').addEventListener('click', buildOutfit);

/* ---------------- Init ---------------- */
buildOutfit();
initWeather();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
