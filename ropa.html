<script>
/* ---------------- IndexedDB helper ---------------- */
const DB_NAME = 'closet_db';
const STORE = 'items';
let dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(STORE)) {
      db.createObjectStore(STORE, { keyPath: 'id' });
    }
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

async function dbAdd(item) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll() {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------------- Categories & tags ---------------- */
const CATEGORIES = [
  { key: 'top', label: 'top' },
  { key: 'bottom', label: 'bottom' },
  { key: 'dress', label: 'vestido' },
  { key: 'shoes', label: 'calzado' },
  { key: 'outerwear', label: 'abrigo' },
  { key: 'accessory', label: 'accesorio' }
];
const TAGS = [
  { key: 'formal', label: 'formal' },
  { key: 'trabajo', label: 'trabajo' },
  { key: 'casual', label: 'casual' },
  { key: 'deportivo', label: 'deportivo' },
  { key: 'elegante', label: 'elegante' }
];
const KEYWORD_MAP = {
  formal: ['formal', 'reunion', 'reunión', 'entrevista', 'presentacion', 'presentación', 'junta', 'importante'],
  trabajo: ['trabajo', 'oficina', 'laboral'],
  elegante: ['elegante', 'fiesta', 'boda', 'gala', 'cena', 'cita', 'evento'],
  deportivo: ['deporte', 'deportivo', 'gym', 'gimnasio', 'correr', 'ejercicio', 'entrenar', 'trotar'],
  casual: ['casual', 'salir', 'amigos', 'parque', 'caminar', 'compras', 'relajado']
};

function guessTags(text) {
  const t = text.toLowerCase();
  const found = [];
  for (const key in KEYWORD_MAP) {
    if (KEYWORD_MAP[key].some(kw => t.includes(kw))) found.push(key);
  }
  return found.length ? found : ['casual'];
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchView(t.dataset.view));
});
document.getElementById('goToAgregar').addEventListener('click', () => switchView('agregar'));

function switchView(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'closet') renderCloset();
  if (name === 'combinar' && lastOutfitPieces) {
    requestAnimationFrame(() => renderCallouts(lastOutfitPieces));
  }
}

/* ---------------- Agregar prenda ---------------- */
let selectedCategory = null;
let selectedTags = new Set();
let pendingPhotoDataUrl = null;
let pendingPhotoColor = '#9a9a9a';

CATEGORIES.forEach(c => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = c.label;
  chip.addEventListener('click', () => {
    selectedCategory = c.key;
    document.querySelectorAll('#categoryChips .chip').forEach(el => el.classList.remove('selected'));
    chip.classList.add('selected');
    validateForm();
  });
  document.getElementById('categoryChips').appendChild(chip);
});

TAGS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = t.label;
  chip.addEventListener('click', () => {
    if (selectedTags.has(t.key)) {
      selectedTags.delete(t.key);
      chip.classList.remove('selected');
    } else {
      selectedTags.add(t.key);
      chip.classList.add('selected');
    }
    validateForm();
  });
  document.getElementById('tagChips').appendChild(chip);
});

/* Lightweight background removal: flood-fill from the border, matching
   pixels close to the sampled border color, assuming a plain/even backdrop. */
function removeBackground(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;

  let rSum = 0, gSum = 0, bSum = 0, count = 0;
  for (let x = 0; x < w; x++) {
    for (const y of [0, h - 1]) {
      const i = (y * w + x) * 4;
      rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2]; count++;
    }
  }
  for (let y = 0; y < h; y++) {
    for (const x of [0, w - 1]) {
      const i = (y * w + x) * 4;
      rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2]; count++;
    }
  }
  const bgR = rSum / count, bgG = gSum / count, bgB = bSum / count;
  const threshold = 38;
  const visited = new Uint8Array(w * h);
  const isBg = new Uint8Array(w * h);
  const queue = new Int32Array(w * h);
  let qHead = 0, qTail = 0;

  function colorDist(i) {
    const dr = data[i] - bgR, dg = data[i + 1] - bgG, db = data[i + 2] - bgB;
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }
  function tryEnqueue(x, y) {
    const idx = y * w + x;
    if (visited[idx]) return;
    visited[idx] = 1;
    const i = idx * 4;
    if (colorDist(i) < threshold) {
      isBg[idx] = 1;
      queue[qTail++] = idx;
    }
  }
  for (let x = 0; x < w; x++) { tryEnqueue(x, 0); tryEnqueue(x, h - 1); }
  for (let y = 0; y < h; y++) { tryEnqueue(0, y); tryEnqueue(w - 1, y); }

  while (qHead < qTail) {
    const idx = queue[qHead++];
    const x = idx % w, y = (idx / w) | 0;
    const neighbors = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
    for (const [nx, ny] of neighbors) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const nidx = ny * w + nx;
      if (visited[nidx]) continue;
      visited[nidx] = 1;
      const i = nidx * 4;
      if (colorDist(i) < threshold) {
        isBg[nidx] = 1;
        queue[qTail++] = nidx;
      }
    }
  }

  /* Second pass: catch background-colored pockets that are fully enclosed
     by the garment (e.g. the gap between two pant legs) and so were never
     reached by the border flood-fill above. */
  for (let idx = 0; idx < w * h; idx++) {
    if (!visited[idx] && colorDist(idx * 4) < threshold) {
      isBg[idx] = 1;
    }
  }

  for (let idx = 0; idx < w * h; idx++) {
    if (isBg[idx]) {
      data[idx * 4 + 3] = 0;
    } else {
      const x = idx % w, y = (idx / w) | 0;
      let edgeCount = 0;
      if (x > 0 && isBg[idx - 1]) edgeCount++;
      if (x < w - 1 && isBg[idx + 1]) edgeCount++;
      if (y > 0 && isBg[idx - w]) edgeCount++;
      if (y < h - 1 && isBg[idx + w]) edgeCount++;
      if (edgeCount > 0) data[idx * 4 + 3] = Math.round(255 * (1 - edgeCount * 0.12));
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

/* Crop the canvas to the bounding box of its non-transparent pixels, so a
   loosely-framed photo still fills the mannequin nicely. */
function cropToContent(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const data = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 10) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return canvas;
  const pad = 6;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
  return out;
}

/* Finds the most common color among the garment's opaque pixels (grouped
   into coarse buckets so a small logo/print doesn't skew a plain average),
   used to draw a solid-color illustrated version of the garment on the
   mannequin instead of stretching the real photo onto a fixed shape. */
function getDominantColor(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const data = ctx.getImageData(0, 0, w, h).data;
  const buckets = new Map();
  const total = w * h;
  const step = Math.max(1, Math.floor(total / 20000));
  for (let i = 0; i < total; i += step) {
    const idx = i * 4;
    if (data[idx + 3] < 200) continue;
    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
    const key = (r >> 4) + ',' + (g >> 4) + ',' + (b >> 4);
    let bucket = buckets.get(key);
    if (!bucket) { bucket = { r: 0, g: 0, b: 0, count: 0 }; buckets.set(key, bucket); }
    bucket.r += r; bucket.g += g; bucket.b += b; bucket.count++;
  }
  let best = null;
  for (const bucket of buckets.values()) {
    if (!best || bucket.count > best.count) best = bucket;
  }
  if (!best) return '#9a9a9a';
  const r = Math.round(best.r / best.count), g = Math.round(best.g / best.count), b = Math.round(best.b / best.count);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* AI background removal (works on any background, not just plain ones).
   Loaded lazily from a CDN the first time it's needed and cached by the
   browser after that. If it fails to load or times out for any reason
   (offline, CDN hiccup, slow device), we fall back to the lightweight
   flood-fill removal above so adding clothes never gets stuck. */
const IMGLY_CDN_URL = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/index.mjs';
let _imglyModulePromise = null;
function loadImgly() {
  if (!_imglyModulePromise) _imglyModulePromise = import(IMGLY_CDN_URL);
  return _imglyModulePromise;
}
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}
async function removeBackgroundAI(sourceCanvas) {
  const blob = await new Promise(res => sourceCanvas.toBlob(res, 'image/png'));
  const mod = await withTimeout(loadImgly(), 25000);
  const removeBg = mod.default || mod.removeBackground;
  const resultBlob = await withTimeout(
    removeBg(blob, { model: 'isnet_quint8', output: { format: 'image/png' } }),
    45000
  );
  const bitmap = await createImageBitmap(resultBlob);
  const out = document.createElement('canvas');
  out.width = bitmap.width; out.height = bitmap.height;
  out.getContext('2d').drawImage(bitmap, 0, 0);
  return out;
}

document.getElementById('photoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = async () => {
      const maxDim = 800;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);

      const processingEl = document.getElementById('photoProcessing');
      const errEl = document.getElementById('aiErrorMsg');
      errEl.style.display = 'none';
      processingEl.classList.add('show');
      document.getElementById('saveItemBtn').disabled = true;

      let finalCanvas;
      try {
        finalCanvas = await removeBackgroundAI(canvas);
      } catch (err) {
        console.warn('AI background removal no disponible, usando método simple:', err);
        errEl.textContent = 'IA no disponible (' + (err && err.message ? err.message : err) + ') — se usó el método simple';
        errEl.style.display = 'block';
        removeBackground(canvas);
        finalCanvas = canvas;
      }

      processingEl.classList.remove('show');
      const cropped = cropToContent(finalCanvas);
      pendingPhotoDataUrl = cropped.toDataURL('image/png');
      pendingPhotoColor = getDominantColor(cropped);
      document.getElementById('photoPreview').src = pendingPhotoDataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoPickerLabel').style.display = 'none';
      validateForm();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function validateForm() {
  const ok = pendingPhotoDataUrl && selectedCategory && selectedTags.size > 0;
  document.getElementById('saveItemBtn').disabled = !ok;
}

document.getElementById('saveItemBtn').addEventListener('click', async () => {
  const item = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    category: selectedCategory,
    tags: Array.from(selectedTags),
    photo: pendingPhotoDataUrl,
    color: pendingPhotoColor,
    createdAt: Date.now()
  };
  await dbAdd(item);

  pendingPhotoDataUrl = null;
  pendingPhotoColor = '#9a9a9a';
  selectedCategory = null;
  selectedTags = new Set();
  document.querySelectorAll('.chip').forEach(el => el.classList.remove('selected'));
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoPickerLabel').style.display = 'block';
  document.getElementById('photoInput').value = '';
  document.getElementById('aiErrorMsg').style.display = 'none';
  validateForm();

  if (navigator.vibrate) navigator.vibrate(15);
  switchView('closet');
});

/* ---------------- Clóset ---------------- */
let closetFilter = 'all';

function buildCatFilter() {
  const wrap = document.getElementById('catFilter');
  wrap.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'chip active';
  all.textContent = 'todo';
  all.addEventListener('click', () => { closetFilter = 'all'; renderCloset(); });
  wrap.appendChild(all);
  CATEGORIES.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = c.label;
    chip.addEventListener('click', () => { closetFilter = c.key; renderCloset(); });
    wrap.appendChild(chip);
  });
}
buildCatFilter();

async function renderCloset() {
  document.querySelectorAll('#catFilter .chip').forEach((el, i) => {
    const key = i === 0 ? 'all' : CATEGORIES[i - 1].key;
    el.classList.toggle('active', key === closetFilter);
  });

  const items = await dbGetAll();
  const filtered = closetFilter === 'all' ? items : items.filter(i => i.category === closetFilter);
  const grid = document.getElementById('closetGrid');
  grid.innerHTML = '';

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.style.gridColumn = '1 / -1';
    empty.className = 'emptyState';
    empty.style.padding = '40px 0';
    empty.textContent = '—';
    grid.appendChild(empty);
    return;
  }

  filtered.sort((a, b) => b.createdAt - a.createdAt).forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<img src="${item.photo}" /><div class="del">×</div>`;
    el.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await dbDelete(item.id);
      renderCloset();
    });
    grid.appendChild(el);
  });
}

/* ---------------- Combinar ---------------- */
function pickForCategory(items, category, tags) {
  const inCat = items.filter(i => i.category === category);
  if (!inCat.length) return null;
  const matching = inCat.filter(i => i.tags.some(t => tags.includes(t)));
  const pool = matching.length ? matching : inCat;
  return pool[Math.floor(Math.random() * pool.length)];
}

let lastGuessedTags = null;

/* Illustrated garment shapes, drawn in solid color (from getDominantColor)
   instead of the real photo — a real photo's exact cut/length never matches
   a fixed silhouette, but a flat color always "fits" perfectly, same idea
   as the reference drawing. */
const SHAPE_D = {
  top: 'M84 66 C 90 70, 110 70, 116 66 L 136 66 C 148 68, 160 78, 162 94 C 163 104, 156 112, 146 116 L 138 126 L 138 226 L 62 226 L 62 126 L 54 116 C 44 112, 37 104, 38 94 C 40 78, 52 68, 64 66 Z',
  bottom: 'M65 198 L135 198 L135 226 L131 344 L127 404 L108 404 L100 230 L92 404 L73 404 L69 344 L65 226 Z',
  calzado: 'M58 394 C58 390,62 388,68 388 L84 388 C90 388,94 392,94 398 C94 406,88 410,76 410 C64 410,58 406,58 398 Z M106 394 C106 390,110 388,116 388 L132 388 C138 388,142 392,142 398 C142 406,136 410,124 410 C112 410,106 406,106 398 Z',
  vestido: 'M84 66 C 90 70, 110 70, 116 66 L 136 66 C 148 68, 160 78, 162 94 C 163 104, 156 112, 146 116 L 138 126 L 138 226 L 150 400 L 50 400 L 62 226 L 62 126 L 54 116 C 44 112, 37 104, 38 94 C 40 78, 52 68, 64 66 Z',
  abrigo: 'M82 62 C 88 67, 112 67, 118 62 L 140 62 C 154 64, 168 76, 170 96 C 171 108, 162 118, 150 122 L 142 132 L 142 280 L 58 280 L 58 132 L 50 122 C 38 118, 29 108, 30 96 C 32 76, 46 64, 60 62 Z'
};

function svgShape(d, color) {
  const ns = 'http://www.w3.org/2000/svg';
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', color || '#9a9a9a');
  path.setAttribute('filter', 'url(#clothShadow)');
  return path;
}

/* Anchor points (in the mannequin's 200x480 viewBox) that each garment
   callout line starts from, and which side of the mannequin its real-photo
   badge sits on — mirrors the reference image's "line pointing out to a
   small photo of the actual piece" layout. */
const CALLOUT_ANCHORS = {
  top:     { x: 48,  y: 95,  side: 'left'  },
  vestido: { x: 48,  y: 150, side: 'left'  },
  abrigo:  { x: 152, y: 170, side: 'right' },
  bottom:  { x: 152, y: 300, side: 'right' },
  calzado: { x: 48,  y: 400, side: 'left'  }
};

let lastOutfitPieces = null;

function renderCallouts(pieces) {
  lastOutfitPieces = pieces;
  const stage = document.getElementById('mannequinStage');
  const wrap = stage.querySelector('.mannequinWrap');
  const svgLines = document.getElementById('calloutLines');
  const badgesWrap = document.getElementById('calloutBadges');
  const ns = 'http://www.w3.org/2000/svg';

  svgLines.innerHTML = '';
  badgesWrap.innerHTML = '';

  const stageRect = stage.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  if (!stageRect.width || !wrapRect.width) return;

  svgLines.setAttribute('width', stageRect.width);
  svgLines.setAttribute('height', stageRect.height);

  const scaleX = wrapRect.width / 200;
  const scaleY = wrapRect.height / 480;
  const offsetX = wrapRect.left - stageRect.left;
  const offsetY = wrapRect.top - stageRect.top;

  pieces.forEach(([label, item]) => {
    const a = CALLOUT_ANCHORS[label];
    if (!a) return;
    const anchorX = offsetX + a.x * scaleX;
    const anchorY = offsetY + a.y * scaleY;
    const badgeEdgeX = a.side === 'left' ? 44 : stageRect.width - 44;

    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', anchorX);
    line.setAttribute('y1', anchorY);
    line.setAttribute('x2', badgeEdgeX);
    line.setAttribute('y2', anchorY);
    svgLines.appendChild(line);

    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', anchorX);
    dot.setAttribute('cy', anchorY);
    dot.setAttribute('r', 2.5);
    dot.setAttribute('class', 'dot');
    svgLines.appendChild(dot);

    const badge = document.createElement('div');
    badge.className = 'calloutBadge';
    badge.style.top = anchorY + 'px';
    badge.style[a.side] = '0px';
    badge.innerHTML = `<img src="${item.photo}" /><span>${label}</span>`;
    badgesWrap.appendChild(badge);
  });
}

let calloutResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(calloutResizeTimer);
  calloutResizeTimer = setTimeout(() => {
    if (lastOutfitPieces) renderCallouts(lastOutfitPieces);
  }, 150);
});

function svgImage(href, x, y, w, h, clipId) {
  const ns = 'http://www.w3.org/2000/svg';
  const img = document.createElementNS(ns, 'image');
  img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', href);
  img.setAttribute('href', href);
  img.setAttribute('x', x);
  img.setAttribute('y', y);
  img.setAttribute('width', w);
  img.setAttribute('height', h);
  if (clipId) {
    /* "slice" (cover) fills the whole clothing silhouette with the photo,
       instead of floating the whole photo inside a box — this is what
       makes the garment look worn instead of pasted on top. */
    img.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    img.setAttribute('clip-path', 'url(#' + clipId + ')');
  } else {
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  }
  img.setAttribute('filter', 'url(#clothShadow)');
  return img;
}

async function buildOutfit() {
  const items = await dbGetAll();
  const empty = document.getElementById('combinarEmpty');
  const result = document.getElementById('combinarResult');
  const shuffleRow = document.getElementById('shuffleRow');
  const clothingLayer = document.getElementById('clothingLayer');

  if (!items.length) {
    empty.innerHTML = '<div>agrega algunas prendas primero</div><button id="goToAgregar2">agregar ropa</button>';
    document.getElementById('goToAgregar2').addEventListener('click', () => switchView('agregar'));
    empty.style.display = 'flex';
    result.style.display = 'none';
    shuffleRow.style.display = 'none';
    document.getElementById('guessTag').textContent = '';
    return;
  }

  const text = document.getElementById('occasionInput').value.trim();
  const tags = text ? guessTags(text) : lastGuessedTags || ['casual'];
  lastGuessedTags = tags;
  document.getElementById('guessTag').textContent = tags.join(' · ');

  const pieces = [];
  const dress = Math.random() < 0.35 ? pickForCategory(items, 'dress', tags) : null;
  if (dress) {
    pieces.push(['vestido', dress]);
  } else {
    const top = pickForCategory(items, 'top', tags);
    const bottom = pickForCategory(items, 'bottom', tags);
    if (top) pieces.push(['top', top]);
    if (bottom) pieces.push(['bottom', bottom]);
  }
  const shoes = pickForCategory(items, 'shoes', tags);
  if (shoes) pieces.push(['calzado', shoes]);

  if (Math.random() < 0.5) {
    const outer = pickForCategory(items, 'outerwear', tags);
    if (outer) pieces.push(['abrigo', outer]);
  }
  if (Math.random() < 0.4) {
    const acc = pickForCategory(items, 'accessory', tags);
    if (acc) pieces.push(['accesorio', acc]);
  }

  if (!pieces.length) {
    empty.style.display = 'flex';
    empty.innerHTML = '<div>no hay suficientes prendas para esa combinación todavía</div>';
    result.style.display = 'none';
    shuffleRow.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  result.style.display = 'flex';
  shuffleRow.style.display = 'flex';

  clothingLayer.innerHTML = '';
  const byLabel = Object.fromEntries(pieces);

  if (byLabel['vestido']) {
    clothingLayer.appendChild(svgShape(SHAPE_D.vestido, byLabel['vestido'].color));
  } else {
    if (byLabel['bottom']) clothingLayer.appendChild(svgShape(SHAPE_D.bottom, byLabel['bottom'].color));
    if (byLabel['top']) clothingLayer.appendChild(svgShape(SHAPE_D.top, byLabel['top'].color));
  }
  if (byLabel['abrigo']) clothingLayer.appendChild(svgShape(SHAPE_D.abrigo, byLabel['abrigo'].color));
  if (byLabel['calzado']) {
    clothingLayer.appendChild(svgShape(SHAPE_D.calzado, byLabel['calzado'].color));
  }

  requestAnimationFrame(() => renderCallouts(pieces));
}

document.getElementById('occasionGo').addEventListener('click', buildOutfit);
document.getElementById('occasionInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') buildOutfit();
});
document.getElementById('shuffleBtn').addEventListener('click', buildOutfit);

/* ---------------- Init ---------------- */
buildOutfit();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
