<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

<link rel="manifest" href="manifest.json" />

<style>
  .tabs {
    display: flex;
    gap: 22px;
    justify-content: center;
    margin-top: 4px;
    margin-bottom: 20px;
  }
  .tab {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
  }
  .tab.active {
    color: var(--text);
    border-bottom: 1px solid var(--text);
  }

  .view { display: none; flex: 1; flex-direction: column; }
  .view.active { display: flex; }

  /* ---- Combinar ---- */
  .occasionRow {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .occasionRow input {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
  }
  .occasionRow input::placeholder { color: var(--text-dim); }
  .goBtn {
    width: 46px;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .goBtn svg { width: 18px; height: 18px; }

  .emptyState {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 0 20px;
  }
  .emptyState button {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    color: var(--text);
    font-size: 13px;
  }

  .guessTag {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    min-height: 14px;
  }

  .mannequinWrap {
    width: min(56vw, 230px);
    margin: 0 auto;
    aspect-ratio: 200 / 480;
  }
  .mannequinWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .outline {
    fill: none;
    stroke: var(--text-dim);
    stroke-width: 1.6;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .pieceChips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }
  .pieceChips .pchip {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px 4px 4px;
  }
  .pieceChips .pchip img {
    width: 22px; height: 22px;
    border-radius: 50%;
    object-fit: cover;
  }
  .pieceChips .pchip span {
    font-size: 10px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .shuffleRow {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .shuffleBtn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .shuffleBtn svg { width: 22px; height: 22px; }
  .shuffleBtn:active { transform: scale(0.94); }

  /* ---- Clóset ---- */
  .catFilter {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
  }
  .catFilter .chip {
    flex-shrink: 0;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
  }
  .catFilter .chip.active {
    color: var(--bg);
    background: var(--text);
    border-color: var(--text);
  }

  .closetGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    flex: 1;
    align-content: start;
    overflow-y: auto;
  }
  .closetGrid .item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
  }
  .closetGrid .item img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .closetGrid .item .del {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(10,10,12,0.75);
    color: var(--text);
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---- Agregar ---- */
  .fieldGroup { margin-bottom: 24px; }
  .fieldLabel {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .chipRow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chipRow .chip {
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
  }
  .chipRow .chip.selected {
    color: var(--bg);
    background: var(--text);
    border-color: var(--text);
  }

  .photoPicker {
    width: 100%;
    aspect-ratio: 1.4;
    border: 1px dashed var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    overflow: hidden;
    position: relative;
  }
  .photoPicker img {
    width: 100%; height: 100%; object-fit: contain;
    position: absolute; inset: 0;
  }
  .photoPicker input {
    position: absolute; inset: 0;
    opacity: 0;
  }
  .photoHint {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 10px;
    margin-bottom: 24px;
  }

  .saveBtn {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    padding: 15px;
    border-radius: 10px;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .saveBtn:disabled { opacity: 0.35; }
</style>

<body>
  <div class="screen">

<script>
/* ---------------- IndexedDB helper ---------------- */
const DB_NAME = 'closet_db';
const STORE = 'items';
let dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(STORE)) {
      db.createObjectStore(STORE, { keyPath: 'id' });
    }
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

async function dbAdd(item) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll() {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------------- Categories & tags ---------------- */
const CATEGORIES = [
  { key: 'top', label: 'top' },
  { key: 'bottom', label: 'bottom' },
  { key: 'dress', label: 'vestido' },
  { key: 'shoes', label: 'calzado' },
  { key: 'outerwear', label: 'abrigo' },
  { key: 'accessory', label: 'accesorio' }
];
const TAGS = [
  { key: 'formal', label: 'formal' },
  { key: 'trabajo', label: 'trabajo' },
  { key: 'casual', label: 'casual' },
  { key: 'deportivo', label: 'deportivo' },
  { key: 'elegante', label: 'elegante' }
];
const KEYWORD_MAP = {
  formal: ['formal', 'reunion', 'reunión', 'entrevista', 'presentacion', 'presentación', 'junta', 'importante'],
  trabajo: ['trabajo', 'oficina', 'laboral'],
  elegante: ['elegante', 'fiesta', 'boda', 'gala', 'cena', 'cita', 'evento'],
  deportivo: ['deporte', 'deportivo', 'gym', 'gimnasio', 'correr', 'ejercicio', 'entrenar', 'trotar'],
  casual: ['casual', 'salir', 'amigos', 'parque', 'caminar', 'compras', 'relajado']
};

function guessTags(text) {
  const t = text.toLowerCase();
  const found = [];
  for (const key in KEYWORD_MAP) {
    if (KEYWORD_MAP[key].some(kw => t.includes(kw))) found.push(key);
  }
  return found.length ? found : ['casual'];
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchView(t.dataset.view));
});
document.getElementById('goToAgregar').addEventListener('click', () => switchView('agregar'));

function switchView(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'closet') renderCloset();
}

/* ---------------- Agregar prenda ---------------- */
let selectedCategory = null;
let selectedTags = new Set();
let pendingPhotoDataUrl = null;

CATEGORIES.forEach(c => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = c.label;
  chip.addEventListener('click', () => {
    selectedCategory = c.key;
    document.querySelectorAll('#categoryChips .chip').forEach(el => el.classList.remove('selected'));
    chip.classList.add('selected');
    validateForm();
  });
  document.getElementById('categoryChips').appendChild(chip);
});

TAGS.forEach(t => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = t.label;
  chip.addEventListener('click', () => {
    if (selectedTags.has(t.key)) {
      selectedTags.delete(t.key);
      chip.classList.remove('selected');
    } else {
      selectedTags.add(t.key);
      chip.classList.add('selected');
    }
    validateForm();
  });
  document.getElementById('tagChips').appendChild(chip);
});

/* Lightweight background removal: flood-fill from the border, matching
   pixels close to the sampled border color, assuming a plain/even backdrop. */
function removeBackground(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;

  let rSum = 0, gSum = 0, bSum = 0, count = 0;
  for (let x = 0; x < w; x++) {
    for (const y of [0, h - 1]) {
      const i = (y * w + x) * 4;
      rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2]; count++;
    }
  }
  for (let y = 0; y < h; y++) {
    for (const x of [0, w - 1]) {
      const i = (y * w + x) * 4;
      rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2]; count++;
    }
  }
  const bgR = rSum / count, bgG = gSum / count, bgB = bSum / count;
  const threshold = 38;
  const visited = new Uint8Array(w * h);
  const isBg = new Uint8Array(w * h);
  const queue = new Int32Array(w * h);
  let qHead = 0, qTail = 0;

  function colorDist(i) {
    const dr = data[i] - bgR, dg = data[i + 1] - bgG, db = data[i + 2] - bgB;
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }
  function tryEnqueue(x, y) {
    const idx = y * w + x;
    if (visited[idx]) return;
    visited[idx] = 1;
    const i = idx * 4;
    if (colorDist(i) < threshold) {
      isBg[idx] = 1;
      queue[qTail++] = idx;
    }
  }
  for (let x = 0; x < w; x++) { tryEnqueue(x, 0); tryEnqueue(x, h - 1); }
  for (let y = 0; y < h; y++) { tryEnqueue(0, y); tryEnqueue(w - 1, y); }

  while (qHead < qTail) {
    const idx = queue[qHead++];
    const x = idx % w, y = (idx / w) | 0;
    const neighbors = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
    for (const [nx, ny] of neighbors) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const nidx = ny * w + nx;
      if (visited[nidx]) continue;
      visited[nidx] = 1;
      const i = nidx * 4;
      if (colorDist(i) < threshold) {
        isBg[nidx] = 1;
        queue[qTail++] = nidx;
      }
    }
  }

  for (let idx = 0; idx < w * h; idx++) {
    if (isBg[idx]) {
      data[idx * 4 + 3] = 0;
    } else {
      const x = idx % w, y = (idx / w) | 0;
      let edgeCount = 0;
      if (x > 0 && isBg[idx - 1]) edgeCount++;
      if (x < w - 1 && isBg[idx + 1]) edgeCount++;
      if (y > 0 && isBg[idx - w]) edgeCount++;
      if (y < h - 1 && isBg[idx + w]) edgeCount++;
      if (edgeCount > 0) data[idx * 4 + 3] = Math.round(255 * (1 - edgeCount * 0.12));
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

/* Crop the canvas to the bounding box of its non-transparent pixels, so a
   loosely-framed photo still fills the mannequin nicely. */
function cropToContent(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const data = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 10) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return canvas;
  const pad = 6;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
  return out;
}

document.getElementById('photoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 800;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      removeBackground(canvas);
      const cropped = cropToContent(canvas);
      pendingPhotoDataUrl = cropped.toDataURL('image/png');
      document.getElementById('photoPreview').src = pendingPhotoDataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoPickerLabel').style.display = 'none';
      validateForm();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function validateForm() {
  const ok = pendingPhotoDataUrl && selectedCategory && selectedTags.size > 0;
  document.getElementById('saveItemBtn').disabled = !ok;
}

document.getElementById('saveItemBtn').addEventListener('click', async () => {
  const item = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    category: selectedCategory,
    tags: Array.from(selectedTags),
    photo: pendingPhotoDataUrl,
    createdAt: Date.now()
  };
  await dbAdd(item);

  pendingPhotoDataUrl = null;
  selectedCategory = null;
  selectedTags = new Set();
  document.querySelectorAll('.chip').forEach(el => el.classList.remove('selected'));
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoPickerLabel').style.display = 'block';
  document.getElementById('photoInput').value = '';
  validateForm();

  if (navigator.vibrate) navigator.vibrate(15);
  switchView('closet');
});

/* ---------------- Clóset ---------------- */
let closetFilter = 'all';

function buildCatFilter() {
  const wrap = document.getElementById('catFilter');
  wrap.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'chip active';
  all.textContent = 'todo';
  all.addEventListener('click', () => { closetFilter = 'all'; renderCloset(); });
  wrap.appendChild(all);
  CATEGORIES.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = c.label;
    chip.addEventListener('click', () => { closetFilter = c.key; renderCloset(); });
    wrap.appendChild(chip);
  });
}
buildCatFilter();

async function renderCloset() {
  document.querySelectorAll('#catFilter .chip').forEach((el, i) => {
    const key = i === 0 ? 'all' : CATEGORIES[i - 1].key;
    el.classList.toggle('active', key === closetFilter);
  });

  const items = await dbGetAll();
  const filtered = closetFilter === 'all' ? items : items.filter(i => i.category === closetFilter);
  const grid = document.getElementById('closetGrid');
  grid.innerHTML = '';

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.style.gridColumn = '1 / -1';
    empty.className = 'emptyState';
    empty.style.padding = '40px 0';
    empty.textContent = '—';
    grid.appendChild(empty);
    return;
  }

  filtered.sort((a, b) => b.createdAt - a.createdAt).forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<img src="${item.photo}" /><div class="del">×</div>`;
    el.querySelector('.del').addEventListener('click', async (e) => {
      e.stopPropagation();
      await dbDelete(item.id);
      renderCloset();
    });
    grid.appendChild(el);
  });
}

/* ---------------- Combinar ---------------- */
function pickForCategory(items, category, tags) {
  const inCat = items.filter(i => i.category === category);
  if (!inCat.length) return null;
  const matching = inCat.filter(i => i.tags.some(t => tags.includes(t)));
  const pool = matching.length ? matching : inCat;
  return pool[Math.floor(Math.random() * pool.length)];
}

let lastGuessedTags = null;

function svgImage(href, x, y, w, h) {
  const ns = 'http://www.w3.org/2000/svg';
  const img = document.createElementNS(ns, 'image');
  img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', href);
  img.setAttribute('href', href);
  img.setAttribute('x', x);
  img.setAttribute('y', y);
  img.setAttribute('width', w);
  img.setAttribute('height', h);
  img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  img.setAttribute('filter', 'url(#clothShadow)');
  return img;
}

async function buildOutfit() {
  const items = await dbGetAll();
  const empty = document.getElementById('combinarEmpty');
  const result = document.getElementById('combinarResult');
  const shuffleRow = document.getElementById('shuffleRow');
  const chipsWrap = document.getElementById('pieceChips');
  const clothingLayer = document.getElementById('clothingLayer');

  if (!items.length) {
    empty.innerHTML = '<div>agrega algunas prendas primero</div><button id="goToAgregar2">agregar ropa</button>';
    document.getElementById('goToAgregar2').addEventListener('click', () => switchView('agregar'));
    empty.style.display = 'flex';
    result.style.display = 'none';
    shuffleRow.style.display = 'none';
    document.getElementById('guessTag').textContent = '';
    return;
  }

  const text = document.getElementById('occasionInput').value.trim();
  const tags = text ? guessTags(text) : lastGuessedTags || ['casual'];
  lastGuessedTags = tags;
  document.getElementById('guessTag').textContent = tags.join(' · ');

  const pieces = [];
  const dress = Math.random() < 0.35 ? pickForCategory(items, 'dress', tags) : null;
  if (dress) {
    pieces.push(['vestido', dress]);
  } else {
    const top = pickForCategory(items, 'top', tags);
    const bottom = pickForCategory(items, 'bottom', tags);
    if (top) pieces.push(['top', top]);
    if (bottom) pieces.push(['bottom', bottom]);
  }
  const shoes = pickForCategory(items, 'shoes', tags);
  if (shoes) pieces.push(['calzado', shoes]);

  if (Math.random() < 0.5) {
    const outer = pickForCategory(items, 'outerwear', tags);
    if (outer) pieces.push(['abrigo', outer]);
  }
  if (Math.random() < 0.4) {
    const acc = pickForCategory(items, 'accessory', tags);
    if (acc) pieces.push(['accesorio', acc]);
  }

  if (!pieces.length) {
    empty.style.display = 'flex';
    empty.innerHTML = '<div>no hay suficientes prendas para esa combinación todavía</div>';
    result.style.display = 'none';
    shuffleRow.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  result.style.display = 'flex';
  shuffleRow.style.display = 'flex';

  clothingLayer.innerHTML = '';
  const byLabel = Object.fromEntries(pieces);

  if (byLabel['vestido']) {
    clothingLayer.appendChild(svgImage(byLabel['vestido'].photo, 35, 46, 130, 430));
  } else {
    if (byLabel['bottom']) clothingLayer.appendChild(svgImage(byLabel['bottom'].photo, 40, 200, 120, 275));
    if (byLabel['top']) clothingLayer.appendChild(svgImage(byLabel['top'].photo, 35, 48, 130, 185));
  }
  if (byLabel['abrigo']) clothingLayer.appendChild(svgImage(byLabel['abrigo'].photo, 30, 44, 140, 195));
  if (byLabel['calzado']) {
    clothingLayer.appendChild(svgImage(byLabel['calzado'].photo, 46, 438, 50, 44));
    clothingLayer.appendChild(svgImage(byLabel['calzado'].photo, 104, 438, 50, 44));
  }

  chipsWrap.innerHTML = '';
  pieces.forEach(([label, item]) => {
    const chip = document.createElement('div');
    chip.className = 'pchip';
    chip.innerHTML = `<img src="${item.photo}" /><span>${label}</span>`;
    chipsWrap.appendChild(chip);
  });
}

document.getElementById('occasionGo').addEventListener('click', buildOutfit);
document.getElementById('occasionInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') buildOutfit();
});
document.getElementById('shuffleBtn').addEventListener('click', buildOutfit);

/* ---------------- Init ---------------- */
buildOutfit();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
