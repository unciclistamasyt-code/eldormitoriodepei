<style>
  /* Mismo fix que golf.html: en desktop, .screen (del style.css compartido)
     no tiene max-width y se estira a todo el navegador. */
  .screen { max-width: 760px; margin: 0 auto; }

  :root { --food: #e0a84e; --food-dim: rgba(224,168,78,0.14); }

  .scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
  }

  /* ---- Hero ---- */
  .hero {
    position: relative;
    border-radius: 22px;
    padding: 22px 20px 20px;
    margin-bottom: 18px;
    background: linear-gradient(145deg, rgba(224,168,78,0.16), rgba(10,10,12,0) 62%), var(--bg-soft);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute; right: -36px; top: -36px; width: 170px; height: 170px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224,168,78,0.2), transparent 70%);
    pointer-events: none;
  }
  .hero-eyebrow { position: relative; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--food); font-weight: 700; margin-bottom: 9px; }
  .hero-title { position: relative; font-size: 21px; line-height: 1.3; font-weight: 800; margin: 0 0 7px; }
  .hero-sub { position: relative; font-size: 13px; color: var(--text-dim); margin: 0 0 10px; line-height: 1.5; }
  .hero-disclaimer { position: relative; font-size: 10.5px; color: var(--text-dim); opacity: 0.75; margin: 0; line-height: 1.4; }

  /* ---- Tarjeta "hoy" ---- */
  .today-card {
    border: 1px solid var(--food); border-radius: 18px;
    padding: 16px; margin-bottom: 18px;
    background: var(--food-dim);
  }
  .today-eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--food); font-weight: 700; margin-bottom: 4px; }
  .today-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .today-meals { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; }
  .today-meals b { color: var(--text); font-weight: 600; }
  .today-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--food); color: #0a0a0c; font-weight: 700; font-size: 12.5px;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }

  /* ---- Grilla de días ---- */
  .week-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  @media (min-width: 420px) { .week-grid { grid-template-columns: repeat(7, 1fr); } }
  .day-chip {
    border: 1px solid var(--line); border-radius: 13px; padding: 10px 4px;
    text-align: center; cursor: pointer;
  }
  .day-chip.ayuno { border-color: rgba(224,168,78,0.4); }
  .day-chip.open { border-color: var(--food); background: var(--food-dim); }
  .day-chip-name { font-size: 11px; font-weight: 700; }
  .day-chip-tag { font-size: 8.5px; color: var(--text-dim); margin-top: 2px; }

  /* ---- Panel de detalle de un día ---- */
  .day-detail { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
  .day-detail-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .day-detail-head h2 { font-size: 16px; margin: 0; font-weight: 700; }
  .day-detail-totals { font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }
  .day-detail-totals b { color: var(--text); }

  .meal-block { margin-bottom: 16px; }
  .meal-block:last-child { margin-bottom: 0; }
  .meal-title { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
  .meal-macros { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
  .meal-macros span { margin-right: 10px; }
  .meal-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .meal-table th, .meal-table td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
  .meal-table th { color: var(--text-dim); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em; }
  .meal-table td.num { text-align: right; white-space: nowrap; }
  .meal-table th.num { text-align: right; }
  .meal-table tr:last-child td { border-bottom: none; }
  .meal-empty { font-size: 11.5px; color: var(--text-dim); font-style: italic; }

  /* ---- Metas / totales ---- */
  .panel { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
  .panel-title { font-size: 13.5px; font-weight: 600; margin-bottom: 12px; }
  .goals-table, .totals-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .goals-table th, .goals-table td, .totals-table th, .totals-table td {
    text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line);
  }
  .goals-table th, .totals-table th { color: var(--text-dim); font-weight: 600; font-size: 10px; text-transform: uppercase; }
  .goals-table td.num, .goals-table th.num, .totals-table td.num, .totals-table th.num { text-align: right; }
  .goals-table tr:last-child td, .totals-table tr:last-child td { border-bottom: none; }
  .totals-table tr.meta-row td { color: var(--text-dim); font-size: 11px; font-weight: 600; }

  /* ---- Tips accordion ---- */
  .tip-group { margin-bottom: 10px; }
  .tip-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 2px; cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .tip-head h3 { font-size: 13.5px; margin: 0; font-weight: 600; }
  .tip-head .chev { width: 13px; height: 13px; stroke: var(--text-dim); fill: none; stroke-width: 1.8; transition: transform 0.2s ease; flex-shrink: 0; }
  .tip-group.open .tip-head .chev { transform: rotate(90deg); }
  .tip-body { display: none; padding: 12px 2px 4px; font-size: 12.5px; color: var(--text-dim); line-height: 1.6; }
  .tip-group.open .tip-body { display: block; }
  .tip-body ul { margin: 0; padding-left: 18px; }
  .tip-body li { margin-bottom: 8px; }
  .tip-body b { color: var(--text); }

  .footer-disclaimer { text-align: center; font-size: 10.5px; color: var(--text-dim); opacity: 0.7; margin: 10px 0 24px; line-height: 1.5; }
</style>
</head>

/* resumen corto (desayuno/almuerzo/cena) para la tarjeta "hoy" y los chips */
function shortSummary(day) {
  const alm = day.sebMeals === 2
    ? `Sebastián: ayuno · María: ${day.meals[1].title.split(': ')[1]}`
    : day.meals[1].title.split(': ')[1];
  const cena = day.meals[2].title.split(': ')[1];
  return { desayuno: 'Huevo + hashbrown + yogur', almuerzo: alm, cena: cena };
}

const GOALS = [
  { who: 'Sebastián, 3 comidas (dom, lun, mié)', kcal: 2000, prot: 155, fib: 38 },
  { who: 'Sebastián, 2 comidas (mar, jue, vie, sáb)', kcal: 1800, prot: 155, fib: 34 },
  { who: 'María (3 comidas todos los días)', kcal: 1600, prot: 120, fib: 28 },
];

/* ---- Render ---- */
let openDayId = null;

function fmtMacro(arr) {
  if (!arr) return '';
  return `${arr[0]} kcal · ${arr[1]} g P · ${arr[2]} g F`;
}

function renderMealTable(meal) {
  if (meal.ayuno) return `<div class="meal-empty">Sebastián no come en este horario (ayuno).</div>`;
  const rows = meal.items.map(it => `
    <tr>
      <td>${it[0]}</td>
      <td class="num">${it[1]}</td>
      <td class="num">${it[2]}</td>
      <td class="num">${it[3]}</td>
      <td class="num">${it[4]}</td>
    </tr>`).join('');
  return `
    <table class="meal-table">
      <thead><tr><th>Ingrediente</th><th class="num">Seb.</th><th class="num">María</th><th class="num">Total</th><th class="num">Crudo</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderDayDetail(day) {
  const macrosLine = [];
  day.meals.forEach(m => {
    if (m.ayuno) return;
    const parts = [];
    if (m.seb) parts.push(`Seb: ${fmtMacro(m.seb)}`);
    if (m.maria) parts.push(`María: ${fmtMacro(m.maria)}`);
    macrosLine.push(parts.join(' · '));
  });

  return `
    <div class="day-detail" id="detail-${day.id}">
      <div class="day-detail-head"><h2>${day.name}</h2></div>
      <div class="day-detail-totals">
        Total del día — <b>Sebastián:</b> ${fmtMacro(day.total.seb)}${day.sebMeals === 2 ? ' (2 comidas)' : ''} ·
        <b>María:</b> ${fmtMacro(day.total.maria)}
      </div>
      ${day.meals.map(m => `
        <div class="meal-block">
          <div class="meal-title">${m.title}</div>
          <div class="meal-macros">${m.ayuno ? '' : [m.seb ? `<span>Sebastián: ${fmtMacro(m.seb)}</span>` : '', m.maria ? `<span>María: ${fmtMacro(m.maria)}</span>` : ''].join('')}</div>
          ${renderMealTable(m)}
        </div>
      `).join('')}
    </div>`;
}

function toggleDay(id) {
  openDayId = (openDayId === id) ? null : id;
  render();
  if (openDayId) {
    const el = document.getElementById('detail-' + openDayId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const todayIdx = new Date().getDay(); // 0=domingo
  const today = DAYS[todayIdx];
  const sum = shortSummary(today);

  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML = `
    <div class="hero-eyebrow">🍽️ Horario de comidas</div>
    <h1 class="hero-title">Sebastián y María</h1>
    <p class="hero-sub">De domingo a sábado — se repite igual cada semana. Los dos comen lo mismo y cada uno se sirve su porción. María suma un snack de yogur, fresas y almendras todos los días; el huevo del desayuno se repite siempre, el resto de las proteínas rota sin repetir el día anterior.</p>
    <p class="hero-disclaimer">Valores aproximados. No sustituye la guía de un médico o nutricionista.</p>
  `;
  app.appendChild(hero);

  const todayCard = document.createElement('div');
  todayCard.className = 'today-card';
  todayCard.innerHTML = `
    <div class="today-eyebrow">Hoy</div>
    <div class="today-title">${today.name}${today.tag ? ' · ' + today.tag : ''}</div>
    <div class="today-meals">
      <div><b>Desayuno:</b> ${sum.desayuno}</div>
      <div><b>Almuerzo:</b> ${sum.almuerzo}</div>
      <div><b>Cena:</b> ${sum.cena}</div>
    </div>
    <div class="today-toggle">Ver detalle de hoy →</div>
  `;
  todayCard.querySelector('.today-toggle').addEventListener('click', () => toggleDay(today.id));
  app.appendChild(todayCard);

  const grid = document.createElement('div');
  grid.className = 'week-grid';
  DAYS.forEach(day => {
    const chip = document.createElement('div');
    chip.className = 'day-chip' + (day.tag ? ' ayuno' : '') + (openDayId === day.id ? ' open' : '');
    chip.innerHTML = `
      <div class="day-chip-name">${day.name.slice(0, 3)}</div>
      <div class="day-chip-tag">${day.tag ? 'Ayuno' : day.sebMeals + ' comidas'}</div>
    `;
    chip.addEventListener('click', () => toggleDay(day.id));
    grid.appendChild(chip);
  });
  app.appendChild(grid);

  if (openDayId) {
    const day = DAYS.find(d => d.id === openDayId);
    const detailWrap = document.createElement('div');
    detailWrap.innerHTML = renderDayDetail(day);
    app.appendChild(detailWrap.firstElementChild);
  }

  const goalsPanel = document.createElement('div');
  goalsPanel.className = 'panel';
  goalsPanel.innerHTML = `
    <div class="panel-title">Metas diarias</div>
    <table class="goals-table">
      <thead><tr><th>Quién</th><th class="num">Kcal</th><th class="num">Prot. (g)</th><th class="num">Fibra (g)</th></tr></thead>
      <tbody>
        ${GOALS.map(g => `<tr><td>${g.who}</td><td class="num">${g.kcal}</td><td class="num">${g.prot}</td><td class="num">${g.fib}</td></tr>`).join('')}
      </tbody>
    </table>
  `;
  app.appendChild(goalsPanel);

  const totalsPanel = document.createElement('div');
  totalsPanel.className = 'panel';
  totalsPanel.innerHTML = `
    <div class="panel-title">Totales por día</div>
    <table class="totals-table">
      <thead><tr><th>Día</th><th class="num">Seb. kcal</th><th class="num">Seb. P</th><th class="num">Seb. F</th><th class="num">María kcal</th><th class="num">María P</th><th class="num">María F</th></tr></thead>
      <tbody>
        ${DAYS.map(d => `<tr><td>${d.name}</td><td class="num">${d.total.seb[0]}</td><td class="num">${d.total.seb[1]}</td><td class="num">${d.total.seb[2]}</td><td class="num">${d.total.maria[0]}</td><td class="num">${d.total.maria[1]}</td><td class="num">${d.total.maria[2]}</td></tr>`).join('')}
        <tr class="meta-row"><td>Meta</td><td class="num">1,800–2,000</td><td class="num">155</td><td class="num">34–38</td><td class="num">1,600</td><td class="num">120</td><td class="num">28</td></tr>
      </tbody>
    </table>
  `;
  app.appendChild(totalsPanel);

  const tipsPanel = document.createElement('div');
  tipsPanel.className = 'panel';
  tipsPanel.innerHTML = `<div class="panel-title">Pendientes y recomendaciones</div>`;
  TIPS.forEach(t => {
    const group = document.createElement('div');
    group.className = 'tip-group';
    group.innerHTML = `
      <div class="tip-head">
        <h3>${t.title}</h3>
        <svg class="chev" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>
      </div>
      <div class="tip-body">${t.body}</div>
    `;
    group.querySelector('.tip-head').addEventListener('click', () => {
      group.classList.toggle('open');
    });
    tipsPanel.appendChild(group);
  });
  app.appendChild(tipsPanel);

  const footer = document.createElement('div');
  footer.className = 'footer-disclaimer';
  footer.textContent = 'Valores aproximados. No sustituye la guía de un médico o nutricionista.';
  app.appendChild(footer);
}
